<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Inspection catalog loader/cache harness</title></head>
  <body>
    <button id="run" type="button">Run catalog loader/cache checks</button>
    <pre id="result">Ready</pre>
    <script type="module">
      import { localDatabase } from "/src/db/localDatabase.ts";
      import { loadInspectionCatalog } from "/src/referenceData/referenceDataApi.ts";
      import {
        getCachedInspectionCatalog,
        refreshInspectionReferenceData
      } from "/src/referenceData/referenceDataCache.ts";
      import { parseInspectionCatalog } from "/src/referenceData/referenceDataTypes.ts";
      import { resolveDryWetRiserOpenTarget } from "/src/dryWetRiser/dryWetRiserResolution.ts";
      import {
        resolveFireAlarmControls
      } from "/src/fireAlarm/fireAlarmDefinition.ts";

      const ids = {
        job: "32000000-0000-4000-8000-000000000001",
        customer: "32000000-0000-4000-8000-000000000002",
        revision: "32000000-0000-4000-8000-000000000003",
        v1: "32000000-0000-4000-8000-000000000004",
        v2: "32000000-0000-4000-8000-000000000005",
        v3: "32000000-0000-4000-8000-000000000008",
        system: "32000000-0000-4000-8000-000000000006",
        location: "32000000-0000-4000-8000-000000000007"
      };
      const outcomes = [];
      const check = (name, passed, detail = "") => outcomes.push({ name, passed: Boolean(passed), detail });
      const rejected = async (operation) => {
        try { await operation(); return false; } catch { return true; }
      };
      const template = (id, version, systems) => ({
        id, code: "MFE-FSSR", name: "MFE Fire System Service Report Template", version,
        selectionPolicy: "preset_only", headerDefinition: { fields: [] },
        reportBoilerplate: { conditions: [] }, systems
      });
      const catalogKeys = [
        "automatic_sprinkler", "dry_wet_riser", "hose_reel", "co2_fire_extinguisher",
        "fire_alarm_detector", "wet_chemical", "hydrant", "fm200", "portable_fire_extinguisher"
      ];
      const labels = {
        automatic_sprinkler: "Automatic Sprinkler System", dry_wet_riser: "Dry / Wet Riser System",
        hose_reel: "Hose Reel System", co2_fire_extinguisher: "CO2 Fire Extinguisher System",
        fire_alarm_detector: "Fire Alarm / Detector System", wet_chemical: "Wet Chemical System",
        hydrant: "Hydrant System", fm200: "FM 200 System", portable_fire_extinguisher: "Portable Fire Extinguisher"
      };
      const systemEntry = (key, sortOrder, definitionStatus, definition) => ({
        key, displayName: labels[key], sortOrder, definitionStatus, definition
      });
      const textField = (key, label, required, sortOrder, control = "text") => ({ key, label, control, required, sortOrder });
      const resultField = (key, label, control, sortOrder) => ({
        key, label, control, required: true, sortOrder,
        allowedValues: control === "good_poor" ? ["good", "poor"] : ["normal", "test", "isolation"],
        remarksPolicy: "optional"
      });
      const checklist = (entries) => entries.map(([key, label], index) => resultField(key, label, "good_poor", index + 1));
      const fireAlarmV3 = {
        key: "fire_alarm_detector", displayName: labels.fire_alarm_detector, sortOrder: 5,
        definitionStatus: "confirmed",
        configuration: { supportsZones: true, supportsLocations: true, supportsPresetRows: true },
        sections: [
          { key: "fire_alarm_control_panel", title: "Fire Alarm Control Panel", sortOrder: 1, blocks: [
            { key: "control_panel_location", title: "Control Panel Location", type: "checklist", sortOrder: 1, items: [textField("control_panel_location", "Control Panel Location", true, 1)] },
            { key: "device_rows", title: "Zone and Device Rows", type: "repeatable_table", sortOrder: 2, supportsZones: true, supportsLocations: true, columns: [
              textField("asset_reference", "No.", false, 1), textField("alarm_zone", "Alarm Zone", true, 2), textField("location", "Location", true, 3),
              resultField("manual_call_point", "Manual Call Point", "normal_test_isolation", 4), resultField("flow_switch", "Flow Switch", "normal_test_isolation", 5),
              resultField("heat_detector", "Heat Detector", "normal_test_isolation", 6), resultField("smoke_detector", "Smoke Detector", "normal_test_isolation", 7),
              textField("remarks", "Remarks", false, 8, "remarks")
            ] }
          ] },
          { key: "charger_batteries", title: "Charger & Batteries", sortOrder: 2, blocks: [
            { key: "charger_battery_checks", title: "Charger & Battery Checks", type: "checklist", sortOrder: 1, items: checklist([
              ["main_supply", "Main Supply"], ["battery", "Battery"], ["charger", "Charger"]
            ]) }
          ] },
          { key: "main_function_key", title: "Main Function Key", sortOrder: 3, blocks: [
            { key: "function_checks", title: "Function Checks", type: "checklist", sortOrder: 1, items: checklist([
              ["main_alarm_reset", "Main Alarm Reset"], ["lamp_test", "Lamp Test"], ["evacuate", "Evacuate"],
              ["ac_supply", "A/C Supply"], ["dc_supply", "D/C Supply"], ["spka_system", "SPKA System"],
              ["alarm_lift_trip", "Alarm Lift Trip"], ["signal_gas_discharge", "Signal Gas Discharge"]
            ]) }
          ] },
          { key: "alarm_devices", title: "Alarm Devices", sortOrder: 4, blocks: [
            { key: "alarm_device_rows", title: "Alarm Bell and Manual Call Point Rows", type: "repeatable_table", sortOrder: 1, supportsZones: false, supportsLocations: true, columns: [
              textField("asset_reference", "No.", false, 1), textField("location", "Location", true, 2),
              resultField("alarm_bell", "Alarm Bell", "good_poor", 3), resultField("manual_call_point", "Manual Call Point", "good_poor", 4),
              textField("remarks", "Remarks", false, 5, "remarks")
            ] },
            { key: "comments", title: "Comments", type: "comments", sortOrder: 2, field: textField("comments", "Comments", false, 1, "remarks") }
          ] }
        ]
      };
      const v1 = template(ids.v1, 1, catalogKeys.map((key, index) =>
        systemEntry(key, index + 1, key === "fm200" ? "requires_confirmation" : "confirmed", { key, marker: "v1" })
      ));
      const v2 = template(ids.v2, 2, [{
        key: "dry_wet_riser", displayName: "Dry / Wet Riser", sortOrder: 1,
        definitionStatus: "confirmed", definition: { key: "dry_wet_riser", marker: "v2", sections: [] }
      }]);
      const v3Unavailable = new Set(["wet_chemical", "hydrant", "fm200", "portable_fire_extinguisher"]);
      const v3 = template(ids.v3, 3, catalogKeys.map((key, index) => systemEntry(
        key,
        index + 1,
        v3Unavailable.has(key) ? "requires_confirmation" : "confirmed",
        key === "fire_alarm_detector" ? fireAlarmV3 : { key, marker: key === "dry_wet_riser" ? "v2" : "v1" }
      )));
      const v4 = template("00000000-0000-4000-8000-000000000804", 4, catalogKeys.map((key, index) => systemEntry(
        key, index + 1,
        key === "wet_chemical" ? "confirmed" : (v3Unavailable.has(key) ? "requires_confirmation" : "confirmed"),
        { key, marker: key === "wet_chemical" ? "wet-v4" : "v4", sections: [] }
      )));
      const response = { template: v1, templates: [v1, v2, v3, v4] };
      const system = {
        enabledSystemId: ids.system, systemKey: "dry_wet_riser", displayName: "Dry / Wet Riser",
        sortOrder: 1, definitionStatus: "confirmed", systemConfiguration: { riserMode: "dry" },
        zones: [], locations: [{
          id: ids.location, enabledSystemId: ids.system, zoneId: null, key: "ground",
          displayName: "Ground Floor", presetRowCount: 1, rowPreset: { assetReference: "DW-001" },
          sortOrder: 1
        }]
      };
      const job = {
        id: ids.job, reference: "CATALOG-HARNESS", title: "Catalog Harness", status: "open",
        createdAt: new Date().toISOString(),
        configurationSnapshot: {
          schemaVersion: 1, customer: { id: ids.customer, code: "TEST", displayName: "Test" },
          configuration: { revisionId: ids.revision, revisionNumber: 1 },
          template: { id: ids.v2, code: "MFE-FSSR", name: v2.name, version: 2 },
          enabledSystems: [system]
        }
      };
      const responseFor = (payload) => ({ ok: true, status: 200, json: async () => payload });
      const installFetch = (catalogPayload) => {
        globalThis.fetch = async (path) => {
          if (path === "/api/inspection-catalog") return responseFor(catalogPayload);
          if (path === "/api/customers") return responseFor({ customers: [] });
          if (path === "/api/inspection-jobs") return responseFor({ jobs: [] });
          throw new Error(`Unexpected request: ${path}`);
        };
      };
      async function clear() {
        const records = await localDatabase.masterSystemInspections
          .where("jobSystemKey").equals(`${ids.job}:dry_wet_riser`).toArray();
        await localDatabase.transaction("rw", localDatabase.referenceData, localDatabase.masterSystemInspections, localDatabase.syncOutbox, async () => {
          await localDatabase.referenceData.bulkDelete([
            "inspection-catalog:MFE-FSSR:versions",
            "inspection-catalog:MFE-FSSR:1",
            "customers:active",
            "inspection-jobs:user:320"
          ]);
          await localDatabase.masterSystemInspections.bulkDelete(records.map((record) => record.clientUuid));
          for (const record of records) {
            const outbox = await localDatabase.syncOutbox.where("entityId").equals(record.clientUuid).toArray();
            await localDatabase.syncOutbox.bulkDelete(outbox.map((item) => item.operationId));
          }
        });
      }

      document.querySelector("#run").addEventListener("click", async () => {
        const output = document.querySelector("#result");
        outcomes.length = 0;
        try {
          await localDatabase.open();
          await clear();
          installFetch(response);
          const loaded = await loadInspectionCatalog();
          check("loader retains V1 default plus V2, V3 and V4", loaded.template.version === 1 && loaded.templates.length === 4 && loaded.templates[1].id === ids.v2 && loaded.templates[2].id === ids.v3 && loaded.templates[3].version === 4);
          const loadedV1 = loaded.templates.find((item) => item.version === 1);
          const loadedV2 = loaded.templates.find((item) => item.version === 2);
          const loadedV3 = loaded.templates.find((item) => item.version === 3);
          const loadedV4 = loaded.templates.find((item) => item.version === 4);
          check("V1 retains its original nine-system catalog", loadedV1?.systems.length === 9 && loadedV1.systems.map((item) => item.key).join(",") === catalogKeys.join(","));
          check("V2 remains Dry/Wet-only", loadedV2?.systems.length === 1 && loadedV2.systems[0]?.key === "dry_wet_riser");
          check("V3 contains exactly nine systems", loadedV3?.systems.length === 9 && loadedV3.systems.map((item) => item.key).join(",") === catalogKeys.join(","));
          const loadedFireAlarm = loadedV3?.systems.find((item) => item.key === "fire_alarm_detector");
          check("V3 Fire Alarm is confirmed and resolves exact controls", loadedFireAlarm?.definitionStatus === "confirmed" && resolveFireAlarmControls(loadedFireAlarm.definition).source.templateVersion === 3);
          check("V3 unimplemented systems remain unavailable", [...v3Unavailable].every((key) => loadedV3?.systems.find((item) => item.key === key)?.definitionStatus === "requires_confirmation"));
          check("V4 promotes only Wet Chemical", loadedV4?.systems.find((item) => item.key === "wet_chemical")?.definitionStatus === "confirmed");
          const selectedMarkers = [loadedV1, loadedV2, loadedV3, loadedV1].map((selected) => selected?.systems.find((item) => item.key === "dry_wet_riser")?.definition.marker);
          check("V1 to V2 to V3 to V1 does not reuse stale definitions", selectedMarkers.join(",") === "v1,v2,v2,v1");
          check("returning from V3 restores the original V1 catalog", loadedV1?.id === loaded.template.id && loadedV1?.version === loaded.template.version && loadedV1?.systems.length === 9 && loadedV1.systems.map((item) => item.key).join(",") === catalogKeys.join(",") && loadedV1.systems[0]?.definition.marker === "v1");
          await refreshInspectionReferenceData(320);
          const cached = await getCachedInspectionCatalog();
          check("IndexedDB reload retains V1 through V4", cached?.template.id === ids.v1 && cached.templates.map((item) => item.version).join(",") === "1,2,3,4");
          const cachedEntry = await localDatabase.referenceData.get("inspection-catalog:MFE-FSSR:versions");
          const cachedIdentities = cached?.templates.map((item) => `${item.code}:${item.version}`) ?? [];
          check("cache identity distinguishes template code and version", cachedEntry?.key === "inspection-catalog:MFE-FSSR:versions" && new Set(cachedIdentities).size === 4 && cachedIdentities.join(",") === "MFE-FSSR:1,MFE-FSSR:2,MFE-FSSR:3,MFE-FSSR:4");
          const first = await resolveDryWetRiserOpenTarget(job, system, cached, undefined, "verified", async () => undefined);
          const second = await resolveDryWetRiserOpenTarget(job, system, cached, undefined, "verified", async () => undefined);
          const createdId = first.kind === "local" ? first.record.clientUuid : "";
          const outbox = createdId ? await localDatabase.syncOutbox.where("entityId").equals(createdId).count() : -1;
          check("refreshed V2 job creates exactly one Draft with frozen V2 identity", first.kind === "local" && first.record.masterTemplate.id === ids.v2 && first.record.masterTemplate.version === 2 && second.kind === "local" && second.record.clientUuid === first.record.clientUuid && outbox === 0, JSON.stringify({ first: first.kind, second: second.kind, outbox }));

          await clear();
          await localDatabase.referenceData.put({
            key: "inspection-catalog:MFE-FSSR:1", payload: { template: v1 }, version: "MFE-FSSR:1",
            fetchedAt: new Date().toISOString(), expiresAt: new Date(Date.now() + 60000).toISOString()
          });
          const legacy = await getCachedInspectionCatalog();
          check("legacy V1-only cache stays valid for V1", legacy?.template.id === ids.v1 && legacy.templates.length === 1 && legacy.template.systems.length === 9 && legacy.template.systems.map((item) => item.key).join(",") === catalogKeys.join(","));
          const legacyV2 = await resolveDryWetRiserOpenTarget(job, system, legacy, undefined, "verified", async () => undefined);
          check("legacy V1-only cache does not fabricate V2", legacyV2.kind === "server-unavailable" && legacyV2.message.includes("not cached for this job"));
          installFetch(response);
          await refreshInspectionReferenceData(320);
          const upgraded = await getCachedInspectionCatalog();
          check("online refresh upgrades legacy cache to V1 through V4", upgraded?.templates.length === 4 && upgraded?.templates.some((item) => item.id === ids.v2) && upgraded?.templates.some((item) => item.id === ids.v3) && upgraded?.templates.some((item) => item.version === 4));

          const malformedFireAlarm = structuredClone(fireAlarmV3);
          malformedFireAlarm.sections[0].blocks[1].columns.reverse();
          check("malformed V3 Fire Alarm definition fails closed", await rejected(async () => resolveFireAlarmControls(malformedFireAlarm)));

          const malformed = [
            ["templates is not an array", (value) => value.templates = {}],
            ["malformed V2 template", (value) => value.templates[1].name = 7],
            ["duplicate template ID", (value) => value.templates[1].id = value.templates[0].id],
            ["duplicate code/version", (value) => value.templates[1].version = 1],
            ["wrong version type", (value) => value.templates[1].version = "2"],
            ["malformed system definition", (value) => value.templates[1].systems[0].definition = []],
            ["mismatched V2 ownership", (value) => value.templates[1].code = "OTHER"]
          ];
          for (const [name, mutate] of malformed) {
            const candidate = structuredClone(response);
            mutate(candidate);
            installFetch(candidate);
            check(`loader rejects ${name}`, await rejected(() => loadInspectionCatalog()) && parseInspectionCatalog(candidate) === undefined);
          }
          output.textContent = JSON.stringify({ status: outcomes.every((outcome) => outcome.passed) ? "PASS" : "FAIL", outcomes }, null, 2);
        } catch (error) {
          output.textContent = JSON.stringify({ status: "ERROR", message: error instanceof Error ? error.message : String(error), outcomes }, null, 2);
        }
      });
    </script>
  </body>
</html>
