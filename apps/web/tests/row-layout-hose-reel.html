<!doctype html><html><body><div id="form"></div><pre id="state"></pre><script type="module">
// Phase 3: the real Hose Reel form (schema 3 / V7) with a real repository and real Dexie. ?preset=saved gives the customer a
// saved layout of two drums; no preset is a first visit (no configured rows); ?online lets the form talk to a fake server.
import * as React from "react";
import "/src/styles/app.css";
import * as ReactDomClient from "react-dom/client";
import { activateUserWorkspace, deviceDatabase, localDatabase } from "/src/db/localDatabase.ts";
import { loadTechnicianLocationProposalDraft } from "/src/jobs/technicianLocationProposalDraft.ts";
import { masterServiceReportV7 } from "../../api/src/inspections/templates/masterServiceReportV7.ts";
import { getOrCreateHoseReelInspection, saveHoseReelDraft, submitLocalHoseReel } from "/src/hoseReel/hoseReelRepository.ts";
import { HoseReelInspectionForm } from "/src/hoseReel/HoseReelInspectionForm.tsx";

const id = (n) => `99000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const params = new URLSearchParams(location.search);
const systemKey = "hose_reel";
window.__posts = [];
window.__proposalReply = { status: 201 };
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
globalThis.fetch = async (input, init) => {
  const url = String(input);
  if (params.has("online") && url.includes("/location-proposals") && init?.method === "POST") {
    const body = JSON.parse(init.body);
    window.__posts.push({ url, body });
    if (window.__proposalReply.status === 409) return json({ error: "LOCATION_PROPOSAL_ALREADY_PENDING", message: "already awaiting review" }, 409);
    // The client validates the full server proposal shape and echoes of customer, system, job and submitter.
    const [, customerId, systemKey] = /\/customers\/([^/]+)\/systems\/([^/]+)\/location-proposals/.exec(url);
    return json({ proposal: {
      id: body.id, customerId, customerDisplayName: "Layout Customer", systemKey, systemDisplayName: null, jobId: body.jobId, jobReference: null,
      submittedByUserId: Number(init.headers["X-Expected-User-Id"] ?? 1), submittedBy: "browser-tech", submittedByRole: "inspector",
      submittedAt: new Date().toISOString(), payload: body.patch, status: "pending", decision: null, edited: false
    } }, 201);
  }
  throw new TypeError("Failed to fetch");
};

const enabledSystemId = id(4);
const savedRows = [{ assetReference: "D-1", locationText: "Pump room", drumType: "swing" }, { assetReference: "D-2", locationText: "Roof", drumType: "fixed" }];
const locations = params.get("preset") === "saved"
  ? [{ id: id(11), enabledSystemId, zoneId: null, key: "general", displayName: "General", presetRowCount: savedRows.length, rowPreset: { rows: savedRows }, sortOrder: 1 }]
  : [];
const system = { enabledSystemId, systemKey, displayName: "Hose Reel", sortOrder: 2, definitionStatus: "confirmed", zones: [], locations };
const template = { id: masterServiceReportV7.id, code: "MFE-FSSR", name: "MFE", version: 7, systems: masterServiceReportV7.systems.map((s) => ({ ...s, enabledSystemId: s.key === systemKey ? enabledSystemId : id(900), systemKey: s.key, displayName: s.displayName ?? s.key, definition: s })) };
const catalog = { templates: [template], template };
const job = { id: id(1), reference: "HR-LAYOUT", title: "Hose reel layout", status: "open", createdAt: "2026-10-11T00:00:00.000Z", serviceDate: null, serviceTime: null, site: null,
  configurationSnapshot: { schemaVersion: 1, customer: { id: id(2), code: "HR", displayName: "Hose Reel Customer" }, configuration: { revisionId: id(3), revisionNumber: 1 }, template: { id: masterServiceReportV7.id, code: "MFE-FSSR", name: "MFE", version: 7 }, enabledSystems: [system] } };

let record, root = ReactDomClient.createRoot(document.querySelector("#form"));
const render = () => root.render(React.createElement(HoseReelInspectionForm, {
  record, actorUserId: 1, canUseServer: params.has("online"), onClose: () => {}, onEditFailed: async () => {}, onStartCorrectedCopy: async () => {},
  onSaveDraft: async (responses) => { record = await saveHoseReelDraft(record, responses); render(); },
  onSubmitLocal: async (responses) => { record = await submitLocalHoseReel(record, responses); render(); }
}));
await activateUserWorkspace(1);
await deviceDatabase.authState.put({ key: "device-auth", userId: 1, username: "browser-tech", role: "inspector", serverLogoutPending: false, explicitLogout: false });
record = await getOrCreateHoseReelInspection(job, system, catalog, { id: 1, username: "browser-tech", role: "inspector" });
render();

/** Fills every required answer in the stored Draft (all Good, Swing for a blank type, names for blank locations), then re-renders. */
window.fillAll = async (names = []) => {
  const stored = await localDatabase.masterSystemInspections.get(record.clientUuid);
  record = stored;
  const next = structuredClone(stored.responses);
  for (const key of Object.keys(next.checklist)) next.checklist[key].result = "good";
  next.measurements.jockey_pump_pressure.values = { cut_in: 10, cut_out: 20 }; next.measurements.jockey_pump_pressure.result = "good";
  next.measurements.standby_pump_cut_in.values = { value: 5 }; next.measurements.standby_pump_cut_in.result = "good";
  next.rows = next.rows.map((row) => ({ ...row, drumResult: "good", hoseResult: "good", nozzleResult: "good", valveResult: "good", nozzleBoxResult: "good", drumType: row.drumType || "swing", locationText: row.locationText || (names.shift() ?? "Drum") }));
  record = await saveHoseReelDraft(record, next);
  render();
};
window.inspect = async () => {
  const stored = await localDatabase.masterSystemInspections.get(record.clientUuid);
  const outbox = await localDatabase.syncOutbox.toArray();
  const proposal = await loadTechnicianLocationProposalDraft(job.id, systemKey, "general");
  return { stored, outbox, proposal, posts: window.__posts };
};
</script></body></html>
