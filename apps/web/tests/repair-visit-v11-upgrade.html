<!doctype html><html><head><meta charset="utf-8"><title>Repair visit v11 upgrade</title></head><body>
<script type="module">
import Dexie from 'dexie';
import { createLocalDatabase } from '/src/db/localDatabase.ts';
const name = 'repair-visit-v11-upgrade';
// Independent, frozen v10 fixture: every store and every index from the old build.
const v10 = {
  drafts: 'id, entityType, updatedAt',
  testRecords: 'clientUuid, syncStatus, localUpdatedAt, createdAt',
  inspectionRecords: 'clientUuid, syncStatus, jobId, systemKey, [jobId+systemKey], templateId, localUpdatedAt',
  masterSystemInspections: 'clientUuid, &jobSystemKey, jobId, systemKey, syncStatus, localUpdatedAt',
  masterSystemInspectionGroups: 'groupKey, jobId, systemKey, localUpdatedAt',
  masterSystemFormInstances: 'clientUuid, &[groupKey+instanceKey], groupKey, jobId, systemKey, configuredLocationId, syncStatus, localUpdatedAt',
  syncOutbox: 'operationId, entityType, entityId, status, createdAt, &activeKey',
  referenceData: 'key, version, fetchedAt, expiresAt', authState: 'key',
  inspectionAttachments: 'photoUuid, &[inspectionClientUuid+fieldPath], inspectionClientUuid, systemKey, syncStatus, localUpdatedAt, serverAttachmentId',
  repairFindings: 'findingId, [original.jobId+original.systemKey], fetchedAt',
  repairWorkOrders: 'workOrderId, [jobId+systemKey], assignedToUserId, status',
  repairRecords: 'clientUuid, findingId, workOrderId, [jobId+systemKey], syncStatus, localUpdatedAt',
  repairAttachments: 'photoUuid, &repairUuid, syncStatus',
  repairBeforePhotos: 'findingId, photoUuid, sourceFingerprint'
};
const assert = (ok, message) => { if (!ok) throw new Error(message); };
async function normalized(v) {
  if (v instanceof Blob) return { type: v.type, bytes: Array.from(new Uint8Array(await v.arrayBuffer())) };
  if (Array.isArray(v)) return Promise.all(v.map(normalized));
  if (v && typeof v === 'object') return Object.fromEntries(await Promise.all(Object.entries(v).map(async ([k, x]) => [k, await normalized(x)])));
  return v;
}
function schema(table) { return JSON.stringify({ primary: table.schema.primKey, indexes: table.schema.indexes }); }
let before, schemas;
window.prepareUpgrade = async () => {
  await Dexie.delete(name);
  const old = new Dexie(name); old.version(10).stores(v10); await old.open();
  before = {}; schemas = {};
  const uuid = '10000000-0000-4000-8000-000000000001';
  for (const table of old.tables) {
    const row = { [table.schema.primKey.keyPath]: uuid, jobId: uuid, systemKey: 'hydrant', syncStatus: 'Pending',
      localUpdatedAt: '2026-10-19T01:00:00.000Z', marker: table.name };
    if (table.name === 'inspectionRecords') Object.assign(row, { templateVersion: 7, responses: [{value:'not_good',remarks:'leaking'}], frozen: { manifest: [{photoUuid:uuid,fieldPath:'field',sourceSha256:'a'.repeat(64)}] } });
    if (['inspectionAttachments','repairAttachments','repairBeforePhotos'].includes(table.name)) row.blob = new Blob([new Uint8Array([0,1,2,128,255])], {type:'image/jpeg'});
    if (table.name === 'syncOutbox') Object.assign(row, { entityType:'repairRecord', entityId:uuid, action:'create', status:'Failed', activeKey:'repairRecord:create:'+uuid, attempts:3, payload:{clientUuid:uuid}, lastError:'network failed' });
    await table.put(row);
    before[table.name] = await normalized(await table.toArray()); schemas[table.name] = schema(table);
  }
  old.close(); return true;
};
window.runUpgrade = async () => {
  const db = createLocalDatabase(name); await db.open();
  assert(db.verno === 11, 'version must be 11');
  for (const [table, rows] of Object.entries(before)) {
    assert(schema(db.table(table)) === schemas[table], table + ': index changed');
    assert(JSON.stringify(await normalized(await db.table(table).toArray())) === JSON.stringify(rows), table + ': data/Blob changed');
  }
  const added = ['offlineServiceVisits','rvVisits','rvItems','rvPhotos','rvPreviousVisits','rvBeforePhotos'];
  for (const name of added) assert(await db.table(name).count() === 0, name + ': new store must be empty');
  assert(db.tables.length === Object.keys(v10).length + added.length, 'all stores retained');
  const photo = {photoUuid:'new-photo',visitUuid:'visit',itemUuid:'item',blob:new Blob(['new-after'],{type:'image/jpeg'})};
  await db.rvPhotos.put(photo); db.close(); await db.open();
  assert(await (await db.rvPhotos.get('new-photo')).blob.text() === 'new-after', 'new Blob survives reopen');
  for (const [table, rows] of Object.entries(before)) assert(JSON.stringify(await normalized(await db.table(table).toArray())) === JSON.stringify(rows), table + ': reopen changed data');
  db.close(); return {oldStores: Object.keys(v10).length, newStores: added.length, status:'PASS'};
};
window.ready = true;
</script></body></html>
