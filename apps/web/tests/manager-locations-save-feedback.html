<!doctype html><html><body>
<button id="run">Run manager locations save feedback checks</button>
<pre id="result">Ready</pre>
<div id="view"></div>
<script type="module">
import * as React from "react";
import { createRoot } from "react-dom/client";
import { ManagerLocationsEditor } from "/src/manager/ManagerCustomerConfiguration.tsx";

const id = (n) => `00000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const customerId = id(770), systemKey = "co2_fire_extinguisher", enabledSystemId = id(772);
const out = document.querySelector("#result"), checks = [];
const check = (name, ok) => checks.push({ name, ok: Boolean(ok) });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 4000) { const end = Date.now() + ms; while (Date.now() < end) { try { const v = fn(); if (v) return v; } catch {} await wait(25); } return undefined; }

// A long editor: 80 existing locations push the Save button far below the top of the panel.
const zones = [{ id: id(781), enabledSystemId, key: "z1", displayName: "Ground Floor", sortOrder: 1 }];
const locations = Array.from({ length: 80 }, (_, i) => ({ id: id(800 + i), enabledSystemId, zoneId: id(781), key: `l${i}`, displayName: `Location ${i + 1}`, presetRowCount: 1, rowPreset: {}, sortOrder: i + 1 }));
let putCalls = 0, putMode = "invalid";
const json = (payload, status = 200) => new Response(JSON.stringify(payload), { status, headers: { "content-type": "application/json" } });
const realFetch = window.fetch;
window.fetch = async (input, init) => {
  const url = typeof input === "string" ? input : input.url;
  if (!url.includes(`/api/manager/customers/${customerId}/systems/${systemKey}/locations`)) return realFetch(input, init);
  if ((init?.method ?? "GET").toUpperCase() === "GET") return json({ systemKey, templateVersion: 7, zones, locations });
  putCalls += 1;
  return json({ error: "INVALID_LOCATION_CONFIGURATION", message: "The zone/location payload is invalid for this system." }, 400);
};

const button = (label) => [...document.querySelectorAll("button")].find((b) => b.textContent.trim() === label);
const alertEl = () => document.querySelector('[role="alert"]');
const inView = (el) => { const r = el.getBoundingClientRect(); return r.top >= 0 && r.bottom <= window.innerHeight; };

document.querySelector("#run").onclick = async () => {
  try {
    createRoot(document.querySelector("#view")).render(React.createElement(ManagerLocationsEditor, {
      customerId, systemKey, systemLabel: "CO2", embedded: true, onSaved() {}, onAuthorityFailure() { check("no authority failure expected", false); }
    }));
    await until(() => button("Save zones & locations"));
    check("the editor is long enough that Save is below the first screen", button("Save zones & locations").getBoundingClientRect().top + window.scrollY > window.innerHeight * 2);

    // Blank location name: refused locally with a specific message, nothing sent.
    button("Add location").click();
    await wait(100);
    button("Save zones & locations").scrollIntoView({ block: "center" });
    await wait(100);
    button("Save zones & locations").click();
    const blank = await until(() => alertEl());
    check("L-3: a blank location name shows a specific message", blank?.textContent.includes("Every location needs a name"));
    check("L-3: a blank name is refused before any request is sent", putCalls === 0);
    check("L-3: the message is visible on screen at the Save button", blank && inView(blank));
    const saveRect = button("Save zones & locations").getBoundingClientRect();
    check("L-3: the message sits right above the Save button", blank && Math.abs(saveRect.top - blank.getBoundingClientRect().bottom) < 150);

    // Name it but leave no zone chosen.
    const rows = [...document.querySelectorAll(".manager-locations-location-list li")];
    const last = rows[rows.length - 1];
    const input = last.querySelector("input");
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, "New Room");
    input.dispatchEvent(new Event("input", { bubbles: true }));
    const select = last.querySelector("select");
    Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "value").set.call(select, "");
    select.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(100);
    button("Save zones & locations").click();
    await until(() => alertEl()?.textContent.includes("Choose a zone"));
    check("L-3: a location with no zone shows a specific message", alertEl()?.textContent.includes("Choose a zone for every location"));
    check("a location with no zone sends nothing", putCalls === 0);

    // A server refusal is also shown next to Save and in view.
    Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "value").set.call(select, select.options[1].value);
    select.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(100);
    window.scrollTo(0, 0);
    await wait(50);
    button("Save zones & locations").scrollIntoView({ block: "end" });
    await wait(50);
    button("Save zones & locations").click();
    await until(() => putCalls === 1 && alertEl()?.textContent.includes("payload is invalid"));
    check("a server refusal is shown", alertEl()?.textContent.includes("payload is invalid"));
    check("L-3: the server refusal is visible on screen too", alertEl() && inView(alertEl()));

    // L-4: warn on trimmed/case-insensitive duplicates, but still send a valid save.
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, " location 1 ");
    input.dispatchEvent(new Event("input", { bubbles: true }));
    check("L-4: duplicate location names warn", await until(() => document.body.textContent.includes("Duplicate location names")));
    button("Add zone").click();
    await wait(100);
    const zoneInput = [...document.querySelectorAll('.manager-locations-zone-list input')].at(-1);
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(zoneInput, " ground FLOOR ");
    zoneInput.dispatchEvent(new Event("input", { bubbles: true }));
    check("L-4: duplicate zone names warn", await until(() => document.body.textContent.includes("Duplicate zone names")));
    button("Save zones & locations").click();
    check("L-4: duplicate warnings do not block a save request", await until(() => putCalls === 2));

    window.fetch = realFetch;
    out.textContent = JSON.stringify({ status: checks.every((x) => x.ok) ? "PASS" : "FAIL", checks });
  } catch (error) {
    window.fetch = realFetch;
    out.textContent = JSON.stringify({ status: "ERROR", message: error.stack || String(error), checks });
  }
};
</script></body></html>
