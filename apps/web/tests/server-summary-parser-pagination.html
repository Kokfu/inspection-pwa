<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Server summary parser and pagination harness</title></head><body>
<button id="run" type="button">Run production pagination checks</button><pre id="result">Ready</pre>
<script type="module">
import { loadAllPages, parseServerMasterSystemInspectionPage } from "/src/hoseReel/serverMasterSystemInspectionApi.ts";
import { deriveFireAlarmProgress, deriveNoLocalSystemProgress } from "/src/jobs/jobProgress.ts";
const jobId="41000000-0000-4000-8000-000000000001";
const uuid=n=>`41000000-0000-4000-8000-${String(n).padStart(12,"0")}`;
const cursor=item=>btoa(JSON.stringify({performedAt:item.performedAt,clientUuid:item.clientUuid})).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""), clone=value=>structuredClone(value);
const item=(n,time="2026-08-04T00:00:00.000000Z",instance=`location:${uuid(500+n)}`)=>({clientUuid:uuid(n),jobId,systemKey:"co2_fire_extinguisher",instanceKey:instance,zoneId:null,locationId:uuid(500+n),displaySequence:1,status:"submitted",performedAt:time,deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:"inspector"});
const page=(inspections,hasMore=false,nextCursor=null)=>({inspections,hasMore,nextCursor});
const continued=inspections=>page(inspections,true,cursor(inspections.at(-1)));
const rejects=value=>{try{parseServerMasterSystemInspectionPage(value);return false;}catch{return true;}};
const sprinkler=(state="complete",required=1,confirmed=1)=>({clientUuid:uuid(300),jobId,systemKey:"automatic_sprinkler",instanceKey:"primary",zoneId:null,locationId:null,displaySequence:1,status:"submitted",performedAt:"2026-08-04T00:00:00.000000Z",deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:"inspector",evidenceState:state,requiredEvidenceCount:required,confirmedEvidenceCount:confirmed});
const fire=(n=400)=>({clientUuid:uuid(n),jobId,systemKey:"fire_alarm_detector",instanceKey:"primary",zoneId:null,locationId:null,displaySequence:1,status:"submitted",performedAt:"2026-07-31T00:00:00.000000Z",deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:"inspector"});
async function production(pages){let index=0;return loadAllPages(new URLSearchParams(),"harness",async()=>{const value=pages[index++];if(value instanceof Error)throw value;if(value?.status)return new Response("failure",{status:value.status});return new Response(JSON.stringify(value),{headers:{"Content-Type":"application/json"}});});}
async function rejected(pages){try{await production(pages);return false;}catch{return true;}}
document.querySelector("#run").addEventListener("click",async()=>{const checks=[];const check=(name,passed)=>checks.push({name,passed});
const a=item(1),b=item(2,"2026-08-03T00:00:00.000000Z"),c=item(3,"2026-08-02T00:00:00.000000Z"),tieA=item(10,"2026-08-01T00:00:00.123456Z"),tieB=item(11,"2026-08-01T00:00:00.123456Z");
check("valid single page",(await production([page([a])])).length===1);
check("valid automatic sprinkler evidence summary",!rejects(page([sprinkler()])));
check("valid Fire Alarm summary",!rejects(page([fire()])));
const wrongFire=fire();wrongFire.instanceKey="other";check("wrong Fire Alarm identity fails closed",rejects(page([wrongFire])));
check("server-only accepted Fire Alarm Completed",deriveNoLocalSystemProgress(true,"verified","loaded")==="Completed");
check("local Synced plus accepted Fire Alarm Completed",deriveFireAlarmProgress({syncStatus:"Synced"},{kind:"current-complete",accepted:true})==="Completed");
check("local Synced without accepted confirmation Unknown",deriveFireAlarmProgress({syncStatus:"Synced"},{kind:"current-complete",accepted:false})==="Unknown / Not Cached");
check("complete absence Not Started",deriveNoLocalSystemProgress(false,"verified","loaded")==="Not Started");
check("failed summary not inferred Not Started",deriveNoLocalSystemProgress(false,"verified","failed")==="Unknown / Not Cached");
const missingEvidence= sprinkler();delete missingEvidence.evidenceState;check("missing sprinkler evidence metadata",rejects(page([missingEvidence])));
check("unknown sprinkler evidence state",rejects(page([sprinkler("unknown")] )));
check("complete sprinkler evidence count mismatch",rejects(page([sprinkler("complete",2,1)])));
check("not-required sprinkler evidence count mismatch",rejects(page([sprinkler("not-required",1,0)])));
check("sprinkler confirmed count exceeds required",rejects(page([sprinkler("pending",1,2)])));
check("valid two-page sequence",(await production([continued([a]),page([b])])).length===2);
check("valid three-page sequence",(await production([continued([a]),continued([b]),page([c])])).length===3);
check("pagination beyond 100 does not hide Fire Alarm",(await production([continued([a]),page([fire()])])).some(x=>x.systemKey==="fire_alarm_detector"));
check("same-timestamp tie ordering across pages",(await production([continued([tieA]),page([tieB])])).map(x=>x.clientUuid).join(",")===[tieA.clientUuid,tieB.clientUuid].join(","));
check("cursor equals final row",!rejects(continued([a,b])));
const nonFinal=continued([a,b]);nonFinal.nextCursor=cursor(a);check("cursor points to non-final row",rejects(nonFinal));
const timestampMismatch=continued([a]);timestampMismatch.nextCursor=cursor({...a,performedAt:"2026-08-04T00:00:01.000000Z"});check("cursor timestamp mismatch",rejects(timestampMismatch));
const uuidMismatch=continued([a]);uuidMismatch.nextCursor=cursor({...a,clientUuid:uuid(99)});check("cursor UUID mismatch",rejects(uuidMismatch));
check("reversed within-page rows",rejects(page([b,a])));
check("equal-timestamp UUID order regression",rejects(page([tieB,tieA])));
check("backward cross-page ordering",await rejected([continued([b]),page([a])]));
check("duplicated item across pages",await rejected([continued([a]),page([a])]));
const identityDuplicate={...b,instanceKey:a.instanceKey,locationId:a.locationId};check("duplicated identity across pages",await rejected([continued([a]),page([identityDuplicate])]));
const loopFirst=continued([a]),loopSecond=continued([b]);loopSecond.nextCursor=loopFirst.nextCursor;check("repeated cursor loop",await rejected([loopFirst,loopSecond]));
check("hasMore true without cursor",rejects(page([a],true,null)));
check("hasMore false with cursor",rejects(page([a],false,cursor(a))));
check("empty page with hasMore true",rejects(page([],true,cursor(a))));
const malformed=continued([a]);malformed.nextCursor="not-a-cursor";check("malformed cursor",rejects(malformed));
const extra=continued([a]);extra.nextCursor=btoa(JSON.stringify({performedAt:a.performedAt,clientUuid:a.clientUuid,extra:true})).replace(/=+$/,"");check("extra cursor member",rejects(extra));
check("failed second page",await rejected([continued([a]),{status:500}]));
check("malformed second page",await rejected([continued([a]),{inspections:"bad",hasMore:false,nextCursor:null}]));
check("incomplete pagination",await rejected([continued([a]),new Error("transport ended")]));
check("no partial result returned as complete",await rejected([continued([a]),{status:500}]));
const actor=clone(page([a]));actor.inspections[0].syncedByUsername=" ";check("whitespace actor metadata rejected",rejects(actor));
const unknown=clone(page([a]));unknown.extra=true;check("unknown page member rejected",rejects(unknown));
document.querySelector("#result").textContent=checks.map(x=>`${x.passed?"PASS":"FAIL"} ${x.name}`).join("\n");
});
</script></body></html>
