<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Server summary parser harness</title></head><body>
<button id="run" type="button">Run summary parser checks</button><pre id="result">Ready</pre>
<script type="module">
import { parseServerMasterSystemInspectionPage } from "/src/hoseReel/serverMasterSystemInspectionApi.ts";
const id="41000000-0000-4000-8000-000000000001", jobId="41000000-0000-4000-8000-000000000002";
const cursor=(clientUuid=id)=>btoa(JSON.stringify({performedAt:"2026-08-04T00:00:00.000Z",clientUuid})).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""), id2="41000000-0000-4000-8000-000000000003";
const valid={inspections:[{clientUuid:id,jobId,systemKey:"hose_reel",instanceKey:"primary",zoneId:null,locationId:null,displaySequence:1,status:"submitted",performedAt:"2026-08-04T00:00:00.000Z",deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:"inspector"}],hasMore:false,nextCursor:null};
const clone=(value)=>structuredClone(value), rejects=(value)=>{try{parseServerMasterSystemInspectionPage(value);return false;}catch{return true;}};
async function collect(pages){const all=[], seen=new Set(), cursors=new Set();let next;for(const raw of pages){const page=parseServerMasterSystemInspectionPage(raw);if(next&&page===undefined)throw new Error("missing page");for(const item of page.inspections){if(seen.has(item.clientUuid))throw new Error("duplicate");seen.add(item.clientUuid);all.push(item);}if(page.hasMore){if(cursors.has(page.nextCursor))throw new Error("loop");cursors.add(page.nextCursor);next=page.nextCursor;}else {if(raw!==pages.at(-1))throw new Error("incomplete");return all;}}throw new Error("incomplete");}
document.querySelector("#run").addEventListener("click",async()=>{const checks=[];const check=(name,passed)=>checks.push({name,passed});
check("valid complete page parses",parseServerMasterSystemInspectionPage(valid).inspections.length===1);check("malformed top level fails closed",rejects([]));
const notArray=clone(valid);notArray.inspections={};check("items must be an array",rejects(notArray));const badUuid=clone(valid);badUuid.inspections[0].clientUuid="bad";check("invalid UUID fails closed",rejects(badUuid));
const badSystem=clone(valid);badSystem.inspections[0].systemKey="unknown";check("unsupported system fails closed",rejects(badSystem));const badKey=clone(valid);badKey.inspections[0].instanceKey="secondary";check("invalid instance key fails closed",rejects(badKey));
const badSequence=clone(valid);badSequence.inspections[0].displaySequence=0;check("invalid display sequence fails closed",rejects(badSequence));const badTime=clone(valid);badTime.inspections[0].performedAt="soon";check("invalid timestamp fails closed",rejects(badTime));
const badActor=clone(valid);badActor.inspections[0].syncedByUsername=null;check("invalid actor metadata fails closed",rejects(badActor));const duplicate=clone(valid);duplicate.inspections.push(clone(valid.inspections[0]));check("duplicate UUID fails closed",rejects(duplicate));
const unknown=clone(valid);unknown.extra=true;check("unknown member fails closed",rejects(unknown));const missingCursor=clone(valid);missingCursor.hasMore=true;check("hasMore without cursor fails closed",rejects(missingCursor));const unexpectedCursor=clone(valid);unexpectedCursor.nextCursor=cursor();check("cursor without hasMore fails closed",rejects(unexpectedCursor));const malformedCursor=clone(valid);malformedCursor.hasMore=true;malformedCursor.nextCursor="not-a-cursor";check("malformed cursor fails closed",rejects(malformedCursor));
const second={...clone(valid),inspections:[{...clone(valid.inspections[0]),clientUuid:id2}],hasMore:false,nextCursor:null};const first={...clone(valid),inspections:[clone(valid.inspections[0])],hasMore:true,nextCursor:cursor()};check("valid complete multi-page collection",(await collect([first,second])).length===2);check("correct cursor progression",first.nextCursor===cursor());const duplicateAcross={...clone(valid),hasMore:false,nextCursor:null};try{await collect([first,duplicateAcross]);check("duplicate item across pages rejected",false);}catch{check("duplicate item across pages rejected",true);}const loop={...clone(first),inspections:[{...clone(valid.inspections[0]),clientUuid:id2}]};try{await collect([first,loop]);check("repeated cursor loop rejected",false);}catch{check("repeated cursor loop rejected",true);}try{await collect([first]);check("failed later page leaves state unavailable/Unknown",false);}catch{check("failed later page leaves state unavailable/Unknown",true);}try{await collect([{...first,hasMore:false,nextCursor:null},second]);check("incomplete pagination is not confirmed absence",false);}catch{check("incomplete pagination is not confirmed absence",true);}
document.querySelector("#result").textContent=JSON.stringify({status:checks.every((check)=>check.passed)?"PASS":"FAIL",checks},null,2);});
</script></body></html>
