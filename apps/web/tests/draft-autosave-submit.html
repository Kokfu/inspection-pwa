<!doctype html><html><body><div id="view"></div><script type="module">
import * as React from "react";import * as ReactDomClient from "react-dom/client";import { useDraftAutosave } from "/src/inspectionControls/useDraftAutosave.ts";import { AutosaveStatusLine } from "/src/inspectionControls/AutosaveStatusLine.tsx";

</script></body></html>
