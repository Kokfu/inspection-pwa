<!doctype html><html><body><button id="run">Run Wet Chemical D1 authority checks</button><pre id="result">Ready</pre><script type="module">
import {resolveWetChemicalAuthority} from "/src/wetChemical/wetChemicalAuthority.ts";
import {deriveWetChemicalAuthorityProgress} from "/src/jobs/TechnicianHome.tsx";
const id=n=>`00000000-0000-4000-8000-${String(n).padStart(12,"0")}`;
const job=id(1),locA=id(2),locB=id(3),clientA=id(4),clientB=id(5);
const local=(location,client,sequence=1)=>({clientUuid:client,jobId:job,systemKey:"wet_chemical",configuredLocationId:location,instanceKey:`location:${location}`,configuredZoneId:null,displaySequence:sequence,groupKey:`${job}:wet_chemical`,syncStatus:"Draft",startedAt:"2026-08-11T00:00:00.000000Z"});
const summary=(record,client=clientA)=>({clientUuid:client,jobId:record.jobId,systemKey:"wet_chemical",locationId:record.configuredLocationId,instanceKey:record.instanceKey,zoneId:record.configuredZoneId,displaySequence:record.displaySequence,status:"submitted"});
const detail=(record,client=clientA)=>({clientUuid:client,jobId:record.jobId,instanceKey:record.instanceKey});
const group=(locations)=>({groupKey:`${job}:wet_chemical`,jobId:job,systemKey:"wet_chemical",expectedInstances:locations.map((location,index)=>({instanceKey:`location:${location}`,displaySequence:index+1,zone:null,location:{id:location}}))});
document.querySelector("#run").onclick=async()=>{const results=[];const ok=(name,value)=>results.push({name,value:!!value});const a=local(locA,clientA),b=local(locB,clientB,2);
  const none=await resolveWetChemicalAuthority("verified",a.clientUuid,a,{findSummary:async record=>undefined,loadDetail:async()=>detail(a)});ok("no Accepted resolves to local Draft",none.kind==="local"&&none.record===a);const offline=await resolveWetChemicalAuthority("offline-unverified",a.clientUuid,a,{findSummary:async()=>{throw new Error("offline must not fetch")},loadDetail:async()=>{throw new Error("offline must not fetch")}});ok("offline cached Draft opens without server fetch",offline.kind==="local"&&offline.record===a);
  const error=await resolveWetChemicalAuthority("verified",a.clientUuid,a,{findSummary:async()=>{throw new Error("503")},loadDetail:async()=>detail(a)});ok("authority error fails closed",error.kind==="server-unavailable");
  const acceptedA=await resolveWetChemicalAuthority("verified",a.clientUuid,a,{findSummary:async record=>record.configuredLocationId===locA?summary(a):undefined,loadDetail:async client=>detail(a,client)});const draftB=await resolveWetChemicalAuthority("verified",b.clientUuid,b,{findSummary:async record=>record.configuredLocationId===locA?summary(a):undefined,loadDetail:async client=>detail(b,client)});ok("Accepted A does not replace Draft B",acceptedA.kind==="server"&&draftB.kind==="local");
  const acceptedB=await resolveWetChemicalAuthority("verified",b.clientUuid,b,{findSummary:async record=>summary(record,record.clientUuid),loadDetail:async client=>detail(client===clientA?a:b,client)});ok("two locations resolve independently",acceptedA.kind==="server"&&acceptedB.kind==="server"&&acceptedB.inspection.instanceKey===b.instanceKey);
  const secondDevice=await resolveWetChemicalAuthority("verified",clientB,undefined,{findSummary:async()=>undefined,loadDetail:async client=>detail(b,client)});ok("second device discovers requested Accepted",secondDevice.kind==="server"&&secondDevice.inspection.clientUuid===clientB);
  const completeA=deriveWetChemicalAuthorityProgress(group([locA]),[{...a,syncStatus:"Failed"}],[summary(a)]);ok("Accepted A overrides stale local A",completeA==="Completed");
  const bPending={...b,syncStatus:"Pending"};const aAndB=group([locA,locB]);ok("Accepted A does not override local B",deriveWetChemicalAuthorityProgress(aAndB,[{...a,syncStatus:"Failed"},bPending],[summary(a)])==="Pending Sync");
  ok("partial multi-location progress is authoritative per location",deriveWetChemicalAuthorityProgress(aAndB,[a,b],[summary(a)])==="In Progress");
  document.querySelector("#result").textContent=JSON.stringify({status:results.every(x=>x.value)?"PASS":"FAIL",results},null,2);
};
</script></body></html>
