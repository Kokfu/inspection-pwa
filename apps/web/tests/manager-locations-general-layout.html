<!doctype html><html><body>
<div id="view"></div>
<script type="module">
// I-62: the Manager's Zones & locations editor for Hydrant / Dry-Wet-Riser. A customer whose layout is the single zone-free
// General location (saved from inspections) is SHOWN, not edited; a zoned customer still gets the full editor; anything else
// without a zone is an authority failure. ?system=hydrant|dry_wet_riser&mode=general|zoned|mixed|annex
import * as React from "react";
import { createRoot } from "react-dom/client";
import { ManagerLocationsEditor } from "/src/manager/ManagerCustomerConfiguration.tsx";

const id = (n) => `00000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const params = new URLSearchParams(location.search);
const systemKey = params.get("system") ?? "hydrant";
const mode = params.get("mode") ?? "general";
const customerId = id(670);
const enabledSystemId = id(672);
const zone = { id: id(681), enabledSystemId, key: "zone-a", displayName: "Zone A", sortOrder: 1 };
const zoned = { id: id(691), enabledSystemId, zoneId: id(681), key: "loc-a", displayName: "Location A", presetRowCount: 2, rowPreset: {}, sortOrder: 1 };
const generalLocation = { id: id(692), enabledSystemId, zoneId: null, key: "general", displayName: "General", presetRowCount: 3, rowPreset: { rows: [] }, sortOrder: 1 };
const bodies = {
  general: { zones: [], locations: [generalLocation] },
  zoned: { zones: [zone], locations: [zoned] },
  mixed: { zones: [zone], locations: [zoned, { ...generalLocation, sortOrder: 2 }] },
  annex: { zones: [], locations: [{ ...generalLocation, key: "annex" }] }
};
window.__calls = { get: 0, put: 0, authority: 0, saved: 0 };
window.fetch = async (input, init) => {
  const method = (init?.method ?? "GET").toUpperCase();
  if (method === "GET") window.__calls.get += 1; else window.__calls.put += 1;
  return new Response(JSON.stringify({ systemKey, templateVersion: 7, ...bodies[mode] }), { status: 200, headers: { "content-type": "application/json" } });
};
createRoot(document.querySelector("#view")).render(React.createElement(ManagerLocationsEditor, {
  customerId, systemKey, systemLabel: systemKey === "hydrant" ? "Hydrant" : "Dry / Wet Riser", embedded: true,
  onSaved: () => { window.__calls.saved += 1; }, onAuthorityFailure: () => { window.__calls.authority += 1; }
}));
</script></body></html>
