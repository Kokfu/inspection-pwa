<!doctype html><html><body><button id="run">Run</button><pre id="result">Ready</pre><script type="module">
import{localDatabase}from"/src/db/localDatabase.ts";import{getOrCreateDryWetRiserInspection,saveDryWetRiserDraft,submitLocalDryWetRiser}from"/src/dryWetRiser/dryWetRiserRepository.ts";
const id=n=>`72000000-0000-4000-8000-${String(n).padStart(12,"0")}`,result=document.querySelector("#result"),checks=[],check=(n,v)=>checks.push({name:n,passed:!!v});
const fixture=()=>{const system={enabledSystemId:id(1),systemKey:"dry_wet_riser",displayName:"Dry / Wet Riser System",definitionStatus:"confirmed",sortOrder:1,definition:{},systemConfiguration:{riserMode:"dry"},zones:[],locations:[{id:id(2),zoneId:null,key:"outlet",displayName:"Outlet A",presetRowCount:1,rowPreset:{assetReference:"DW-01"},sortOrder:1}]},template={id:"00000000-0000-4000-8000-000000000802",code:"MFE-FSSR",name:"MFE Fire System Service Report Template",version:2,systems:[{key:"dry_wet_riser",displayName:"Dry / Wet Riser System",definitionStatus:"confirmed",definition:{}}]},job={id:id(3),reference:"V2-DRY-WET",title:"V2 Dry Wet",status:"open",createdAt:new Date().toISOString(),configurationSnapshot:{schemaVersion:1,customer:{id:id(4),code:"V2",displayName:"V2 Customer"},configuration:{revisionId:id(5),revisionNumber:1},template:{id:template.id,code:template.code,name:template.name,version:2},enabledSystems:[system]}};return{job,system,catalog:{template,templates:[template]}}};
const complete=r=>{const x=structuredClone(r);for(const v of [...Object.values(x.waterTank),...Object.values(x.pumpHouse)])Object.assign(v,{result:"good",remarks:""});x.pumpHouse.manual_start_pumps={result:"poor",remarks:"Historical poor"};Object.assign(x.measurements,{jockeyCutIn:10,jockeyCutOut:11,dutyCutIn:12,standbyCutIn:13});Object.assign(x.riserOutlets[0],{canvasHoseAt2Result:"good",diffuserNozzleResult:"poor",landingValveResult:"good",crandleResult:"good",doorResult:"good",remarks:"Historical row"});return x};
document.querySelector("#run").onclick=async()=>{try{const f=fixture();await localDatabase.open();await localDatabase.masterSystemInspections.where("jobId").equals(f.job.id).delete();let draft=await getOrCreateDryWetRiserInspection(f.job,f.system,f.catalog,{id:1,username:"v2-tech",role:"inspector"});const saved=await saveDryWetRiserDraft(draft,complete(draft.responses));check("V2 Draft",saved.syncStatus==="Draft"&&saved.masterTemplate.id===f.job.configurationSnapshot.template.id&&saved.masterTemplate.version===2&&saved.responses.schemaVersion===1&&saved.responses.pumpHouse.manual_start_pumps.result==="poor"&&!JSON.stringify(saved.responses).includes("not_relevant")&&!JSON.stringify(saved.responses).includes("fieldRemarks"));localStorage.setItem("v2-drywet-client",saved.clientUuid);result.textContent=JSON.stringify({status:checks.every(x=>x.passed)?"READY_RELOAD":"FAIL",checks});}catch(e){result.textContent=JSON.stringify({status:"ERROR",message:e?.stack??String(e),checks})}};
window.afterReload=async()=>{try{const clientUuid=localStorage.getItem("v2-drywet-client"),record=await localDatabase.masterSystemInspections.get(clientUuid);check("V2 Draft reload",record?.clientUuid===clientUuid&&record.masterTemplate.id==="00000000-0000-4000-8000-000000000802"&&record.responses.pumpHouse.manual_start_pumps.result==="poor");const pending=await submitLocalDryWetRiser(record,record.responses),outbox=await localDatabase.syncOutbox.where("entityId").equals(clientUuid).first();check("V2 Pending outbox",pending.syncStatus==="Pending"&&outbox?.entityType==="masterSystemInspection"&&outbox?.activeKey===`masterSystemInspection:create:${clientUuid}`&&outbox?.payload?.responses?.schemaVersion===1&&!("evidenceManifest" in outbox.payload)&&!(await localDatabase.syncOutbox.where("entityType").equals("v6StagedEvidence").count()));result.textContent=JSON.stringify({status:checks.every(x=>x.passed)?"PASS":"FAIL",checks});}catch(e){result.textContent=JSON.stringify({status:"ERROR",message:e?.stack??String(e),checks})}};
</script></body></html>
