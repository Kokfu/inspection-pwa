<!doctype html><html lang="en"><head><meta charset="UTF-8" /><title>Automatic Sprinkler server detail parser</title></head><body>
<button id="run" type="button">Run Automatic Sprinkler Detail Parser Test</button><pre id="result">Ready</pre>
<script type="module">
import { localDatabase } from "/src/db/localDatabase.ts";
import { loadServerAutomaticSprinklerDetail, parseServerAutomaticSprinklerAttachments, parseServerAutomaticSprinklerDetail } from "/src/automaticSprinkler/serverAutomaticSprinklerApi.ts";
const uuid=n=>`00000000-0000-4000-8000-${String(n).padStart(12,"0")}`;
const paths=["measurements.jockey_pump_pressure.cut_in","measurements.jockey_pump_pressure.cut_out","measurements.duty_pump_cut_in.value","measurements.standby_pump_cut_in.value","measurements.water_supply_gauge.value","measurements.installation_gauge.value"];
const water=["saj_main_water_supply","water_level","automatic_refilling_facilities","drain_and_stop_valve_positions"],pump=["pump_house_clean","manual_start_pumps","standby_pump_service_items","battery_charging_alternator","battery_serviceable","pump_phase_failure_alarm","pumps_auto_start","test_and_gate_valve_positions"],valve=["breaching_inlet","alarm_gong","flow_meter_valve_positions"],measures=["jockey_pump_pressure","duty_pump_cut_in","standby_pump_cut_in","water_supply_gauge","installation_gauge"];
const row=()=>({result:"good",remarks:""}), rows=keys=>Object.fromEntries(keys.map(k=>[k,row()]));
const control=(key,sortOrder)=>({key,label:key,sortOrder,result:{type:"single_select",required:true,options:[{value:"good",label:"Good"},{value:"poor",label:"Poor"}]},remarks:{policy:"optional",maxLength:2000}});
const measurement=(key,sortOrder)=>({key,label:key,sortOrder,values:(key==="jockey_pump_pressure"?["cut_in","cut_out"]:["value"]).map(k=>({key:k,label:k,unit:"PSI",required:true})),result:{type:"single_select",required:true,options:[{value:"good",label:"Good"},{value:"poor",label:"Poor"}]},remarks:{policy:"optional",maxLength:2000}});
const clone=x=>structuredClone(x);
function detail(policy=true){return {clientUuid:uuid(1),serverFormInstanceId:uuid(2),jobId:uuid(3),jobReference:"JOB-1",jobTitle:"Test",customerName:"Customer",systemKey:"automatic_sprinkler",systemLabel:"Automatic Sprinkler",instanceKey:"primary",status:"submitted",performedAt:"2026-08-05T00:00:00.000000Z",receivedAt:"2026-08-05T00:01:00.000000Z",responses:{schemaVersion:1,waterTank:rows(water),pumpHouse:rows(pump),measurements:Object.fromEntries(measures.map(k=>[k,{values:Object.fromEntries((k==="jockey_pump_pressure"?["cut_in","cut_out"]:["value"]).map(x=>[x,100])),unit:"PSI",result:"good",remarks:""}])),mainAlarmValve:rows(valve),comments:""},displayControls:{schemaVersion:1,source:{templateCode:"MFE-FSSR",templateVersion:1,systemKey:"automatic_sprinkler"},repetitionMode:"single",instance:{key:"primary",displaySequence:1,zoneId:null,locationId:null},checklist:{waterTank:water.map((key,index)=>control(key,index+1)),pumpHouse:pump.map((key,index)=>control(key,index+1)),mainAlarmValve:valve.map((key,index)=>control(key,index+1))},measurements:measures.map((key,index)=>measurement(key,index+1)),layout:{waterTank:water.map(key=>({kind:"checklist",key})),pumpHouse:[pump[0],pump[1],...measures.slice(0,3),...pump.slice(2)].map(key=>({kind:measures.includes(key)?"measurement":"checklist",key})),mainAlarmValve:[valve[0],valve[1],...measures.slice(3),valve[2]].map(key=>({kind:measures.includes(key)?"measurement":"checklist",key}))},comments:{policy:"optional",maxLength:4000}},deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:"inspector",evidencePolicyId:policy?"00000000-0000-4000-8000-000000000710":null,evidencePolicyVersion:policy?1:null,evidencePolicyDefinition:policy?{schemaVersion:1,code:"automatic-sprinkler-psi-evidence",version:1,systemKey:"automatic_sprinkler",points:Object.fromEntries(paths.map(p=>[p,{allowed:true,required:false,maxCount:1}]))}:null,evidencePolicySha256:policy?"f280882235b680cc4f7d89704e96e305afe95b0638d4cd13577abddd6ae197d8":null};}
const attachment=(id=4,path=paths[0])=>({serverAttachmentId:uuid(id),photoUuid:uuid(id+100),inspectionClientUuid:uuid(1),status:"accepted",fieldPath:path,captureSource:"camera",mimeType:"image/jpeg",sizeBytes:100,width:10,height:10,sourceSha256:"a".repeat(64),storedSha256:"b".repeat(64),capturedAt:"2026-08-05T00:00:00.000000Z",receivedAt:"2026-08-05T00:01:00.000000Z"});
const rejects=x=>!parseServerAutomaticSprinklerDetail(x); const attachmentRejects=(x,d)=>!parseServerAutomaticSprinklerAttachments(x,d);
document.querySelector("#run").onclick=async()=>{const checks=[];const check=(name,ok)=>checks.push([name,ok]);const valid=detail(), parsed=parseServerAutomaticSprinklerDetail(valid);check("valid canonical accepted detail",!!parsed);check("valid no-evidence-required detail",!!parseServerAutomaticSprinklerDetail(detail(false)));check("valid required-evidence detail",!!parsed&&!!parseServerAutomaticSprinklerAttachments({attachments:[attachment()]},parsed));
for(const [name,mutate] of [["missing required member",x=>delete x.jobId],["extra top-level member",x=>x.extra=true],["invalid inspection UUID",x=>x.clientUuid="bad"],["wrong systemKey",x=>x.systemKey="hose_reel"],["wrong status",x=>x.status="Draft"],["malformed timestamp",x=>x.performedAt="today"],["blank actor string",x=>x.syncedByUsername=" "],["missing response/control",x=>delete x.responses.waterTank[water[0]]],["extra response/control",x=>x.responses.waterTank.extra=row()],["invalid result enum",x=>x.responses.pumpHouse[pump[0]].result="bad"],["PSI below bounds",x=>x.responses.measurements[measures[0]].values.cut_in=-1],["PSI above bounds",x=>x.responses.measurements[measures[0]].values.cut_in=10001],["wrong PSI unit",x=>x.responses.measurements[measures[0]].unit="bar"],["malformed remarks",x=>x.responses.comments="x".repeat(4001)],["missing policy metadata",x=>x.evidencePolicyId=null],["wrong policy version",x=>x.evidencePolicyVersion=2],["malformed policy hash",x=>x.evidencePolicySha256="bad"],["unknown policy field",x=>x.evidencePolicyDefinition.points.bad={allowed:true,required:false,maxCount:1}]] ){const x=clone(valid);mutate(x);check(name,rejects(x));}
const a=attachment(); for(const [name,items] of [["duplicate attachment UUID",[a,clone(a)]],["duplicate attachment field path",[a,attachment(5,paths[0])]],["cross-inspection attachment UUID",[{...a,inspectionClientUuid:uuid(99)}]],["unknown attachment path",[{...a,fieldPath:"bad"}]],["invalid MIME",[{...a,mimeType:"image/png"}]],["malformed hash",[{...a,sourceSha256:"bad"}]],["zero size",[{...a,sizeBytes:0}]],["negative size",[{...a,sizeBytes:-1}]],["unsafe size",[{...a,sizeBytes:2097153}]],["invalid width",[{...a,width:0}]],["invalid height",[{...a,height:0}]],["malformed attachment timestamp",[{...a,capturedAt:"bad"}]],["invalid attachment status",[{...a,status:"pending"}]],["extra attachment member",[{...a,extra:true}]]]) check(`${name} rejected at attachment stage`,!!parsed&&attachmentRejects({attachments:items},parsed));
const before={inspections:await localDatabase.masterSystemInspections.count(),attachments:await localDatabase.inspectionAttachments.count(),outbox:await localDatabase.syncOutbox.count()};const original=globalThis.fetch;globalThis.fetch=async url=>new Response(JSON.stringify(String(url).includes("inspection-attachments")?{attachments:[attachment()]}:{inspection:valid}),{status:200});try{const loaded=await loadServerAutomaticSprinklerDetail(valid.clientUuid);check("exact inspection UUID returned",loaded.clientUuid===valid.clientUuid);}catch{check("exact inspection UUID returned",false)}finally{globalThis.fetch=original}const after={inspections:await localDatabase.masterSystemInspections.count(),attachments:await localDatabase.inspectionAttachments.count(),outbox:await localDatabase.syncOutbox.count()};check("no local inspection created",before.inspections===after.inspections);check("no local attachment created",before.attachments===after.attachments);check("no outbox created",before.outbox===after.outbox);document.querySelector("#result").textContent=checks.map(([n,p])=>`${p?"PASS":"FAIL"} ${n}`).join("\n");};
</script></body></html>
