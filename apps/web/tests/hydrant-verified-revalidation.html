<!doctype html>
<html><body>
<button id="run">Run Hydrant verified revalidation checks</button><pre id="result">Ready</pre><div id="mount"></div>
<script type="module">
import * as React from "react";
import * as ReactDomClient from "react-dom/client";
import { App } from "/src/App.tsx";
import { localDatabase } from "/src/db/localDatabase.ts";
import { storeVerifiedIdentity } from "/src/auth/authStateRepository.ts";

const uuid=n=>`94000000-0000-4000-8000-${String(n).padStart(12,"0")}`;
const ids={job:uuid(1),client:uuid(2),template:uuid(3),revision:uuid(4),customer:uuid(5),system:uuid(6),zone:uuid(7),location:uuid(8),row:uuid(9),serverForm:uuid(10)};
const user={id:42,username:"hydrant-revalidation-test",role:"inspector"};
const row={rowUuid:ids.row,source:"configured",configuredLocationId:ids.location,configuredRowOrdinal:1,zoneSnapshot:{id:ids.zone,displayName:"Zone A"},locationSnapshot:{id:ids.location,displayName:"Hydrant Bank"},assetReference:"HYD-01",locationText:"Hydrant Bank",canvasHose1Result:"good",canvasHose2Result:"poor",diffuserNozzleResult:"good",landingValveResult:"good",landingValveHandleResult:"poor",hoseCabinetResult:"good",keyLockResult:"good",remarks:"Server checked",sortOrder:1};
const system={enabledSystemId:ids.system,systemKey:"hydrant",displayName:"Hydrant System",sortOrder:1,definitionStatus:"confirmed",zones:[{id:ids.zone,enabledSystemId:ids.system,key:"zone-a",displayName:"Zone A",sortOrder:1}],locations:[{id:ids.location,enabledSystemId:ids.system,zoneId:ids.zone,key:"bank",displayName:"Hydrant Bank",presetRowCount:1,rowPreset:{assetReference:"HYD-01"},sortOrder:1}],definition:{key:"hydrant"},repetitionMode:"single_with_repeatable_rows"};
const baseRecord={schemaVersion:1,clientUuid:ids.client,jobSystemKey:`${ids.job}:hydrant`,jobId:ids.job,systemKey:"hydrant",instanceKey:"primary",configuredZoneId:null,configuredLocationId:null,displaySequence:1,originalCreatorSnapshot:null,masterTemplate:{id:ids.template,code:"MFE-FSSR",version:1},configuration:{revisionId:ids.revision,revisionNumber:1},inspectionSnapshot:{schemaVersion:1,capturedAt:"2026-08-11T00:00:00.000Z",job:{id:ids.job,reference:"HYD-REVALIDATE",title:"Hydrant Verified Revalidation"},customer:{id:ids.customer,code:"HYD",displayName:"Hydrant Client"},configuration:{revisionId:ids.revision,revisionNumber:1},template:{id:ids.template,code:"MFE-FSSR",name:"Master Service Report",version:1},system},responses:{schemaVersion:1,hydrantType:"meter",rows:[row],comments:"LOCAL DRAFT COMMENTS"},performedAt:"2026-08-11T00:00:00.000Z",localCreatedAt:"2026-08-11T00:00:00.000Z",localUpdatedAt:"2026-08-11T00:00:00.000Z",syncStatus:"Draft"};
const summary={clientUuid:ids.client,jobId:ids.job,systemKey:"hydrant",instanceKey:"primary",zoneId:null,locationId:null,displaySequence:1,status:"submitted",performedAt:"2026-08-11T00:00:00.000000Z",deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:user.username};
const detail={clientUuid:ids.client,serverFormInstanceId:ids.serverForm,jobId:ids.job,jobReference:"HYD-REVALIDATE",jobTitle:"Hydrant Verified Revalidation",customerName:"Hydrant Client",systemKey:"hydrant",systemLabel:"Hydrant System",instanceKey:"primary",status:"submitted",performedAt:"2026-08-11T00:00:00.000000Z",receivedAt:"2026-08-11T00:01:00.000000Z",responses:{schemaVersion:1,hydrantType:"meter",rows:[row],comments:"SERVER ACCEPTED AFTER REVALIDATION"},displayControls:null,deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:user.username,evidencePolicyId:null,evidencePolicyVersion:null,evidencePolicyDefinition:null,evidencePolicySha256:null};
const waitFor=async predicate=>{for(let attempt=0;attempt<160;attempt+=1){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,25));}throw new Error("Timed out waiting for verified Hydrant revalidation UI")};
async function clear(){await localDatabase.open();await localDatabase.transaction("rw",localDatabase.masterSystemInspections,localDatabase.syncOutbox,localDatabase.authState,async()=>{await localDatabase.masterSystemInspections.clear();await localDatabase.syncOutbox.clear();await localDatabase.authState.clear();});}

async function runCase({name,outcome,status="Draft"}) {
  await clear();await storeVerifiedIdentity(user);await localDatabase.masterSystemInspections.put({...structuredClone(baseRecord),syncStatus:status});
  let authCalls=0,summaryCalls=0,detailCalls=0,revalidationSummaryStarted=false,releaseRevalidation;const originalFetch=globalThis.fetch;
  globalThis.fetch=async input=>{const url=String(input);if(url==="/api/auth/me"){authCalls+=1;return new Response(JSON.stringify({user}),{status:200,headers:{"Content-Type":"application/json"}});}if(url.startsWith("/api/master-system-inspections?")){summaryCalls+=1;if(summaryCalls===1)return new Response(JSON.stringify({inspections:[],hasMore:false,nextCursor:null}),{status:200,headers:{"Content-Type":"application/json"}});revalidationSummaryStarted=true;await new Promise(resolve=>{releaseRevalidation=resolve});if(outcome==="error")return new Response("",{status:503});return new Response(JSON.stringify({inspections:outcome==="accepted"?[summary]:[],hasMore:false,nextCursor:null}),{status:200,headers:{"Content-Type":"application/json"}});}if(url===`/api/master-system-inspections/${ids.client}`){detailCalls+=1;return new Response(JSON.stringify({inspection:detail}),{status:200,headers:{"Content-Type":"application/json"}});}return new Response("",{status:503});};
  window.location.hash=`#/hydrant-form/${ids.client}`;const mount=document.querySelector("#mount");mount.replaceChildren();let editableWhileAuthorityPending=false,watchAuthority=false;const observer=new MutationObserver(()=>{if(watchAuthority&&[...mount.querySelectorAll("button")].some(button=>button.textContent==="Save Draft"||button.textContent==="Submit Local"))editableWhileAuthorityPending=true;});observer.observe(mount,{subtree:true,childList:true});const root=ReactDomClient.createRoot(mount);root.render(React.createElement(App));
  try {
    await waitFor(()=>mount.textContent.includes("LOCAL DRAFT COMMENTS")&&(status!=="Draft"||[...mount.querySelectorAll("button")].some(button=>button.textContent==="Save Draft")));
    watchAuthority=true;window.dispatchEvent(new Event("online"));await waitFor(()=>revalidationSummaryStarted);await new Promise(resolve=>setTimeout(resolve,30));
    const protectedDuringRevalidation=!mount.textContent.includes("LOCAL DRAFT COMMENTS")&&!editableWhileAuthorityPending;releaseRevalidation();
    if(outcome==="none")await waitFor(()=>mount.textContent.includes("LOCAL DRAFT COMMENTS")&&[...mount.querySelectorAll("button")].some(button=>button.textContent==="Save Draft"));
    else if(outcome==="accepted")await waitFor(()=>mount.textContent.includes("SERVER ACCEPTED AFTER REVALIDATION")&&mount.textContent.includes("Accepted"));
    else await waitFor(()=>mount.textContent.includes("Hydrant inspection unavailable")&&!mount.textContent.includes("LOCAL DRAFT COMMENTS"));
    const finalText=mount.textContent,buttons=[...mount.querySelectorAll("button")].map(button=>button.textContent);const finalCorrect=outcome==="none"?finalText.includes("LOCAL DRAFT COMMENTS")&&buttons.includes("Save Draft"):outcome==="accepted"?finalText.includes("SERVER ACCEPTED AFTER REVALIDATION")&&!buttons.includes("Save Draft"):finalText.includes("Hydrant inspection unavailable")&&!buttons.includes("Save Draft");
    return {name,passed:authCalls>=2&&summaryCalls>=2&&protectedDuringRevalidation&&finalCorrect&&(outcome!=="accepted"||detailCalls===1)&&(outcome==="none"||!editableWhileAuthorityPending),authCalls,summaryCalls,detailCalls,protectedDuringRevalidation};
  } finally { observer.disconnect();root.unmount();globalThis.fetch=originalFetch;await new Promise(resolve=>setTimeout(resolve,20)); }
}

document.querySelector("#run").onclick=async()=>{const output=document.querySelector("#result");try{const cases=[];cases.push(await runCase({name:"A/B. verified Draft revalidates and resumes only after fresh no-Accepted authority",outcome:"none"}));cases.push(await runCase({name:"C. verified Draft revalidates and server Accepted wins",outcome:"accepted"}));cases.push(await runCase({name:"D. revalidation authority error fails closed",outcome:"error"}));cases.push(await runCase({name:"E. Pending stale local state revalidates to Accepted",outcome:"accepted",status:"Pending"}));cases.push(await runCase({name:"E. Failed stale local state revalidates to Accepted",outcome:"accepted",status:"Failed"}));output.textContent=JSON.stringify({status:cases.every(item=>item.passed)?"PASS":"FAIL",cases},null,2);}catch(error){output.textContent=JSON.stringify({status:"ERROR",message:String(error)},null,2)}finally{await clear().catch(()=>undefined)}};
</script></body></html>
