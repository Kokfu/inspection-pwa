<!doctype html><html><body><button id="run">Run Hydrant reload routing checks</button><pre id="result">Ready</pre><div id="mount"></div><script type="module">
import * as React from "react";
import * as ReactDomClient from "react-dom/client";
import { App } from "/src/App.tsx";
import { localDatabase } from "/src/db/localDatabase.ts";
import { storeVerifiedIdentity } from "/src/auth/authStateRepository.ts";

const uuid=n=>`93000000-0000-4000-8000-${String(n).padStart(12,"0")}`;
const ids={job:uuid(1),client:uuid(2),template:uuid(3),revision:uuid(4),customer:uuid(5),system:uuid(6),zone:uuid(7),location:uuid(8),row:uuid(9),serverForm:uuid(10)};
const user={id:42,username:"hydrant-route-test",role:"inspector"};
let browserOnline=true;Object.defineProperty(window.navigator,"onLine",{configurable:true,get:()=>browserOnline});const setBrowserOnline=online=>{browserOnline=online;};
const row={rowUuid:ids.row,source:"configured",configuredLocationId:ids.location,configuredRowOrdinal:1,zoneSnapshot:{id:ids.zone,displayName:"Zone A"},locationSnapshot:{id:ids.location,displayName:"Hydrant Bank"},assetReference:"HYD-01",locationText:"Hydrant Bank",canvasHose1Result:"good",canvasHose2Result:"poor",diffuserNozzleResult:"good",landingValveResult:"good",landingValveHandleResult:"poor",hoseCabinetResult:"good",keyLockResult:"good",remarks:"Server checked",sortOrder:1};
const system={enabledSystemId:ids.system,systemKey:"hydrant",displayName:"Hydrant System",sortOrder:1,definitionStatus:"confirmed",zones:[{id:ids.zone,enabledSystemId:ids.system,key:"zone-a",displayName:"Zone A",sortOrder:1}],locations:[{id:ids.location,enabledSystemId:ids.system,zoneId:ids.zone,key:"bank",displayName:"Hydrant Bank",presetRowCount:1,rowPreset:{assetReference:"HYD-01"},sortOrder:1}],definition:{key:"hydrant"},repetitionMode:"single_with_repeatable_rows"};
const baseRecord={schemaVersion:1,clientUuid:ids.client,jobSystemKey:`${ids.job}:hydrant`,jobId:ids.job,systemKey:"hydrant",instanceKey:"primary",configuredZoneId:null,configuredLocationId:null,displaySequence:1,originalCreatorSnapshot:null,masterTemplate:{id:ids.template,code:"MFE-FSSR",version:1},configuration:{revisionId:ids.revision,revisionNumber:1},inspectionSnapshot:{schemaVersion:1,capturedAt:"2026-08-11T00:00:00.000Z",job:{id:ids.job,reference:"HYD-RELOAD",title:"Hydrant Reload Authority"},customer:{id:ids.customer,code:"HYD",displayName:"Hydrant Client"},configuration:{revisionId:ids.revision,revisionNumber:1},template:{id:ids.template,code:"MFE-FSSR",name:"Master Service Report",version:1},system},responses:{schemaVersion:1,hydrantType:"meter",rows:[row],comments:"LOCAL STALE COMMENTS"},performedAt:"2026-08-11T00:00:00.000Z",localCreatedAt:"2026-08-11T00:00:00.000Z",localUpdatedAt:"2026-08-11T00:00:00.000Z",syncStatus:"Draft"};
const summary={clientUuid:ids.client,jobId:ids.job,systemKey:"hydrant",instanceKey:"primary",zoneId:null,locationId:null,displaySequence:1,status:"submitted",performedAt:"2026-08-11T00:00:00.000000Z",deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:user.username};
const detail={clientUuid:ids.client,serverFormInstanceId:ids.serverForm,jobId:ids.job,jobReference:"HYD-RELOAD",jobTitle:"Hydrant Reload Authority",customerName:"Hydrant Client",systemKey:"hydrant",systemLabel:"Hydrant System",instanceKey:"primary",status:"submitted",performedAt:"2026-08-11T00:00:00.000000Z",receivedAt:"2026-08-11T00:01:00.000000Z",responses:{schemaVersion:1,hydrantType:"meter",rows:[row],comments:"SERVER ACCEPTED COMMENTS"},displayControls:null,deviceReportedCreatorUsername:null,verifiedOriginalCreatorUsername:null,syncedByUsername:user.username,evidencePolicyId:null,evidencePolicyVersion:null,evidencePolicyDefinition:null,evidencePolicySha256:null};

const waitFor=async predicate=>{for(let attempt=0;attempt<120;attempt+=1){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,50));}throw new Error("Timed out waiting for routed Hydrant UI")};
async function clear(){await localDatabase.open();await localDatabase.transaction("rw",localDatabase.masterSystemInspections,localDatabase.syncOutbox,localDatabase.authState,async()=>{await localDatabase.masterSystemInspections.clear();await localDatabase.syncOutbox.clear();await localDatabase.authState.clear();});}

async function runCase({name,status,accepted=true,offline=false,error=false,empty=false}){
  await clear();
  setBrowserOnline(!offline);
  await storeVerifiedIdentity(user);
  if(!empty)await localDatabase.masterSystemInspections.put({...structuredClone(baseRecord),syncStatus:status});
  let summaryCalls=0,detailCalls=0;
  const originalFetch=globalThis.fetch;
  globalThis.fetch=async input=>{
    const url=String(input);
    if(url==="/api/auth/me")return offline?new Response("",{status:503}):new Response(JSON.stringify({user}),{status:200,headers:{"Content-Type":"application/json"}});
    if(url.startsWith("/api/master-system-inspections?")){summaryCalls+=1;if(error)return new Response("",{status:503});return new Response(JSON.stringify({inspections:accepted?[summary]:[],hasMore:false,nextCursor:null}),{status:200,headers:{"Content-Type":"application/json"}});}
    if(url===`/api/master-system-inspections/${ids.client}`){detailCalls+=1;if(error||!accepted)return new Response("",{status:error?503:404});return new Response(JSON.stringify({inspection:detail}),{status:200,headers:{"Content-Type":"application/json"}});}
    return new Response("",{status:503});
  };
  window.location.hash=`#/hydrant-form/${ids.client}`;
  const mount=document.querySelector("#mount");mount.replaceChildren();
  let editableFormSeen=false;const observer=new MutationObserver(()=>{const buttons=[...mount.querySelectorAll("button")].map(button=>button.textContent);if(buttons.includes("Save Draft")||buttons.includes("Submit Local"))editableFormSeen=true});observer.observe(mount,{subtree:true,childList:true});
  const root=ReactDomClient.createRoot(mount);root.render(React.createElement(App));
  try{
    if(offline||!accepted&&!error)await waitFor(()=>mount.textContent.includes("Draft"));
    else if(error)await waitFor(()=>mount.textContent.includes("Hydrant inspection unavailable")&&mount.textContent.includes("unavailable"));
    else await waitFor(()=>mount.textContent.includes("SERVER ACCEPTED COMMENTS")&&mount.textContent.includes("Accepted"));
    const text=mount.textContent,buttons=[...mount.querySelectorAll("button")].map(button=>button.textContent),recordCount=await localDatabase.masterSystemInspections.count();
    const serverView=text.includes("SERVER ACCEPTED COMMENTS")&&!text.includes("LOCAL STALE COMMENTS")&&!buttons.includes("Save Draft")&&!buttons.includes("Submit Local");
    const localView=text.includes("LOCAL STALE COMMENTS")&&buttons.includes("Save Draft");
    const unavailable=!buttons.includes("Save Draft")&&!buttons.includes("Submit Local")&&text.includes("Hydrant inspection unavailable");
    const passed=accepted&&!offline&&!error?serverView:offline||!accepted&&!error?localView:unavailable;
    return{name,passed,summaryCalls,detailCalls,recordCount,noPrematureCreate:recordCount===(empty?0:1),noEditableFormWhenAccepted:accepted&&!offline&&!error?serverView&&!editableFormSeen:true};
  }finally{observer.disconnect();root.unmount();globalThis.fetch=originalFetch;setBrowserOnline(true);await new Promise(resolve=>setTimeout(resolve,20));}
}

async function runReconnectCase(status){
  await clear();setBrowserOnline(false);await storeVerifiedIdentity(user);await localDatabase.masterSystemInspections.put({...structuredClone(baseRecord),syncStatus:status});
  let online=false;const originalFetch=globalThis.fetch;globalThis.fetch=async input=>{const url=String(input);if(url==="/api/auth/me")return online?new Response(JSON.stringify({user}),{status:200,headers:{"Content-Type":"application/json"}}):new Response("",{status:503});if(url.startsWith("/api/master-system-inspections?"))return new Response(JSON.stringify({inspections:[summary],hasMore:false,nextCursor:null}),{status:200,headers:{"Content-Type":"application/json"}});if(url===`/api/master-system-inspections/${ids.client}`)return new Response(JSON.stringify({inspection:detail}),{status:200,headers:{"Content-Type":"application/json"}});return new Response("",{status:503});};
  window.location.hash=`#/hydrant-form/${ids.client}`;const mount=document.querySelector("#mount");mount.replaceChildren();let editableAfterReconnect=false,watchReconnect=false;const observer=new MutationObserver(()=>{if(watchReconnect&&[...mount.querySelectorAll("button")].some(button=>button.textContent==="Save Draft"||button.textContent==="Submit Local"))editableAfterReconnect=true;});observer.observe(mount,{subtree:true,childList:true});const root=ReactDomClient.createRoot(mount);root.render(React.createElement(App));try{await waitFor(()=>{const buttons=[...mount.querySelectorAll("button")].map(button=>button.textContent);return mount.textContent.includes("LOCAL STALE COMMENTS")&&(status==="Draft"?buttons.includes("Save Draft"):mount.textContent.includes(status==="Pending"?"Pending Sync":"Failed"));});watchReconnect=true;online=true;setBrowserOnline(true);window.dispatchEvent(new Event("online"));await waitFor(()=>mount.textContent.includes("SERVER ACCEPTED COMMENTS")&&mount.textContent.includes("Accepted"));const noEditableFormWhenAccepted=!editableAfterReconnect&&!mount.textContent.includes("LOCAL STALE COMMENTS");return{name:`reconnect ${status}`,passed:noEditableFormWhenAccepted,noPrematureCreate:true,noEditableFormWhenAccepted};}finally{observer.disconnect();root.unmount();globalThis.fetch=originalFetch;setBrowserOnline(true);await new Promise(resolve=>setTimeout(resolve,20));}
}

document.querySelector("#run").onclick=async()=>{const output=document.querySelector("#result");try{const cases=[];
  cases.push(await runCase({name:"1. reload local Pending same UUID plus server Accepted",status:"Pending"}));
  cases.push(await runCase({name:"2. reload local Failed same UUID plus server Accepted",status:"Failed"}));
  cases.push(await runCase({name:"3. reload local Draft same UUID plus server Accepted",status:"Draft"}));
  cases.push(await runCase({name:"4. lost response starts with undefined click authority and resolves server Accepted",status:"Pending"}));
  cases.push(await runCase({name:"5. second device empty local storage discovers server Accepted",status:"Draft",empty:true}));
  cases.push(await runCase({name:"6. server proves no Accepted and local Draft opens",status:"Draft",accepted:false}));
  cases.push(await runCase({name:"7. genuine offline cached Draft remains usable",status:"Draft",offline:true}));
  cases.push(await runCase({name:"8. online resolution error fails closed",status:"Draft",error:true}));
  cases.push(await runReconnectCase("Pending"));
  cases.push(await runReconnectCase("Failed"));
  cases.push(await runReconnectCase("Draft"));
  output.textContent=JSON.stringify({status:cases.every(item=>item.passed&&item.noPrematureCreate&&item.noEditableFormWhenAccepted)?"PASS":"FAIL",cases},null,2);
}catch(error){output.textContent=JSON.stringify({status:"ERROR",message:String(error)},null,2)}finally{await clear().catch(()=>undefined)}};
</script></body></html>
