<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatic Sprinkler photo evidence test</title>
  </head>
  <body>
    <button id="run" type="button">Run Photo Evidence Test</button>
    <pre id="result">Ready</pre>
    <script type="module">
      import { localDatabase } from "/src/db/localDatabase.ts";
      import {
        getOrCreateAutomaticSprinklerInspection,
        returnFailedAutomaticSprinklerToDraft,
        saveAutomaticSprinklerDraft,
        submitLocalAutomaticSprinkler
      } from "/src/automaticSprinkler/automaticSprinklerRepository.ts";
      import {
        attachmentSaveError,
        listInspectionAttachments,
        removeDraftInspectionAttachment,
        saveDraftInspectionAttachment
      } from "/src/attachments/attachmentRepository.ts";
      import { processInspectionPhoto } from "/src/attachments/imageProcessing.ts";
      import {
        activateMediaStream,
        captureCameraFrame,
        initializeMediaStream,
        stopMediaStream
      } from "/src/attachments/CameraCaptureDialog.tsx";
      import { deriveAutomaticSprinklerProgress } from "/src/jobs/jobProgress.ts";
      import { recoverInterruptedSync, syncPendingRecords } from "/src/sync/syncEngine.ts";

      const ids = {
        job: "21000000-0000-4000-8000-000000000001",
        customer: "21000000-0000-4000-8000-000000000002",
        revision: "21000000-0000-4000-8000-000000000003",
        template: "21000000-0000-4000-8000-000000000004",
        enabledSystem: "21000000-0000-4000-8000-000000000005",
        policy: "21000000-0000-4000-8000-000000000006"
      };
      const fieldPath = "measurements.jockey_pump_pressure.cut_in";
      const allPaths = [
        fieldPath,
        "measurements.jockey_pump_pressure.cut_out",
        "measurements.duty_pump_cut_in.value",
        "measurements.standby_pump_cut_in.value",
        "measurements.water_supply_gauge.value",
        "measurements.installation_gauge.value"
      ];
      const points = Object.fromEntries(allPaths.map((path) => [
        path, { allowed: true, required: false, maxCount: 1 }
      ]));
      const policy = {
        id: ids.policy,
        code: "automatic-sprinkler-psi-evidence",
        version: 1,
        schemaVersion: 1,
        definition: {
          schemaVersion: 1,
          code: "automatic-sprinkler-psi-evidence",
          version: 1,
          systemKey: "automatic_sprinkler",
          points
        },
        definitionSha256: "a".repeat(64)
      };
      const item = (key, label, sortOrder) => ({
        key, label, sortOrder, control: "good_poor", allowedValues: ["good", "poor"]
      });
      const measurement = (key, label, sortOrder, values) => ({
        key, label, sortOrder,
        measurements: values.map(([valueKey, valueLabel]) => ({
          key: valueKey, label: valueLabel, unit: "PSI"
        })),
        result: { control: "good_poor", allowedValues: ["good", "poor"] }
      });
      const definition = {
        key: "automatic_sprinkler",
        configuration: { supportsZones: false, supportsLocations: false, supportsPresetRows: false },
        sections: [
          { key: "water_tank", blocks: [{ key: "water_tank_checks", items: [
            item("saj_main_water_supply", "Supply", 1), item("water_level", "Level", 2),
            item("automatic_refilling_facilities", "Refilling", 3),
            item("drain_and_stop_valve_positions", "Valves", 4)
          ] }] },
          { key: "pump_house", blocks: [
            { key: "pump_house_checks", items: [
              item("pump_house_clean", "Clean", 1), item("manual_start_pumps", "Manual", 2),
              item("standby_pump_service_items", "Service", 3),
              item("battery_charging_alternator", "Alternator", 4),
              item("battery_serviceable", "Battery", 5),
              item("pump_phase_failure_alarm", "Alarm", 6),
              item("pumps_auto_start", "Auto", 7),
              item("test_and_gate_valve_positions", "Positions", 8)
            ] },
            { key: "pump_pressure_measurements", items: [
              measurement("jockey_pump_pressure", "Jockey", 1, [["cut_in", "Cut In"], ["cut_out", "Cut Out"]]),
              measurement("duty_pump_cut_in", "Duty", 2, [["value", "Cut In"]]),
              measurement("standby_pump_cut_in", "Standby", 3, [["value", "Cut In"]])
            ] }
          ] },
          { key: "main_alarm_valve", blocks: [
            { key: "main_alarm_valve_checks", items: [
              item("breaching_inlet", "Inlet", 1), item("alarm_gong", "Gong", 2),
              item("flow_meter_valve_positions", "Flow", 3)
            ] },
            { key: "alarm_valve_measurements", items: [
              measurement("water_supply_gauge", "Supply", 1, [["value", "Gauge"]]),
              measurement("installation_gauge", "Installation", 2, [["value", "Gauge"]])
            ] },
            { key: "comments", field: { control: "remarks" } }
          ] }
        ]
      };
      const system = {
        enabledSystemId: ids.enabledSystem,
        systemKey: "automatic_sprinkler",
        displayName: "Automatic Sprinkler System",
        sortOrder: 1,
        definitionStatus: "confirmed",
        zones: [],
        locations: [],
        evidencePolicy: policy
      };
      const job = {
        id: ids.job,
        reference: "PHOTO-EVIDENCE-TEST",
        title: "Photo Evidence Test",
        status: "open",
        createdAt: new Date().toISOString(),
        configurationSnapshot: {
          schemaVersion: 1,
          customer: { id: ids.customer, code: "PHOTO", displayName: "Photo Test" },
          configuration: { revisionId: ids.revision, revisionNumber: 1 },
          template: { id: ids.template, code: "MFE-FSSR", name: "Test", version: 1 },
          enabledSystems: [system]
        }
      };
      const catalog = {
        id: ids.template, code: "MFE-FSSR", name: "Test", version: 1,
        selectionPolicy: "preset_only", headerDefinition: {}, reportBoilerplate: {},
        systems: [{
          key: system.systemKey, displayName: system.displayName, sortOrder: 1,
          definitionStatus: "confirmed", definition
        }]
      };

      function completeResponses(record) {
        const responses = structuredClone(record.responses);
        for (const group of [responses.waterTank, responses.pumpHouse, responses.mainAlarmValve]) {
          for (const value of Object.values(group)) value.result = "good";
        }
        for (const value of Object.values(responses.measurements)) {
          value.result = "good";
          for (const key of Object.keys(value.values)) value.values[key] = 10.5;
        }
        return responses;
      }

      async function testBlob() {
        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 240;
        const context = canvas.getContext("2d");
        context.fillStyle = "#f5f5f5";
        context.fillRect(0, 0, 320, 240);
        context.fillStyle = "#111111";
        context.font = "48px sans-serif";
        context.fillText("125 PSI", 60, 130);
        return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      }

      document.querySelector("#run").addEventListener("click", async () => {
        const result = document.querySelector("#result");
        try {
          const noPhotoJob = {
            ...job,
            id: "21000000-0000-4000-8000-000000000007",
            reference: "PHOTO-EVIDENCE-NONE",
            title: "No Photo Correction Test"
          };
          const prior = await localDatabase.masterSystemInspections
            .where("jobSystemKey").anyOf(
              `${ids.job}:automatic_sprinkler`,
              `${noPhotoJob.id}:automatic_sprinkler`
            ).toArray();
          await localDatabase.transaction("rw", [
            localDatabase.masterSystemInspections,
            localDatabase.inspectionAttachments,
            localDatabase.syncOutbox
          ], async () => {
            for (const record of prior) {
              await localDatabase.masterSystemInspections.delete(record.clientUuid);
              const photos = await localDatabase.inspectionAttachments
                .where("inspectionClientUuid").equals(record.clientUuid).toArray();
              await localDatabase.inspectionAttachments.bulkDelete(photos.map((photo) => photo.photoUuid));
              const work = await localDatabase.syncOutbox.where("entityId")
                .anyOf([record.clientUuid, ...photos.map((photo) => photo.photoUuid)]).toArray();
              await localDatabase.syncOutbox.bulkDelete(work.map((item) => item.operationId));
            }
          });

          const record = await getOrCreateAutomaticSprinklerInspection(job, system, catalog, undefined);
          const attachmentsOnOpen = await listInspectionAttachments(record.clientUuid);
          const outboxOnOpen = await localDatabase.syncOutbox.where("entityId").equals(record.clientUuid).count();
          const processed = await processInspectionPhoto(await testBlob());
          let corruptRejected = false;
          let oversizedRejected = false;
          let cancelledRejected = false;
          try {
            await processInspectionPhoto(new Blob(["not-an-image"]));
          } catch {
            corruptRejected = true;
          }
          try {
            await processInspectionPhoto(new Blob([new Uint8Array(20 * 1024 * 1024 + 1)]));
          } catch {
            oversizedRejected = true;
          }
          const cancelled = new AbortController();
          cancelled.abort();
          try {
            await processInspectionPhoto(await testBlob(), cancelled.signal);
          } catch (error) {
            cancelledRejected = error?.name === "AbortError";
          }
          const obsoleteController = new AbortController();
          const obsoleteProcessing = processInspectionPhoto(
            await testBlob(),
            obsoleteController.signal
          );
          obsoleteController.abort();
          let obsoleteProcessingRejected = false;
          try {
            await obsoleteProcessing;
          } catch (error) {
            obsoleteProcessingRejected = error?.name === "AbortError";
          }
          const newerProcessingSucceeded = Boolean(
            await processInspectionPhoto(await testBlob())
          );
          const notReadyTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          let notReadyRejected = false;
          try {
            await captureCameraFrame(null, () =>
              stopMediaStream({ getTracks: () => notReadyTracks })
            );
          } catch {
            notReadyRejected = true;
          }
          const notReadyTracksStopped =
            notReadyRejected
            && notReadyTracks.every((track) => track.readyState === "ended");
          const fakeTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          stopMediaStream({ getTracks: () => fakeTracks });
          const cameraTracksStopped = fakeTracks.every((track) => track.readyState === "ended");
          const missingVideoTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          const missingVideoStarted = await activateMediaStream(
            { getTracks: () => missingVideoTracks },
            null,
            () => true
          );
          const rejectedPlayTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          let rejectedPlayStopped = false;
          try {
            await activateMediaStream(
              { getTracks: () => rejectedPlayTracks },
              { srcObject: null, play: () => Promise.reject(new Error("play failed")) },
              () => true
            );
          } catch {
            rejectedPlayStopped = rejectedPlayTracks.every((track) => track.readyState === "ended");
          }
          const cameraFailureTracksStopped =
            missingVideoStarted === false
            && missingVideoTracks.every((track) => track.readyState === "ended")
            && rejectedPlayStopped;
          let resolveLateStream;
          let lateAcquired = 0;
          let lateCurrent = true;
          const lateTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          const lateInitialization = initializeMediaStream(
            () => new Promise((resolve) => { resolveLateStream = resolve; }),
            { srcObject: null, play: () => Promise.resolve() },
            () => lateCurrent,
            () => { lateAcquired += 1; }
          );
          lateCurrent = false;
          resolveLateStream({ getTracks: () => lateTracks });
          const lateResult = await lateInitialization;
          const cancelledInitializationSafe =
            lateResult === undefined
            && lateAcquired === 0
            && lateTracks.every((track) => track.readyState === "ended");

          let initializationGeneration = 1;
          let resolveOlderStream;
          let resolveNewerStream;
          let currentCameraStream;
          const video = { srcObject: null, play: () => Promise.resolve() };
          const olderTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          const newerTracks = [{ readyState: "live", stop() { this.readyState = "ended"; } }];
          const installCurrentStream = (stream) => {
            stopMediaStream(currentCameraStream);
            currentCameraStream = stream;
          };
          const olderInitialization = initializeMediaStream(
            () => new Promise((resolve) => { resolveOlderStream = resolve; }),
            video,
            () => initializationGeneration === 1,
            installCurrentStream
          );
          initializationGeneration = 2;
          const newerInitialization = initializeMediaStream(
            () => new Promise((resolve) => { resolveNewerStream = resolve; }),
            video,
            () => initializationGeneration === 2,
            installCurrentStream
          );
          resolveNewerStream({ getTracks: () => newerTracks });
          const newestStream = await newerInitialization;
          resolveOlderStream({ getTracks: () => olderTracks });
          const obsoleteStream = await olderInitialization;
          const repeatedInitializationSafe =
            newestStream === currentCameraStream
            && obsoleteStream === undefined
            && newerTracks.every((track) => track.readyState === "live")
            && olderTracks.every((track) => track.readyState === "ended");
          stopMediaStream(currentCameraStream);
          const quotaCause = new Error("quota");
          quotaCause.name = "QuotaExceededError";
          const wrappedQuota = new Error("Dexie storage write failed", {
            cause: quotaCause
          });
          const quotaMessageActionable = attachmentSaveError(wrappedQuota).message ===
            "Unable to save this photo because browser storage is full. Keep the page open, free device storage, then try again.";
          const saves = await Promise.all([
            saveDraftInspectionAttachment({
              inspectionClientUuid: record.clientUuid, fieldPath, policy,
              captureSource: "gallery", ...processed
            }),
            saveDraftInspectionAttachment({
              inspectionClientUuid: record.clientUuid, fieldPath, policy,
              captureSource: "gallery", ...processed
            })
          ]);
          const draftPhotos = await listInspectionAttachments(record.clientUuid);
          const replacementSource = await testBlob();
          const replacement = await processInspectionPhoto(replacementSource);
          const replaced = await saveDraftInspectionAttachment({
            inspectionClientUuid: record.clientUuid, fieldPath, policy,
            captureSource: "camera", ...replacement
          });
          const replacedPhotos = await listInspectionAttachments(record.clientUuid);
          const blobBytesBeforeSubmit = draftPhotos[0]?.blob.size;
          await submitLocalAutomaticSprinkler(record, completeResponses(record));
          await submitLocalAutomaticSprinkler(record, completeResponses(record));
          const submitted = await localDatabase.masterSystemInspections.get(record.clientUuid);
          const submittedPhotos = await listInspectionAttachments(record.clientUuid);
          const submittedManifest = JSON.stringify(submitted?.submittedAttachmentManifest);
          const submittedMarker = submitted?.attachmentSetSubmittedAt;
          const activeOutbox = await localDatabase.syncOutbox.where("status")
            .anyOf("Pending", "Failed", "Syncing").toArray();
          const initialParentOutbox = activeOutbox.find((item) => item.entityId === record.clientUuid);
          const initialPhotoOutbox = activeOutbox.find((item) => item.entityId === submittedPhotos[0].photoUuid);
          await localDatabase.transaction(
            "rw",
            localDatabase.masterSystemInspections,
            localDatabase.syncOutbox,
            async () => {
              await localDatabase.masterSystemInspections.update(record.clientUuid, {
                syncStatus: "Failed",
                lastSyncError: "Rejected for correction"
              });
              await localDatabase.syncOutbox.update(initialParentOutbox.operationId, {
                status: "Failed",
                lastError: "Rejected for correction"
              });
            }
          );
          const correctionDraft = await returnFailedAutomaticSprinklerToDraft(record);
          const staleTabResponses = completeResponses(record);
          staleTabResponses.comments = "Saved from stale pre-submission tab";
          const staleTabSaved = await saveAutomaticSprinklerDraft(record, staleTabResponses);
          const afterStaleTabSave = await localDatabase.masterSystemInspections
            .get(record.clientUuid);
          const staleTabPreservedFrozenEvidence =
            staleTabSaved.clientUuid === correctionDraft.clientUuid
            && staleTabSaved.attachmentSetSubmittedAt === submittedMarker
            && JSON.stringify(staleTabSaved.submittedAttachmentManifest) === submittedManifest
            && afterStaleTabSave?.attachmentSetSubmittedAt === submittedMarker
            && JSON.stringify(afterStaleTabSave?.submittedAttachmentManifest) === submittedManifest
            && afterStaleTabSave?.responses.comments === staleTabResponses.comments;
          let removeRejected = false;
          let replaceRejected = false;
          let addRejected = false;
          try {
            await removeDraftInspectionAttachment(record.clientUuid, fieldPath);
          } catch {
            removeRejected = true;
          }
          try {
            await saveDraftInspectionAttachment({
              inspectionClientUuid: record.clientUuid, fieldPath, policy,
              captureSource: "gallery", ...processed
            });
          } catch {
            replaceRejected = true;
          }
          try {
            await saveDraftInspectionAttachment({
              inspectionClientUuid: record.clientUuid, fieldPath: allPaths[1], policy,
              captureSource: "gallery", ...processed
            });
          } catch {
            addRejected = true;
          }
          const correctedResponses = completeResponses(correctionDraft);
          correctedResponses.comments = "Corrected response";
          const savedCorrection = await saveAutomaticSprinklerDraft(
            staleTabSaved,
            correctedResponses
          );
          await localDatabase.syncOutbox.delete(initialPhotoOutbox.operationId);
          let missingFrozenOperationRejected = false;
          try {
            await submitLocalAutomaticSprinkler(savedCorrection, correctedResponses);
          } catch {
            missingFrozenOperationRejected = true;
          }
          const afterRejectedCorrection = await localDatabase.masterSystemInspections
            .get(record.clientUuid);
          const parentOutboxAfterRejectedCorrection = await localDatabase.syncOutbox
            .get(initialParentOutbox.operationId);
          await localDatabase.syncOutbox.add(initialPhotoOutbox);
          await submitLocalAutomaticSprinkler(savedCorrection, correctedResponses);
          const correctionOutbox = await localDatabase.syncOutbox
            .where("entityId")
            .anyOf(record.clientUuid, submittedPhotos[0].photoUuid)
            .toArray();
          const correctionParentOutbox = correctionOutbox.find((item) => item.entityId === record.clientUuid);
          const correctionPhotoOutbox = correctionOutbox.find((item) => item.entityId === submittedPhotos[0].photoUuid);

          const noPhotoRecord = await getOrCreateAutomaticSprinklerInspection(
            noPhotoJob,
            system,
            catalog,
            undefined
          );
          await submitLocalAutomaticSprinkler(
            noPhotoRecord,
            completeResponses(noPhotoRecord)
          );
          const protectedLifecycleSaveRejected = {};
          for (const status of ["Pending", "Syncing", "Synced"]) {
            await localDatabase.masterSystemInspections.update(noPhotoRecord.clientUuid, {
              syncStatus: status
            });
            try {
              await saveAutomaticSprinklerDraft(
                noPhotoRecord,
                completeResponses(noPhotoRecord)
              );
              protectedLifecycleSaveRejected[status] = false;
            } catch {
              protectedLifecycleSaveRejected[status] = true;
            }
          }
          const protectedNoPhoto = await localDatabase.masterSystemInspections
            .get(noPhotoRecord.clientUuid);
          const protectedLifecyclePreserved =
            Object.values(protectedLifecycleSaveRejected).every(Boolean)
            && protectedNoPhoto?.syncStatus === "Synced"
            && Boolean(protectedNoPhoto?.attachmentSetSubmittedAt)
            && protectedNoPhoto?.submittedAttachmentManifest?.length === 0;
          const noPhotoWork = await localDatabase.syncOutbox
            .where("entityId")
            .equals(noPhotoRecord.clientUuid)
            .first();
          const noPhotoOperationId = noPhotoWork.operationId;
          await localDatabase.transaction(
            "rw",
            localDatabase.masterSystemInspections,
            localDatabase.syncOutbox,
            async () => {
              await localDatabase.masterSystemInspections.update(noPhotoRecord.clientUuid, {
                syncStatus: "Failed",
                lastSyncError: "Rejected for correction"
              });
              await localDatabase.syncOutbox.update(noPhotoWork.operationId, {
                status: "Failed",
                lastError: "Rejected for correction"
              });
            }
          );
          const noPhotoCorrection = await returnFailedAutomaticSprinklerToDraft(noPhotoRecord);
          const noPhotoCorrectedResponses = completeResponses(noPhotoCorrection);
          noPhotoCorrectedResponses.comments = "No-photo correction";
          await submitLocalAutomaticSprinkler(noPhotoCorrection, noPhotoCorrectedResponses);
          const noPhotoAfterResubmit = await localDatabase.masterSystemInspections.get(noPhotoRecord.clientUuid);
          const noPhotoOutboxAfter = await localDatabase.syncOutbox
            .where("entityId")
            .equals(noPhotoRecord.clientUuid)
            .toArray();

          const photo = submittedPhotos[0];
          const photoWork = correctionPhotoOutbox;
          await localDatabase.transaction("rw", localDatabase.inspectionAttachments, localDatabase.syncOutbox, async () => {
            await localDatabase.inspectionAttachments.update(photo.photoUuid, { syncStatus: "Uploading" });
            await localDatabase.syncOutbox.update(photoWork.operationId, { status: "Syncing" });
          });
          const recovered = await recoverInterruptedSync();
          const recoveredPhoto = await localDatabase.inspectionAttachments.get(photo.photoUuid);

          const calls = [];
          const originalFetch = window.fetch;
          window.fetch = async (input, init) => {
            const url = typeof input === "string" ? input : input.url;
            calls.push(url);
            if (url === "/api/sync") {
              return new Response(JSON.stringify({
                acceptedIds: [record.clientUuid, noPhotoRecord.clientUuid],
                duplicateIds: [],
                failed: []
              }), { status: 200, headers: { "Content-Type": "application/json" } });
            }
            return new Response(JSON.stringify({
              outcome: "accepted",
              attachment: {
                serverAttachmentId: "21000000-0000-4000-8000-000000000099",
                photoUuid: photo.photoUuid,
                fieldPath,
                captureSource: "gallery",
                mimeType: "image/jpeg",
                sizeBytes: photo.sizeBytes,
                width: photo.width,
                height: photo.height,
                sourceSha256: photo.sha256,
                storedSha256: "b".repeat(64),
                capturedAt: photo.capturedAt,
                receivedAt: new Date().toISOString()
              }
            }), { status: 201, headers: { "Content-Type": "application/json" } });
          };
          const sync = await syncPendingRecords();
          window.fetch = originalFetch;
          const syncedParent = await localDatabase.masterSystemInspections.get(record.clientUuid);
          const syncedNoPhotoParent = await localDatabase.masterSystemInspections.get(
            noPhotoRecord.clientUuid
          );
          const syncedPhotos = await listInspectionAttachments(record.clientUuid);
          const completedOutbox = await localDatabase.syncOutbox.where("entityId")
            .anyOf([record.clientUuid, photo.photoUuid]).toArray();
          const passed = attachmentsOnOpen.length === 0
            && outboxOnOpen === 0
            && draftPhotos.length === 1
            && saves.every((saved) => saved.photoUuid === draftPhotos[0].photoUuid)
            && replaced.photoUuid === draftPhotos[0].photoUuid
            && replacedPhotos[0]?.captureSource === "camera"
            && corruptRejected
            && oversizedRejected
            && cancelledRejected
            && obsoleteProcessingRejected
            && newerProcessingSucceeded
            && notReadyTracksStopped
            && cameraTracksStopped
            && cameraFailureTracksStopped
            && cancelledInitializationSafe
            && repeatedInitializationSafe
            && quotaMessageActionable
            && processed.mimeType === "image/jpeg"
            && processed.width <= 1600
            && processed.height <= 1600
            && processed.sizeBytes <= 2 * 1024 * 1024
            && blobBytesBeforeSubmit > 0
            && submitted?.syncStatus === "Pending"
            && submittedPhotos[0]?.syncStatus === "Pending"
            && activeOutbox.filter((item) =>
              item.entityId === record.clientUuid || item.entityId === photo.photoUuid
            ).length === 2
            && removeRejected
            && replaceRejected
            && addRejected
            && staleTabPreservedFrozenEvidence
            && protectedLifecyclePreserved
            && missingFrozenOperationRejected
            && afterRejectedCorrection?.syncStatus === "Draft"
            && parentOutboxAfterRejectedCorrection?.status === "Completed"
            && correctionParentOutbox?.operationId === initialParentOutbox?.operationId
            && correctionPhotoOutbox?.operationId === initialPhotoOutbox?.operationId
            && correctionOutbox.filter((item) => item.entityId === record.clientUuid).length === 1
            && correctionOutbox.filter((item) => item.entityId === photo.photoUuid).length === 1
            && noPhotoAfterResubmit?.syncStatus === "Pending"
            && noPhotoAfterResubmit?.attachmentSetSubmittedAt
            && noPhotoAfterResubmit?.submittedAttachmentManifest?.length === 0
            && noPhotoOutboxAfter.length === 1
            && noPhotoOutboxAfter[0]?.operationId === noPhotoOperationId
            && recovered > 0
            && recoveredPhoto?.syncStatus === "Failed"
            && calls[0] === "/api/sync"
            && calls[1] === "/api/inspection-attachments"
            && syncedParent?.syncStatus === "Synced"
            && syncedNoPhotoParent?.syncStatus === "Synced"
            && syncedPhotos[0]?.syncStatus === "Synced"
            && syncedPhotos[0]?.blob.size === blobBytesBeforeSubmit
            && deriveAutomaticSprinklerProgress(syncedParent, syncedPhotos) === "Completed"
            && completedOutbox.every((item) => item.status === "Completed");
          result.textContent = JSON.stringify({
            status: passed ? "PASS" : "FAIL",
            attachmentsOnOpen: attachmentsOnOpen.length,
            outboxOnOpen,
            onePhotoAfterConcurrentCapture: draftPhotos.length,
            stablePhotoUuid: saves.every((saved) => saved.photoUuid === draftPhotos[0].photoUuid),
            stablePhotoUuidAfterReplace: replaced.photoUuid === draftPhotos[0].photoUuid,
            replacementSource: replacedPhotos[0]?.captureSource,
            corruptRejected,
            oversizedRejected,
            cancelledRejected,
            obsoleteProcessingRejected,
            newerProcessingSucceeded,
            cameraTracksStopped,
            cameraFailureTracksStopped,
            notReadyTracksStopped,
            cancelledInitializationSafe,
            repeatedInitializationSafe,
            quotaMessageActionable,
            processedImage: {
              mimeType: processed.mimeType,
              width: processed.width,
              height: processed.height,
              sizeBytes: processed.sizeBytes
            },
            immutableAfterSubmit: { removeRejected, replaceRejected, addRejected },
            staleTabPreservedFrozenEvidence,
            protectedLifecycleSaveRejected,
            protectedLifecyclePreserved,
            rejectedCorrectionRolledBack: {
              rejected: missingFrozenOperationRejected,
              parentStatus: afterRejectedCorrection?.syncStatus,
              parentOutboxStatus: parentOutboxAfterRejectedCorrection?.status
            },
            correctionReusedOperations: {
              parent: correctionParentOutbox?.operationId === initialParentOutbox?.operationId,
              photo: correctionPhotoOutbox?.operationId === initialPhotoOutbox?.operationId
            },
            noPhotoCorrection: {
              status: noPhotoAfterResubmit?.syncStatus,
              manifestCount: noPhotoAfterResubmit?.submittedAttachmentManifest?.length,
              outboxCount: noPhotoOutboxAfter.length,
              operationReused: noPhotoOutboxAfter[0]?.operationId === noPhotoOperationId
            },
            staleUploadingRecovered: recoveredPhoto?.syncStatus,
            syncOrder: calls,
            parentStatus: syncedParent?.syncStatus,
            noPhotoParentStatus: syncedNoPhotoParent?.syncStatus,
            photoStatus: syncedPhotos[0]?.syncStatus,
            blobRetained: syncedPhotos[0]?.blob.size === blobBytesBeforeSubmit,
            progress: deriveAutomaticSprinklerProgress(syncedParent, syncedPhotos),
            syncMessage: sync.message
          }, null, 2);
        } catch (error) {
          result.textContent = JSON.stringify({
            status: "ERROR",
            name: error?.name,
            message: error instanceof Error ? error.message : String(error),
            stack: error instanceof Error ? error.stack : undefined
          }, null, 2);
        }
      });
    </script>
  </body>
</html>
