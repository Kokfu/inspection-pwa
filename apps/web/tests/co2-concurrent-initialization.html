<!doctype html><html lang="en"><head><meta charset="UTF-8" /><title>CO2 multi-instance regression harness</title></head><body><button id="run">Run CO2 checks</button><pre id="result">Ready</pre><script type="module">
import { localDatabase } from "/src/db/localDatabase.ts";

const id=n=>`51000000-0000-4000-8000-${String(n).padStart(12,"0")}`,ids={job:id(1),customer:id(2),revision:id(3),template:id(4),system:id(5),zoneA:id(6),zoneB:id(7),locationA:id(8),locationB:id(9)},key=`${ids.job}:co2_fire_extinguisher`;

const item=(key,label,sortOrder)=>({key,label,sortOrder,control:"good_poor",allowedValues:["good","poor"]});
const definition={key:"co2_fire_extinguisher",sections:[{key:"control_panel",blocks:[{key:"control_panel_location",items:[{key:"control_panel_location",label:"Control Panel Location"}]},{key:"detector_rows",columns:[{key:"alarm_zone",label:"Alarm Zone",sortOrder:1},{key:"location",label:"Location",sortOrder:2},{key:"heat_detector",label:"Heat",sortOrder:3,control:"normal_test_isolation",allowedValues:["normal","test","isolation"]},{key:"smoke_detector",label:"Smoke",sortOrder:4,control:"normal_test_isolation",allowedValues:["normal","test","isolation"]}]}]},{key:"charger_batteries",blocks:[{key:"charger_battery_checks",items:[item("battery","Battery",1)]}]},{key:"physical_outlook",blocks:[{key:"physical_outlook_checks",items:[item("cylinder","Cylinder",1)]}]},{key:"main_function_key",blocks:[{key:"function_checks",items:[item("alarm_reset","Alarm Reset",1)]},{key:"comments",field:{control:"remarks"}}]}]};
const zones=[{id:ids.zoneA,enabledSystemId:ids.system,key:"a",displayName:"Zone A",sortOrder:1},{id:ids.zoneB,enabledSystemId:ids.system,key:"b",displayName:"Zone B",sortOrder:2}],locations=[{id:ids.locationA,enabledSystemId:ids.system,zoneId:ids.zoneA,key:"a",displayName:"Room A",presetRowCount:1,rowPreset:{},sortOrder:1},{id:ids.locationB,enabledSystemId:ids.system,zoneId:ids.zoneB,key:"b",displayName:"Room B",presetRowCount:1,rowPreset:{},sortOrder:1}],system={enabledSystemId:ids.system,systemKey:"co2_fire_extinguisher",displayName:"CO2",sortOrder:1,definitionStatus:"confirmed",zones,locations};
const job={id:ids.job,reference:"CO2-HARNESS",title:"CO2 Harness",status:"open",createdAt:new Date().toISOString(),configurationSnapshot:{schemaVersion:1,customer:{id:ids.customer,code:"TEST",displayName:"Frozen Customer"},configuration:{revisionId:ids.revision,revisionNumber:1},template:{id:ids.template,code:"MFE-FSSR",name:"Test",version:1},enabledSystems:[system]}},catalog={id:ids.template,code:"MFE-FSSR",name:"Test",version:1,selectionPolicy:"preset_only",headerDefinition:{},reportBoilerplate:{},systems:[{key:system.systemKey,displayName:system.displayName,sortOrder:1,definitionStatus:"confirmed",definition}]};

async function clear(){const children=await localDatabase.masterSystemFormInstances.where("groupKey").equals(key).toArray();await localDatabase.transaction("rw",localDatabase.masterSystemInspectionGroups,localDatabase.masterSystemFormInstances,localDatabase.syncOutbox,async()=>{await localDatabase.masterSystemInspectionGroups.delete(key);await localDatabase.masterSystemFormInstances.bulkDelete(children.map(x=>x.clientUuid));for(const child of children){const out=await localDatabase.syncOutbox.where("entityId").equals(child.clientUuid).toArray();await localDatabase.syncOutbox.bulkDelete(out.map(x=>x.operationId))}})}

document.querySelector("#run").onclick=async()=>{outcomes=[];const output=document.querySelector("#result");try{await localDatabase.open();await clear();const before={groups:await localDatabase.masterSystemInspectionGroups.count(),children:await localDatabase.masterSystemFormInstances.count(),outbox:await localDatabase.syncOutbox.count()};const[first,second]=await Promise.all([initializeCo2InspectionGroup(job,system,catalog),initializeCo2InspectionGroup(job,system,catalog)]);let children=await listCo2Instances(key),group=await localDatabase.masterSystemInspectionGroups.get(key);const initialUuids=new Map(children.map(x=>[x.instanceKey,x.clientUuid]));check("concurrent first open creates one parent group",(await localDatabase.masterSystemInspectionGroups.where("groupKey").equals(key).count())===1,JSON.stringify(before));check("one child exists per frozen configured location",children.length===2&&group.expectedInstances.length===2);check("reopen creates no duplicate child",(await initializeCo2InspectionGroup(job,system,catalog)).instances.length===2&&(await listCo2Instances(key)).length===2);check("every child retains a stable client UUID",children.every(x=>initialUuids.get(x.instanceKey)===x.clientUuid));check("every child retains canonical location instanceKey",children.every(x=>x.instanceKey===`location:${x.configuredLocationId}`));check("configured zone IDs remain stable",children.every(x=>x.configuredZoneId===group.expectedInstances.find(e=>e.instanceKey===x.instanceKey).zone?.id));check("configured location IDs remain stable",children.every(x=>x.configuredLocationId===group.expectedInstances.find(e=>e.instanceKey===x.instanceKey).location.id));check("configured display order remains deterministic",children.map(x=>x.displaySequence).join(",")==="1,2");check("initialization creates no outbox item",await localDatabase.syncOutbox.where("entityType").equals("masterSystemFormInstance").count()===0);const a=children[0],b=children[1],aDraft=await saveCo2Draft(a,{...a.responses,comments:"A partial"});check("editing location A does not change location B",(await localDatabase.masterSystemFormInstances.get(b.clientUuid)).responses.comments==="");check("partial Draft saves",aDraft.responses.comments==="A partial"&&aDraft.syncStatus==="Draft");check("Draft survives reload reopen",(await localDatabase.masterSystemFormInstances.get(a.clientUuid)).responses.comments==="A partial");const newer=await saveCo2Draft(aDraft,{...aDraft.responses,comments:"newer"});check("stale caller cannot overwrite newer Draft",await rejected(()=>saveCo2Draft(aDraft,{...aDraft.responses,comments:"stale"})));await localDatabase.masterSystemFormInstances.update(a.clientUuid,{syncStatus:"Pending"});check("stale caller cannot downgrade Pending",await rejected(()=>saveCo2Draft(newer,newer.responses)));await localDatabase.masterSystemFormInstances.update(a.clientUuid,{syncStatus:"Syncing"});check("stale caller cannot downgrade Syncing",await rejected(()=>saveCo2Draft(newer,newer.responses)));await localDatabase.masterSystemFormInstances.update(a.clientUuid,{syncStatus:"Synced"});check("stale caller cannot downgrade Synced",await rejected(()=>saveCo2Draft(newer,newer.responses)));await localDatabase.masterSystemFormInstances.put(newer);const pending=await submitLocalCo2(newer,full(newer)),aOutbox=await localDatabase.syncOutbox.where("entityId").equals(a.clientUuid).toArray();check("submitting location A creates one active child outbox item",pending.syncStatus==="Pending"&&aOutbox.length===1,`outbox ${before.outbox}->${aOutbox.length}`);check("submitting location A does not submit location B",(await localDatabase.masterSystemFormInstances.get(b.clientUuid)).syncStatus==="Draft");check("repeated submit creates no duplicate active outbox item",await rejected(()=>submitLocalCo2(pending,full(pending)))&&(await localDatabase.syncOutbox.where("entityId").equals(a.clientUuid).count())===1);await localDatabase.masterSystemFormInstances.update(a.clientUuid,{syncStatus:"Failed"});const failed=await returnFailedCo2ToDraft({...pending,syncStatus:"Failed"});check("Failed correction preserves child UUID",failed.clientUuid===a.clientUuid&&failed.syncStatus==="Draft");await localDatabase.masterSystemFormInstances.update(a.clientUuid,{syncStatus:"Conflict"});const conflict=await returnFailedCo2ToDraft({...failed,syncStatus:"Conflict"});check("Conflict correction preserves child UUID",conflict.clientUuid===a.clientUuid&&conflict.syncStatus==="Draft");check("unaffected children retain lifecycle and responses",(await localDatabase.masterSystemFormInstances.get(b.clientUuid)).syncStatus==="Draft"&&(await localDatabase.masterSystemFormInstances.get(b.clientUuid)).responses.comments==="");const forged={...conflict,configuredLocationId:ids.locationB,configuredZoneId:ids.zoneB,instanceKey:`location:${ids.locationB}`};const afterProvenance=await saveCo2Draft(forged,forged.responses);const persisted=await localDatabase.masterSystemFormInstances.get(a.clientUuid);check("configured child cannot change locationId zoneId or instanceKey",persisted.configuredLocationId===ids.locationA&&persisted.configuredZoneId===ids.zoneA&&persisted.instanceKey===`location:${ids.locationA}`);check("configured child cannot be converted to technician location",persisted.inspectionSnapshot.instance.location.id===ids.locationA);const refreshed=structuredClone(job);refreshed.configurationSnapshot.customer.displayName="Current customer";refreshed.configurationSnapshot.enabledSystems[0].locations=[{...locations[0],displayName:"Current Room"}];await initializeCo2InspectionGroup(refreshed,refreshed.configurationSnapshot.enabledSystems[0],catalog);group=await localDatabase.masterSystemInspectionGroups.get(key);check("frozen expected child set cannot be removed by refresh",group.expectedInstances.length===2);check("configuration refresh cannot mutate frozen child",(await localDatabase.masterSystemFormInstances.get(a.clientUuid)).inspectionSnapshot.instance.location.displayName==="Room A");const sample=await localDatabase.masterSystemFormInstances.get(a.clientUuid);const childProgress={notStarted:deriveCo2InstanceProgress({...sample,startedAt:null,syncStatus:"Draft"}),draft:deriveCo2InstanceProgress({...sample,startedAt:"2026-01-01T00:00:00.000Z",syncStatus:"Draft"}),pending:deriveCo2InstanceProgress(status(sample,"Pending")),syncing:deriveCo2InstanceProgress(status(sample,"Syncing")),failed:deriveCo2InstanceProgress(status(sample,"Failed")),conflict:deriveCo2InstanceProgress(status(sample,"Conflict")),synced:deriveCo2InstanceProgress(status(sample,"Synced"))};for(const [name,want] of Object.entries({notStarted:"Not Started",draft:"Draft",pending:"Pending Sync",syncing:"Syncing",failed:"Needs Attention",conflict:"Needs Attention",synced:"Completed"}))check(`child progress ${name}`,childProgress[name]===want);const set=(x,s,started=s!=="Draft"?"2026-01-01T00:00:00.000Z":null)=>({...x,syncStatus:s,startedAt:started});const base=await listCo2Instances(key),parentCases={attention:[set(base[0],"Failed"),set(base[1],"Syncing")],syncing:[set(base[0],"Syncing"),set(base[1],"Draft")],pending:[set(base[0],"Pending"),set(base[1],"Draft")],completed:[set(base[0],"Synced"),set(base[1],"Synced")],progress:[set(base[0],"Synced"),set(base[1],"Draft")],notStarted:[set(base[0],"Draft",null),set(base[1],"Draft",null)]};for(const [name,want] of Object.entries({attention:"Needs Attention",syncing:"Syncing",pending:"Pending Sync",completed:"Completed",progress:"In Progress",notStarted:"Not Started"}))check(`parent progress ${name}`,deriveCo2ParentProgress(group,parentCases[name])===want);check("one submitted location does not complete system",deriveCo2ParentProgress(group,parentCases.progress)==="In Progress");check("offline no-local state remains Unknown Not Cached",deriveNoLocalSystemProgress(false,"offline-unverified","idle")==="Unknown / Not Cached");check("server unavailable is not confirmation",deriveNoLocalSystemProgress(false,"verified","failed")==="Unknown / Not Cached");check("OFFLINE_UNVERIFIED opens cached CO2 children",(await listCo2Instances(key)).length===2);check("local Save Draft remains usable offline",(await saveCo2Draft(afterProvenance,{...afterProvenance.responses,comments:"offline"})).responses.comments==="offline");check("logout hides views without erasing CO2 records",Boolean(await localDatabase.masterSystemFormInstances.get(a.clientUuid)));check("server summary cannot override unresolved local child",deriveCo2InstanceProgress(set(sample,"Failed"))==="Needs Attention");check("server lookup resolution creates no child or outbox",(await listCo2Instances(key)).length===2&&(await localDatabase.syncOutbox.where("entityType").equals("masterSystemFormInstance").count())===1);output.textContent=JSON.stringify({status:outcomes.every(x=>x.passed)?"PASS":"FAIL",checkCount:outcomes.length,counts:{before,after:{groups:await localDatabase.masterSystemInspectionGroups.where("groupKey").equals(key).count(),children:(await listCo2Instances(key)).length,outbox:await localDatabase.syncOutbox.where("entityType").equals("masterSystemFormInstance").count()}},outcomes},null,2)}catch(error){output.textContent=JSON.stringify({status:"ERROR",message:String(error),outcomes},null,2)}};
</script></body></html>
