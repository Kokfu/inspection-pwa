<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Offline authentication restoration test</title>
  </head>
  <body>
    <button id="run" type="button">Run Auth Restoration Test</button>
    <pre id="result">Ready</pre>
    <script type="module">
      import { getCurrentUser } from "/src/auth/authApi.ts";
      import {
        clearLocalIdentity,
        getDeviceAuthState,
        identityFromDeviceState,
        storeVerifiedIdentity
      } from "/src/auth/authStateRepository.ts";
      import { beginAuthVerificationState, decideAuthRestoration } from "/src/auth/authRestoration.ts";
      import { shouldRenderLogin } from "/src/auth/authStateTypes.ts";
      import { localDatabase } from "/src/db/localDatabase.ts";

      const draftId = "auth-restoration-business-data";
      const pendingId = "auth-restoration-pending-data";
      const user = { id: 41, username: "cached-inspector", role: "inspector" };

      document.querySelector("#run").addEventListener("click", async () => {
        const result = document.querySelector("#result");
        const originalFetch = window.fetch;
        try {
          await localDatabase.open();
          await localDatabase.authState.clear();
          await localDatabase.drafts.put({
            id: draftId,
            entityType: "auth-test",
            payload: { preserved: true },
            updatedAt: new Date().toISOString()
          });
          await localDatabase.drafts.put({
            id: pendingId,
            entityType: "auth-test",
            payload: { preserved: true, status: "Pending" },
            updatedAt: new Date().toISOString()
          });
          await storeVerifiedIdentity(user);
          const persisted = await getDeviceAuthState();
          const cached = identityFromDeviceState(persisted);
          const allowedKeys = new Set([
            "key", "schemaVersion", "userId", "username", "role",
            "lastVerifiedAt", "cachedAt", "explicitLogout",
            "serverLogoutPending"
          ]);
          const safePersistedShape =
            persisted
            && Object.keys(persisted).every((key) => allowedKeys.has(key))
            && !JSON.stringify(persisted).match(/password|token|cookie|secret|csrf/i);

          window.fetch = async () => { throw new TypeError("network unavailable"); };
          const transportFailureProbe = await getCurrentUser(25);
          // The decision must be identical for both browser connectivity hints:
          // only the lack of an HTTP response establishes offline-unverified.
          const browserOfflineCachedFailure = decideAuthRestoration(cached, transportFailureProbe);
          const browserOnlineCachedFailure = decideAuthRestoration(cached, transportFailureProbe);
          const coldOffline = decideAuthRestoration(cached, transportFailureProbe);
          const emptyTransportFailure = decideAuthRestoration(undefined, transportFailureProbe);
          const cachedDraftBeforeAuthCleanup = await localDatabase.drafts.get(draftId);
          const cachedPendingBeforeAuthCleanup = await localDatabase.drafts.get(pendingId);

          window.fetch = async () => new Response("", { status: 503 });
          const serverErrorProbe = await getCurrentUser(25);
          const cachedOnlineServerError = decideAuthRestoration(cached, serverErrorProbe);

          window.fetch = async () => new Response("", { status: 401 });
          const unauthorizedProbe = await getCurrentUser(25);
          const unauthorized = decideAuthRestoration(cached, unauthorizedProbe);
          window.fetch = async () => new Response("", { status: 403 });
          const forbiddenProbe = await getCurrentUser(25);
          const forbidden = decideAuthRestoration(cached, forbiddenProbe);
          const reverified = decideAuthRestoration(cached, {
            status: "authenticated",
            user
          });
          const reconnectGate = beginAuthVerificationState({
            status: "offline-unverified", user, lastVerifiedAt: cached.lastVerifiedAt
          });

          await clearLocalIdentity(true);
          const explicitLogoutState = await getDeviceAuthState();
          const loggedOutIdentity = identityFromDeviceState(explicitLogoutState);
          const businessDraftAfterLogout = await localDatabase.drafts.get(draftId);

          const passed =
            transportFailureProbe.status === "transport-unavailable"
            && browserOfflineCachedFailure.kind === "offline-unverified"
            && browserOnlineCachedFailure.kind === "offline-unverified"
            && coldOffline.kind === "offline-unverified"
            && cachedOnlineServerError.kind === "online-unavailable"
            && emptyTransportFailure.kind === "online-unavailable"
            && unauthorized.kind === "logged-out"
            && unauthorized.clearIdentity
            && forbidden.kind === "logged-out"
            && forbidden.clearIdentity
            && reverified.kind === "verified"
            && reconnectGate.status === "verifying"
            && safePersistedShape
            && cachedDraftBeforeAuthCleanup?.payload?.preserved === true
            && cachedPendingBeforeAuthCleanup?.payload?.status === "Pending"
            && explicitLogoutState?.explicitLogout === true
            && loggedOutIdentity === undefined
            && businessDraftAfterLogout?.payload?.preserved === true
            && shouldRenderLogin({ status: "restoring" }) === false
            && shouldRenderLogin({
              status: "logged-out",
              message: "Signed out"
            }) === true;

          result.textContent = JSON.stringify({
            status: passed ? "PASS" : "FAIL",
            browserOfflineCachedFailure: browserOfflineCachedFailure.kind,
            browserOnlineCachedFailure: browserOnlineCachedFailure.kind,
            transportFailureProbe: transportFailureProbe.status,
            coldStartWithoutRefresh: coldOffline.kind,
            browserOnlineServerError: cachedOnlineServerError.kind,
            noCacheNetworkFailure: emptyTransportFailure.kind,
            cachedLocalWorkAvailable: cachedDraftBeforeAuthCleanup?.payload?.preserved === true,
            cachedPendingWorkAvailable: cachedPendingBeforeAuthCleanup?.payload?.status === "Pending",
            unauthorized: unauthorized.kind,
            forbidden: forbidden.kind,
            reconnect200: reverified.kind,
            reconnectHidesEditableStateBeforeAuthority: reconnectGate.status,
            safePersistedShape,
            explicitLogoutBlocksRestore: loggedOutIdentity === undefined,
            businessDataPreserved: businessDraftAfterLogout?.payload?.preserved === true,
            restoringLoginHidden: shouldRenderLogin({ status: "restoring" }) === false
          }, null, 2);
        } catch (error) {
          result.textContent = JSON.stringify({
            status: "ERROR",
            message: error instanceof Error ? error.message : String(error)
          }, null, 2);
        } finally {
          window.fetch = originalFetch;
          await localDatabase.drafts.delete(draftId);
          await localDatabase.drafts.delete(pendingId);
          await localDatabase.authState.clear();
        }
      });
    </script>
  </body>
</html>
