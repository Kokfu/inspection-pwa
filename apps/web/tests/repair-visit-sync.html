    await syncPendingRepairVisits(ctx);
    const states = [(await row(h1.clientUuid)).syncStatus, (await row(h2.clientUuid)).syncStatus].sort();
    check("partial: one visit confirmed and one refused in the same run settle independently", states.join() === "Conflict,Synced" || states.join() === "Failed,Synced");

    // 11. Identity: a different technician's session sends nothing.
    await reset();
    const i = await newVisit();
    await syncPendingRepairVisits({ actorUserId: 9999, assertIdentity: async () => undefined });
    check("identity: a payload queued by one technician is not sent under another account", server.calls.length === 0 && (await ops(i.clientUuid)).every((op) => op.status === "Failed" || op.status === "Pending"));

    // 12. A submission the server refuses can be reopened; a photo the server already staged stays locked.
    await reset(); server.mode.submit = "refuse";
    const j = await newVisit(); const [j1, j2] = await complete(j); await submitRepairVisitLocal(j.clientUuid);
    await sync();
    const refusedJ = await row(j.clientUuid);
    check("refused submit: create and photos confirmed, Submit refused -> Needs attention, frozen and retained", refusedJ.createConfirmed && !!refusedJ.frozen && (refusedJ.syncStatus === "Failed" || refusedJ.syncStatus === "Conflict")
      && (await localDatabase.rvPhotos.where("visitUuid").equals(j.clientUuid).toArray()).every((photo) => photo.syncStatus === "Synced"));
    await reopenForEdit(j.clientUuid);
    const reopened = await row(j.clientUuid);
    check("reopen: unfrozen and editable again; the failed submit operation is dropped, create stays Completed", !reopened.frozen && reopened.syncStatus === "Synced" && !(await ops(j.clientUuid)).some((op) => op.payload.kind === "submit"));
    let lockedPhoto = "";
    try { await captureItemPhoto(j1.clientUuid, await png("#999"), "gallery"); } catch (error) { lockedPhoto = error.message; }
    check("reopen: a photo the server already staged cannot be replaced (one staged slot per field and revision)", /already sent/.test(lockedPhoto));
    await saveItemDraft(j2.clientUuid, { remark: "Reason updated" });
    server.mode.submit = undefined; server.calls.length = 0;
    await submitRepairVisitLocal(j.clientUuid);
    await sync();
    check("reopen: resubmit reuses the staged photos (no second upload) and is confirmed", calls("photo").length === 0 && calls("submit").length === 1 && (await row(j.clientUuid)).status === "awaiting_approval");

    // 13. Delete rules.
    await reset();
    const k = await newVisit();
    const outcomeK = await prepareDeleteRepairVisit(k.clientUuid);
    check("delete: an unstarted visit the server never received is removed locally with its queued operation", outcomeK.kind === "deleted-local" && !(await row(k.clientUuid)) && (await ops(k.clientUuid)).length === 0 && (await localDatabase.rvItems.count()) === 0);
    const l = await newVisit();
    const [l1] = await localDatabase.rvItems.where("visitUuid").equals(l.clientUuid).toArray();
    await saveItemDraft(l1.clientUuid, { remark: "started" });
    let startedMessage = "";
    try { await prepareDeleteRepairVisit(l.clientUuid); } catch (error) { startedMessage = error.message; }
    check("delete: a started visit cannot be deleted", /has not been started/.test(startedMessage) && !!(await row(l.clientUuid)));
    await saveItemDraft(l1.clientUuid, { remark: "" });
    await sync();
    const outcomeL = await prepareDeleteRepairVisit(l.clientUuid);
    check("delete: a visit already on the server needs the server to delete it first (revision sent)", outcomeL.kind === "needs-server" && outcomeL.revision === 1 && !!(await row(l.clientUuid)));

    // 14. Returned visits may drop and add fields (A5).
    await reset();
    const m = await newVisit(); await complete(m); await submitRepairVisitLocal(m.clientUuid); await sync();
    server.visits.get(m.clientUuid).status = "returned"; await refreshRepairVisitsFromServer();
    const [m1, m2] = await localDatabase.rvItems.where("visitUuid").equals(m.clientUuid).sortBy("sortOrder");
    await removeItem(m2.clientUuid);
    check("returned: a field can be removed (the other keeps its photo)", (await localDatabase.rvItems.where("visitUuid").equals(m.clientUuid).count()) === 1 && !!(await localDatabase.rvPhotos.get(m1.photoUuid)));
    let lastField = "";
    try { await removeItem(m1.clientUuid); } catch (error) { lastField = error.message; }
    check("returned: the last field cannot be removed", /at least one field/.test(lastField));
    await addItem(m.clientUuid, fields[2]);
    let duplicate = "";
    try { await addItem(m.clientUuid, fields[2]); } catch (error) { duplicate = error.message; }
    check("returned: a field can be added once", /already on this repair visit/.test(duplicate) && (await localDatabase.rvItems.where("visitUuid").equals(m.clientUuid).count()) === 2);
    let draftRemove = "";
    await reset(); const n = await newVisit(); const [n1] = await localDatabase.rvItems.where("visitUuid").equals(n.clientUuid).toArray();
    try { await removeItem(n1.clientUuid); } catch (error) { draftRemove = error.message; }
    check("draft: fields are not removable before the visit is returned", /after the visit is returned/.test(draftRemove));

    // 15. A failed refresh never rewrites local state.
    await reset();
    const o = await newVisit(); await complete(o); await submitRepairVisitLocal(o.clientUuid); await sync();
    server.visits.get(o.clientUuid).status = "returned"; server.mode.list = "500";
    let refreshFailed = false;
    try { await refreshRepairVisitsFromServer(); } catch { refreshFailed = true; }
    check("refresh failure: it throws and the visit is still the last known awaiting-approval state", refreshFailed && (await row(o.clientUuid)).status === "awaiting_approval");

    // 16. Field lists and Before photos for offline use.
    await reset();
    const beforeBytes = new Blob(["before-photo-bytes"], { type: "image/jpeg" });
    const beforeHash = await sha256Hex(await beforeBytes.arrayBuffer());
    const photoMeta = { photoUuid: u(9600), sourceSha256: hash("1"), storedSha256: beforeHash, sizeBytes: beforeBytes.size, width: 10, height: 10 };
    const withPhoto = { ...fieldOf(1), before: { ...fieldOf(1).before, photo: photoMeta } };
    const previousRow = { kind: "service", visitId: ids.previousSv, visitNumber: "SV-20261011-94", visitDate: "2026-10-11", createdAt: "2026-10-11T03:00:00.000Z", createdByUserId: userId };
    const catalogFetch = async (url) => {
      const path = new URL(String(url), location.origin).pathname;
      if (path.endsWith("/previous-visits")) return reply(200, { visits: [previousRow] });
      if (path.endsWith(`/previous-visits/service/${ids.previousSv}/catalog`)) return reply(200, { fields: [withPhoto] });
      if (path.endsWith(`/photos/${photoMeta.photoUuid}/content`)) return new Response(server.tamper ? new Blob(["tampered"]) : beforeBytes, { status: 200, headers: { "content-type": "image/jpeg" } });
      if (path.endsWith("/catalog")) return reply(200, { configurationRevisionId: ids.revision, fields: [fieldOf(1)] });
      if (path.endsWith("/sites")) return reply(200, { sites: [{ id: ids.site, customerId: ids.customer, code: "S", displayName: "Main Site" }] });
      if (path.endsWith("/configuration")) return reply(200, { customer: { id: ids.customer, code: "C", displayName: "C", isDemo: false }, configuration: { configurationId: ids.revision, revision: 1, templateId: u(1), templateCode: "T", templateName: "T", templateVersion: 7, selectionPolicy: "preset_only", enabledSystems: [] } });
      return reply(404, {});
    };
    window.fetch = catalogFetch;
    const list = await loadPreviousVisitList(ids.customer, ids.site, true);
    check("offline lists: the connected list is the server's, filtered to this technician", list.visits.length === 1 && !list.fromDevice);
    const online = await loadCatalog(ids.customer, ids.site, { kind: "service", visitId: ids.previousSv }, true, previousRow).catch((error) => ({ error: error.message }));
    check("offline lists: a connected catalog load saves the field list on the device", !online.error && (await localDatabase.rvPreviousVisits.count()) >= 1);
    window.fetch = async () => { throw new TypeError("Failed to fetch"); };
    const offlineList = await loadPreviousVisitList(ids.customer, ids.site, false);
    check("offline lists: offline shows only the visits whose field lists are saved here, labelled as from the device", offlineList.fromDevice && offlineList.visits.length === 1 && offlineList.visits[0].visitNumber === "SV-20261011-94");
    const offlineCatalog = await loadCatalog(ids.customer, ids.site, { kind: "service", visitId: ids.previousSv }, false).catch((error) => ({ error: error.message }));
    check("offline lists: the saved field list opens offline", !offlineCatalog.error && offlineCatalog.fromDevice && offlineCatalog.fields.length === 1);
    const missing = await loadCatalog(ids.customer, ids.site, null, false).catch((error) => error.message);
    check("offline lists: a field list that was never saved fails with a clear message instead of guessing", typeof missing === "string" && /not saved on this device/.test(missing));
    await localDatabase.rvPreviousVisits.toCollection().modify({ createdByUserId: 1 });
    const foreign = await loadPreviousVisitList(ids.customer, ids.site, false);
    check("offline lists: another technician's saved lists are never shown", foreign.visits.length === 0);

    window.fetch = catalogFetch;
    await localDatabase.rvPreviousVisits.clear();
    const report = await downloadCustomerForOffline(ids.customer);
    check("download: field lists for the 'none' list and the previous visit plus the Before photo are saved", report.sites === 1 && report.fieldLists === 2 && report.photos === 1 && report.failures.length === 0);
    const cached = await readCachedBeforePhoto({ kind: "service", visitId: ids.previousSv }, photoMeta);
    check("download: the Before photo is read back from the device after its hash is verified", cached instanceof Blob && cached.size === beforeBytes.size);
    await localDatabase.rvBeforePhotos.clear(); await localDatabase.rvPreviousVisits.clear(); server.tamper = true;
    const tampered = await downloadCustomerForOffline(ids.customer);
    check("download: a photo that fails its SHA-256 check is not saved and is reported", tampered.photos === 0 && tampered.failures.length >= 1 && (await localDatabase.rvBeforePhotos.count()) === 0);

    const failed = checks.filter((entry) => !entry.ok);
    out.textContent = JSON.stringify({ status: failed.length ? "FAIL" : "PASS", checks }, null, 1);
  } catch (error) {
    out.textContent = JSON.stringify({ status: "ERROR", message: String(error?.stack ?? error), checks }, null, 1);
  } finally { window.fetch = originalFetch; }
};
</script></body></html>
