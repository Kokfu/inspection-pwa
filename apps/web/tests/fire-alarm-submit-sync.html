<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Alarm submit and sync harness</title><link rel="stylesheet" href="/src/styles/app.css"><style>pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main class="app-shell"><section class="workspace"><h1>Fire Alarm submit and sync harness</h1><button id="run" type="button">Run Fire Alarm submit/sync checks</button><pre id="result">Ready</pre></section></main>
<script type="module">
import { localDatabase } from "/src/db/localDatabase.ts";
import { getPublishedFireAlarmDefinition } from "/src/fireAlarm/fireAlarmDefinition.ts";
import { fireAlarmJobSystemKey,getOrCreateFireAlarmInspection,returnFailedFireAlarmToDraft,saveFireAlarmDraft,submitFireAlarmLocal } from "/src/fireAlarm/fireAlarmRepository.ts";
import { fireAlarmChargerKeys,fireAlarmFunctionKeys,getFireAlarmSubmissionIssues } from "/src/fireAlarm/fireAlarmValidation.ts";
import { recoverInterruptedSync,syncPendingRecords } from "/src/sync/syncEngine.ts";

const id=n=>`75000000-0000-4000-8000-${String(n).padStart(12,"0")}`;
const output=document.querySelector("#result");let outcomes=[],fetchCalls=0,fetchBodies=[];const check=(name,passed,detail="")=>outcomes.push({name,passed:Boolean(passed),detail});
const rejected=async action=>{try{await action();return false}catch{return true}};const clone=structuredClone;
function fixture(seed){const ids={job:id(seed),customer:id(seed+100),revision:id(seed+200),template:id(4),system:id(seed+300),zone:id(seed+400),primary:id(seed+500),secondary:id(seed+600)};const system={enabledSystemId:ids.system,systemKey:"fire_alarm_detector",displayName:"Fire Alarm / Detector System",sortOrder:5,definitionStatus:"confirmed",zones:[{id:ids.zone,enabledSystemId:ids.system,key:"zone-a",displayName:"Zone A",sortOrder:1}],locations:[{id:ids.primary,enabledSystemId:ids.system,zoneId:ids.zone,key:"primary",displayName:"Lobby",presetRowCount:1,rowPreset:{fireAlarmTable:"primary",assetReference:"P-01"},sortOrder:1},{id:ids.secondary,enabledSystemId:ids.system,zoneId:null,key:"secondary",displayName:"Plant Room",presetRowCount:1,rowPreset:{fireAlarmTable:"secondary",assetReference:"S-01"},sortOrder:2}]};const template={id:ids.template,code:"MFE-FSSR",name:"Master Fire Alarm",version:3,selectionPolicy:"preset_only",headerDefinition:{},reportBoilerplate:{},systems:[{key:system.systemKey,displayName:system.displayName,sortOrder:5,definitionStatus:"confirmed",definition:getPublishedFireAlarmDefinition()}]};const catalog={template:{...template,id:id(20),version:1,systems:[]},templates:[template]};const job={id:ids.job,reference:`FIRE-SYNC-${seed}`,title:"Fire Alarm submit harness",status:"open",createdAt:new Date().toISOString(),configurationSnapshot:{schemaVersion:1,customer:{id:ids.customer,code:"TEST",displayName:"Harness"},configuration:{revisionId:ids.revision,revisionNumber:1},template:{id:ids.template,code:"MFE-FSSR",name:"Master Fire Alarm",version:3},enabledSystems:[system]}};return{ids,system,catalog,job,key:fireAlarmJobSystemKey(ids.job)}}
function complete(record){const responses=clone(record.responses);responses.controlPanelLocation="Ground Floor Panel";for(const row of responses.primaryDeviceRows)Object.assign(row,{manualCallPoint:"normal",flowSwitch:"test",heatDetector:"isolation",smokeDetector:"normal"});for(const key of fireAlarmChargerKeys)responses.chargerAndBatteries[key].result="good";for(const key of fireAlarmFunctionKeys)responses.mainFunctionKeys[key].result="poor";for(const row of responses.secondaryAlarmDeviceRows)Object.assign(row,{alarmBell:"good",manualCallPoint:"poor"});return responses}
async function removeFixture(f){const records=await localDatabase.masterSystemInspections.where("jobSystemKey").equals(f.key).toArray();await localDatabase.transaction("rw",localDatabase.masterSystemInspections,localDatabase.syncOutbox,async()=>{for(const record of records){const work=await localDatabase.syncOutbox.where("entityId").equals(record.clientUuid).toArray();await localDatabase.syncOutbox.bulkDelete(work.map(item=>item.operationId))}await localDatabase.masterSystemInspections.bulkDelete(records.map(item=>item.clientUuid))})}
const work=uuid=>localDatabase.syncOutbox.where("entityId").equals(uuid).toArray();
async function withFetch(body,action,{rejectNetwork=false}={}){const original=globalThis.fetch;globalThis.fetch=async(_input,init)=>{fetchCalls+=1;fetchBodies.push(init?.body?JSON.parse(init.body):null);if(rejectNetwork)throw new Error("network unavailable");return new Response(JSON.stringify(body),{status:200,headers:{"Content-Type":"application/json"}})};try{return await action()}finally{globalThis.fetch=original}}
async function pending(seed){const f=fixture(seed);await removeFixture(f);const draft=await getOrCreateFireAlarmInspection(f.job,f.system,f.catalog);return{f,draft,submitted:await submitFireAlarmLocal(draft,complete(draft))}}

document.querySelector("#run").onclick=async()=>{outcomes=[];const beforeAttachments=await localDatabase.inspectionAttachments.count();try{await localDatabase.open();const f=fixture(1);await removeFixture(f);let draft=await getOrCreateFireAlarmInspection(f.job,f.system,f.catalog);const initial=clone(draft);
  check("incomplete form submission rejected",await rejected(()=>submitFireAlarmLocal(draft,draft.responses)));
  const valid=complete(draft);const requiredCases=[["control panel",x=>x.controlPanelLocation=""],["primary row",x=>x.primaryDeviceRows=[]],["manual call point",x=>x.primaryDeviceRows[0].manualCallPoint=null],["flow switch",x=>x.primaryDeviceRows[0].flowSwitch=null],["heat detector",x=>x.primaryDeviceRows[0].heatDetector=null],["smoke detector",x=>x.primaryDeviceRows[0].smokeDetector=null],["secondary alarm bell",x=>x.secondaryAlarmDeviceRows[0].alarmBell=null],["secondary manual call point",x=>x.secondaryAlarmDeviceRows[0].manualCallPoint=null],["secondary location",x=>x.secondaryAlarmDeviceRows[0].location=""]];for(const key of fireAlarmChargerKeys)requiredCases.push([`charger ${key}`,x=>x.chargerAndBatteries[key].result=null]);for(const key of fireAlarmFunctionKeys)requiredCases.push([`function ${key}`,x=>x.mainFunctionKeys[key].result=null]);for(const [name,mutate] of requiredCases){const candidate=clone(valid);mutate(candidate);check(`${name} independently required`,getFireAlarmSubmissionIssues(candidate,draft.inspectionSnapshot).length>0)}
  const primaryUuids=valid.primaryDeviceRows.map(row=>row.rowUuid),secondaryUuids=valid.secondaryAlarmDeviceRows.map(row=>row.rowUuid),snapshot=JSON.stringify(draft.inspectionSnapshot),createdAt=draft.localCreatedAt;
  const submitted=await submitFireAlarmLocal(draft,valid);const submittedWork=await work(draft.clientUuid);check("valid complete submission succeeds",submitted.syncStatus==="Pending");check("Draft to Pending",draft.syncStatus==="Draft"&&submitted.syncStatus==="Pending");check("exactly one active outbox operation",submittedWork.length===1&&submittedWork[0].activeKey===`masterSystemInspection:create:${draft.clientUuid}`&&submittedWork[0].status==="Pending");check("outbox payload exact UUID",submittedWork[0].entityId===draft.clientUuid&&submittedWork[0].payload.clientUuid===draft.clientUuid);check("row UUIDs preserved",JSON.stringify(primaryUuids)===JSON.stringify(submitted.responses.primaryDeviceRows.map(row=>row.rowUuid))&&JSON.stringify(secondaryUuids)===JSON.stringify(submitted.responses.secondaryAlarmDeviceRows.map(row=>row.rowUuid)));check("immutable fields preserved",submitted.clientUuid===draft.clientUuid&&submitted.localCreatedAt===createdAt&&JSON.stringify(submitted.inspectionSnapshot)===snapshot);check("performedAt current and localUpdatedAt monotonic",submitted.performedAt===submitted.localUpdatedAt&&submitted.localUpdatedAt>draft.localUpdatedAt);check("repeated submit does not duplicate outbox",await rejected(()=>submitFireAlarmLocal(submitted,valid))&&(await work(draft.clientUuid)).length===1);check("stale submit rejected",await rejected(()=>submitFireAlarmLocal(initial,valid)));check("non-Draft submit rejected",await rejected(()=>submitFireAlarmLocal(submitted,valid)));check("Pending cannot be edited",await rejected(()=>saveFireAlarmDraft(submitted,valid)));check("Pending cannot be downgraded by stale save",await rejected(()=>saveFireAlarmDraft(draft,draft.responses))&&(await localDatabase.masterSystemInspections.get(draft.clientUuid)).syncStatus==="Pending");
  await localDatabase.masterSystemInspections.update(submitted.clientUuid,{syncStatus:"Failed",lastSyncError:"test failure"});const failed=await localDatabase.masterSystemInspections.get(submitted.clientUuid),corrected=await returnFailedFireAlarmToDraft(failed),retired=(await work(draft.clientUuid))[0];check("correction from Failed returns to Draft",corrected.syncStatus==="Draft");check("former operation retired immutably",retired.status==="Completed"&&!retired.activeKey&&retired.payload.responses.controlPanelLocation==="Ground Floor Panel");const correctedResponses=complete(corrected);correctedResponses.comments="corrected";const resubmitted=await submitFireAlarmLocal(corrected,correctedResponses),history=await work(draft.clientUuid);check("resubmit creates new active operation",history.length===2&&history.filter(item=>item.activeKey).length===1);check("old operation remains retired",history.some(item=>item.operationId===retired.operationId&&item.status==="Completed"&&!item.activeKey));
  await withFetch({acceptedIds:[resubmitted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());let synced=await localDatabase.masterSystemInspections.get(resubmitted.clientUuid);check("exact acceptedIds UUID marks Synced",synced.syncStatus==="Synced");check("confirmed operation completed",(await work(resubmitted.clientUuid)).filter(item=>item.activeKey).length===0);
  const duplicateCase=await pending(2);await withFetch({acceptedIds:[],duplicateIds:[duplicateCase.submitted.clientUuid],failed:[]},()=>syncPendingRecords());check("exact duplicateIds UUID marks Synced",(await localDatabase.masterSystemInspections.get(duplicateCase.submitted.clientUuid)).syncStatus==="Synced");
  const unrelatedCase=await pending(3);await withFetch({acceptedIds:[crypto.randomUUID()],duplicateIds:[crypto.randomUUID()],failed:[]},()=>syncPendingRecords());check("unrelated accepted/duplicate UUID does not mark Synced",(await localDatabase.masterSystemInspections.get(unrelatedCase.submitted.clientUuid)).syncStatus==="Failed");await removeFixture(unrelatedCase.f);
  const emptyCase=await pending(4);await withFetch({acceptedIds:[],duplicateIds:[],failed:[]},()=>syncPendingRecords());check("empty success response does not mark Synced",(await localDatabase.masterSystemInspections.get(emptyCase.submitted.clientUuid)).syncStatus==="Failed");await removeFixture(emptyCase.f);
  const genericMessageCase=await pending(10);await withFetch({message:"success"},()=>syncPendingRecords());check("generic-message-only HTTP 200 does not mark Synced",(await localDatabase.masterSystemInspections.get(genericMessageCase.submitted.clientUuid)).syncStatus==="Failed");await removeFixture(genericMessageCase.f);
  const unrelatedDuplicateCase=await pending(11);await withFetch({acceptedIds:[],duplicateIds:[crypto.randomUUID()],failed:[]},()=>syncPendingRecords());check("unrelated duplicate UUID does not mark Synced",(await localDatabase.masterSystemInspections.get(unrelatedDuplicateCase.submitted.clientUuid)).syncStatus==="Failed");await removeFixture(unrelatedDuplicateCase.f);
  const activeConflictCase=await pending(12),activeOperationBefore=(await work(activeConflictCase.submitted.clientUuid))[0],activePayloadBefore=clone(activeOperationBefore.payload);await withFetch({acceptedIds:[],duplicateIds:[],failed:[{id:activeConflictCase.submitted.clientUuid,code:"ACTIVE_INSPECTION_EXISTS",message:"another Fire Alarm inspection is active"}]},()=>syncPendingRecords());const activeConflicted=await localDatabase.masterSystemInspections.get(activeConflictCase.submitted.clientUuid),activeWorkAfter=(await work(activeConflictCase.submitted.clientUuid))[0],activeRequests=fetchCalls;check("ACTIVE_INSPECTION_EXISTS becomes Conflict",activeConflicted.syncStatus==="Conflict");check("active conflict keeps exact operation",activeWorkAfter.operationId===activeOperationBefore.operationId&&activeWorkAfter.activeKey===activeOperationBefore.activeKey&&JSON.stringify(activeWorkAfter.payload)===JSON.stringify(activePayloadBefore));await withFetch({acceptedIds:[activeConflicted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());await withFetch({acceptedIds:[activeConflicted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());const activeRepeated=await localDatabase.masterSystemInspections.get(activeConflicted.clientUuid),activeRepeatedWork=(await work(activeConflicted.clientUuid))[0];check("active conflict never auto-retries",fetchCalls===activeRequests&&activeRepeated.syncStatus==="Conflict"&&activeRepeatedWork.attempts===activeWorkAfter.attempts&&JSON.stringify(activeRepeatedWork.payload)===JSON.stringify(activePayloadBefore));
  const interruptedOther=await pending(13),interruptedOtherWork=(await work(interruptedOther.submitted.clientUuid))[0];await localDatabase.transaction("rw",localDatabase.masterSystemInspections,localDatabase.syncOutbox,async()=>{await localDatabase.masterSystemInspections.update(interruptedOther.submitted.clientUuid,{syncStatus:"Syncing"});await localDatabase.syncOutbox.update(interruptedOtherWork.operationId,{status:"Syncing"})});const conflictBeforeRecovery=await localDatabase.masterSystemInspections.get(activeConflicted.clientUuid),conflictWorkBeforeRecovery=(await work(activeConflicted.clientUuid))[0],recoveryRequests=fetchCalls;await recoverInterruptedSync();const conflictAfterRecovery=await localDatabase.masterSystemInspections.get(activeConflicted.clientUuid),conflictWorkAfterRecovery=(await work(activeConflicted.clientUuid))[0];check("interrupted recovery preserves Conflict",conflictAfterRecovery.syncStatus==="Conflict"&&conflictAfterRecovery.syncStatus!=="Pending"&&conflictAfterRecovery.syncStatus!=="Failed"&&conflictAfterRecovery.syncStatus!=="Syncing");check("interrupted recovery leaves conflict operation immutable",conflictWorkAfterRecovery.operationId===conflictWorkBeforeRecovery.operationId&&conflictWorkAfterRecovery.attempts===conflictWorkBeforeRecovery.attempts&&conflictWorkAfterRecovery.status===conflictWorkBeforeRecovery.status&&JSON.stringify(conflictWorkAfterRecovery.payload)===JSON.stringify(conflictWorkBeforeRecovery.payload)&&fetchCalls===recoveryRequests&&conflictBeforeRecovery.localUpdatedAt===conflictAfterRecovery.localUpdatedAt);await removeFixture(interruptedOther.f);
  const failedCase=await pending(5),conflictOperationBefore=(await work(failedCase.submitted.clientUuid))[0],conflictPayloadBefore=clone(conflictOperationBefore.payload);await withFetch({acceptedIds:[],duplicateIds:[],failed:[{id:failedCase.submitted.clientUuid,code:"IDEMPOTENCY_CONFLICT",message:"changed replay"}]},()=>syncPendingRecords());const conflicted=await localDatabase.masterSystemInspections.get(failedCase.submitted.clientUuid),conflictWorkAfterResponse=(await work(failedCase.submitted.clientUuid))[0],requestsAtConflict=fetchCalls;check("exact failedIds conflict becomes Conflict",conflicted.syncStatus==="Conflict");await withFetch({acceptedIds:[conflicted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());await withFetch({acceptedIds:[conflicted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());const repeatedConflict=await localDatabase.masterSystemInspections.get(conflicted.clientUuid),repeatedWork=(await work(conflicted.clientUuid))[0];check("repeated sync keeps Conflict",repeatedConflict.syncStatus==="Conflict");check("Conflict causes no further HTTP request",fetchCalls===requestsAtConflict);check("Conflict attempts do not increase",repeatedWork.attempts===conflictWorkAfterResponse.attempts);check("Conflict payload remains deep equal",JSON.stringify(repeatedWork.payload)===JSON.stringify(conflictPayloadBefore));check("Conflict keeps exact active historical operation",repeatedWork.operationId===conflictOperationBefore.operationId&&repeatedWork.activeKey===conflictOperationBefore.activeKey);const correctedConflict=await returnFailedFireAlarmToDraft(repeatedConflict),retiredConflict=(await work(conflicted.clientUuid))[0];check("correction from Conflict returns to Draft and retires exact work",correctedConflict.syncStatus==="Draft"&&retiredConflict.operationId===conflictOperationBefore.operationId&&retiredConflict.status==="Completed"&&!retiredConflict.activeKey);check("retired conflict payload remains unchanged",JSON.stringify(retiredConflict.payload)===JSON.stringify(conflictPayloadBefore));const correctedConflictResponses=complete(correctedConflict);correctedConflictResponses.comments="conflict corrected";const conflictResubmitted=await submitFireAlarmLocal(correctedConflict,correctedConflictResponses),conflictHistory=await work(conflicted.clientUuid),newConflictOperation=conflictHistory.find(item=>item.activeKey);check("Conflict resubmission creates different operation ID",newConflictOperation&&newConflictOperation.operationId!==retiredConflict.operationId);const dispatchedBefore=fetchBodies.length;await withFetch({acceptedIds:[conflictResubmitted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());const lastDispatches=fetchBodies.slice(dispatchedBefore).flatMap(body=>body?.items??[]);check("retired conflict operation is never dispatched again",lastDispatches.every(item=>item.operationId!==retiredConflict.operationId));
  const networkCase=await pending(6);const networkPayload=JSON.stringify(networkCase.submitted.responses);await withFetch({},()=>syncPendingRecords(),{rejectNetwork:true});const networkFailed=await localDatabase.masterSystemInspections.get(networkCase.submitted.clientUuid);check("network failure preserves data",networkFailed.syncStatus==="Failed"&&JSON.stringify(networkFailed.responses)===networkPayload&&(await work(networkCase.submitted.clientUuid)).length===1);await withFetch({acceptedIds:[networkCase.submitted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());const retriedWork=await work(networkCase.submitted.clientUuid);check("retry reuses one operation and syncs once",(await localDatabase.masterSystemInspections.get(networkCase.submitted.clientUuid)).syncStatus==="Synced"&&retriedWork.length===1&&retriedWork[0].attempts===2);
  const mismatchCase=await pending(7),mismatchWork=(await work(mismatchCase.submitted.clientUuid))[0];await localDatabase.syncOutbox.update(mismatchWork.operationId,{payload:{...mismatchWork.payload,clientUuid:crypto.randomUUID()}});await withFetch({acceptedIds:[mismatchCase.submitted.clientUuid],duplicateIds:[],failed:[]},()=>syncPendingRecords());check("mismatched operation payload is rejected before dispatch",(await localDatabase.masterSystemInspections.get(mismatchCase.submitted.clientUuid)).syncStatus==="Failed"&&(await work(mismatchCase.submitted.clientUuid))[0].status==="Failed");
  const addFailureFixture=fixture(8);await removeFixture(addFailureFixture);const addFailureDraft=await getOrCreateFireAlarmInspection(addFailureFixture.job,addFailureFixture.system,addFailureFixture.catalog),addFailureBefore=clone(addFailureDraft),originalOutboxAdd=localDatabase.syncOutbox.add;let addRejected=false;localDatabase.syncOutbox.add=async()=>{throw new Error("forced outbox add failure")};try{await submitFireAlarmLocal(addFailureDraft,complete(addFailureDraft))}catch{addRejected=true}finally{localDatabase.syncOutbox.add=originalOutboxAdd}const addFailureAfter=await localDatabase.masterSystemInspections.get(addFailureDraft.clientUuid);check("outbox add failure rolls back record",addRejected&&addFailureAfter.syncStatus==="Draft"&&JSON.stringify(addFailureAfter.responses)===JSON.stringify(addFailureBefore.responses)&&addFailureAfter.localUpdatedAt===addFailureBefore.localUpdatedAt&&addFailureAfter.performedAt===addFailureBefore.performedAt&&addFailureAfter.lastSyncError===addFailureBefore.lastSyncError&&(await work(addFailureDraft.clientUuid)).length===0);
  const putFailureFixture=fixture(9);await removeFixture(putFailureFixture);const putFailureDraft=await getOrCreateFireAlarmInspection(putFailureFixture.job,putFailureFixture.system,putFailureFixture.catalog),originalInspectionPut=localDatabase.masterSystemInspections.put;let putRejected=false;localDatabase.masterSystemInspections.put=async()=>{throw new Error("forced inspection put failure")};try{await submitFireAlarmLocal(putFailureDraft,complete(putFailureDraft))}catch{putRejected=true}finally{localDatabase.masterSystemInspections.put=originalInspectionPut}check("inspection put failure leaves no orphan operation",putRejected&&(await localDatabase.masterSystemInspections.get(putFailureDraft.clientUuid)).syncStatus==="Draft"&&(await work(putFailureDraft.clientUuid)).length===0);
  check("no attachment table writes",await localDatabase.inspectionAttachments.count()===beforeAttachments);check("primary and secondary rows remain atomic",networkFailed.responses.primaryDeviceRows.length===1&&networkFailed.responses.secondaryAlarmDeviceRows.length===1);
  output.textContent=JSON.stringify({status:outcomes.every(item=>item.passed)?"PASS":"FAIL",checkCount:outcomes.length,outcomes},null,2)
}catch(error){output.textContent=JSON.stringify({status:"ERROR",message:error instanceof Error?error.stack:String(error),outcomes},null,2)}};
