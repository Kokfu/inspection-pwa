<!doctype html><html><body><button id="run">Run technician location proposal sync checks</button><pre id="result">Ready</pre><script type="module">
import { activateUserWorkspace, deviceDatabase, localDatabase } from "/src/db/localDatabase.ts";
import {
  loadTechnicianLocationProposalDraft, newTechnicianLocationProposalDraft, queueTechnicianLocationProposal,
  saveTechnicianLocationProposalDraft, syncPendingLocationProposals
} from "/src/jobs/technicianLocationProposalDraft.ts";
const id = n => `6a000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const out = document.querySelector("#result"), checks = [];
const check = (name, ok) => checks.push({ name, ok: Boolean(ok) });
const jobId = id(1), customerId = id(2), systemKey = "co2_fire_extinguisher";
function draftWith(zoneCount = 1, locationCount = 1) {
  const draft = newTechnicianLocationProposalDraft(jobId, customerId, systemKey);
  draft.zones = Array.from({ length: zoneCount }, (_v, index) => ({ key: `zone-${index}`, displayName: `Zone ${index}` }));
  draft.locations = Array.from({ length: locationCount }, (_v, index) => ({ key: `loc-${index}`, displayName: `Location ${index}`, zoneKey: `zone-${index % Math.max(zoneCount, 1)}`, presetRowCount: 1 }));
  return draft;
}
document.querySelector("#run").onclick = async () => {
  const originalFetch = window.fetch;
  try {
    await deviceDatabase.open();
    await activateUserWorkspace(9001);
    await deviceDatabase.authState.put({ key: "device-auth", userId: 9001, username: "lp-tech", role: "inspector", serverLogoutPending: false, explicitLogout: false });
    await localDatabase.drafts.clear();
    await localDatabase.syncOutbox.clear();

    // A new draft with no data is returned when nothing is saved yet.
    const empty = await loadTechnicianLocationProposalDraft(jobId, systemKey, customerId);
    check("fresh draft starts in Draft status with no zones/locations", empty.status === "Draft" && empty.zones.length === 0 && empty.locations.length === 0);

    // Save persists across a simulated reload (re-reading from IndexedDB, never React state).
    const withRows = { ...draftWith(1, 1), id: empty.id };
    await saveTechnicianLocationProposalDraft(withRows);
    const reloaded = await loadTechnicianLocationProposalDraft(jobId, systemKey, customerId);
    check("saved draft survives a simulated reload", reloaded.zones.length === 1 && reloaded.locations.length === 1 && reloaded.id === withRows.id);

    // Queueing with no zones/locations is refused (local validation, no outbox item created).
    const bare = newTechnicianLocationProposalDraft(jobId, customerId, "wet_chemical");
    let refused = false;
    try { await queueTechnicianLocationProposal(bare); } catch { refused = true; }
    check("queueing an empty proposal is refused", refused);
    check("a refused queue attempt creates no outbox item", (await localDatabase.syncOutbox.toArray()).length === 0);

    // Queueing a valid draft moves it to Pending and creates exactly one outbox item.
    const pending = await queueTechnicianLocationProposal(reloaded);
    check("queueing moves the draft to Pending", pending.status === "Pending");
    const afterQueue = await loadTechnicianLocationProposalDraft(jobId, systemKey, customerId);
    check("the persisted draft reflects Pending", afterQueue.status === "Pending");
    const outboxAfterQueue = await localDatabase.syncOutbox.toArray();
    check("exactly one outbox item was created, keyed by the draft's own id", outboxAfterQueue.length === 1 && outboxAfterQueue[0].operationId === reloaded.id);

    // A network failure preserves the Pending work as Failed -- never silently drops it.
    window.fetch = async () => { throw new Error("network unreachable"); };
    await syncPendingLocationProposals(9001);
    const afterFailedSync = await loadTechnicianLocationProposalDraft(jobId, systemKey, customerId);
    check("a network failure marks the draft Failed, not lost", afterFailedSync.status === "Failed" && typeof afterFailedSync.lastError === "string");
    const outboxAfterFailure = await localDatabase.syncOutbox.toArray();
    check("the outbox item is marked Failed and stays queued for retry", outboxAfterFailure[0]?.status === "Failed");

    // Retrying after a Failed sync succeeds once the server accepts it. The client must never mark the
    // record Synced from an HTTP 200 alone -- it must confirm the exact submitted id.
    window.fetch = async (url, init) => {
      const body = JSON.parse(init.body);
      check("the submitted payload carries the draft's own client-generated id", body.id === reloaded.id);
      return new Response(JSON.stringify({ proposal: { id: body.id, status: "pending" } }), { status: 201 });
    };
    await syncPendingLocationProposals(9001);
    const afterSuccessSync = await loadTechnicianLocationProposalDraft(jobId, systemKey, customerId);
    check("a confirmed submission marks the draft Synced", afterSuccessSync.status === "Synced");
    const outboxAfterSuccess = await localDatabase.syncOutbox.toArray();
    check("the outbox item is marked Completed", outboxAfterSuccess[0]?.status === "Completed");

    // A server response confirming a DIFFERENT id must never be trusted as success for this draft.
    await localDatabase.drafts.clear(); await localDatabase.syncOutbox.clear();
    const second = draftWith(1, 1);
    await saveTechnicianLocationProposalDraft(second);
    await queueTechnicianLocationProposal(second);
    window.fetch = async () => new Response(JSON.stringify({ proposal: { id: id(999), status: "pending" } }), { status: 201 });
    await syncPendingLocationProposals(9001);
    const mismatchDraft = await loadTechnicianLocationProposalDraft(jobId, systemKey, customerId);
    check("a mismatched server-confirmed id never marks the draft Synced", mismatchDraft.status === "Failed");

    window.fetch = originalFetch;
    out.textContent = JSON.stringify({ status: checks.every(x => x.ok) ? "PASS" : "FAIL", checks });
  } catch (error) {
    window.fetch = originalFetch;
    out.textContent = JSON.stringify({ status: "ERROR", message: error.stack || String(error) });
  }
};
</script></body></html>
