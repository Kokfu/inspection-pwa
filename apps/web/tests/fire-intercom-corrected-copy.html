<!doctype html><html><body><button id="run">Run corrected copy checks</button><pre id="result">Ready</pre><script type="module">
import { activateUserWorkspace, localDatabase } from "/src/db/localDatabase.ts";
import { startCorrectedFireIntercomCopy, supersededArchiveKey } from "/src/fireIntercom/fireIntercomRepository.ts";
import { saveFireIntercomV7Photo } from "/src/fireIntercom/fireIntercomV7Evidence.ts";
import { countUnsyncedWork } from "/src/sync/unsyncedWork.ts";

const checks = [];
const check = (name, passed, detail) => checks.push({ name, passed: Boolean(passed), detail: passed ? undefined : detail });
const id = (n) => `95000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const jobId = id(1), oldUuid = id(2), photoA = id(3), photoB = id(4), rowA = id(5), rowB = id(6);
const pathA = `station_schedule.station_schedule_rows.rows.${rowA}.condition`, pathB = `station_schedule.station_schedule_rows.rows.${rowB}.condition`;
const at = "2026-10-07T10:00:00.000Z";
const bytes = (n) => new Blob([new Uint8Array(500).fill(n)], { type: "image/jpeg" });
const hash = (n) => String(n).repeat(64).slice(0, 64);
const row = (rowUuid, sortOrder) => ({ rowUuid, source: "technician", configuredLocationId: null, configuredRowOrdinal: null, zoneSnapshot: null, locationSnapshot: null, assetReference: "S" + sortOrder, conditionResult: "not_good", remarks: "", fieldRemarks: { conditionResult: "finding" }, sortOrder });
const record = (over = {}) => ({ schemaVersion: 1, clientUuid: oldUuid, jobSystemKey: `${jobId}:fire_intercom`, jobId, systemKey: "fire_intercom", instanceKey: "primary", configuredZoneId: null, configuredLocationId: null, displaySequence: 1, originalCreatorSnapshot: null, masterTemplate: { id: id(9), code: "MFE-FSSR", version: 7 }, configuration: { revisionId: id(8), revisionNumber: 1 }, inspectionSnapshot: { schemaVersion: 1, capturedAt: at, job: { id: jobId, reference: "SV-T", title: "t" }, customer: {}, configuration: {}, template: {}, system: { definition: { k: 1 }, locations: [] } }, responses: { schemaVersion: 1, rows: [row(rowA, 1), row(rowB, 2)], comments: "" }, performedAt: at, localCreatedAt: at, localUpdatedAt: at, syncStatus: "Failed", lastSyncError: "Staged V7 evidence does not exactly match the frozen manifest", ...over });
const photo = (photoUuid, fieldPath, n, status = "Synced") => ({ photoUuid, inspectionClientUuid: oldUuid, systemKey: "fire_intercom", fieldPath, evidencePolicyId: "v7-shared-evidence", evidencePolicyVersion: 7, captureSource: "camera", blob: bytes(n), mimeType: "image/jpeg", sizeBytes: 500, width: 8, height: 8, sha256: hash(n), storedSha256: "e".repeat(64), serverAttachmentId: "srv", lastSyncedAt: at, capturedAt: at, localCreatedAt: at, localUpdatedAt: at, syncStatus: status, protocolVersion: 7, masterTemplateId: id(9), contractSha256: "c".repeat(64) });
const outbox = (operationId, entityType, entityId, status) => ({ operationId, entityType, entityId, action: "create", payload: {}, createdAt: at, attempts: 3, status, activeKey: status === "Completed" ? undefined : `${entityType}:create:${entityId}` });
const attempt = async (fn) => { try { await fn(); return ""; } catch (error) { return String(error.message); } };

async function seed(over = {}, parentOutboxStatus = "Failed") {
  const db = localDatabase;
  await Promise.all([db.masterSystemInspections.clear(), db.inspectionAttachments.clear(), db.syncOutbox.clear(), db.drafts.clear()]);
  await db.masterSystemInspections.add(record(over));
  await db.inspectionAttachments.bulkAdd([photo(photoA, pathA, 1), photo(photoB, pathB, 1)]); // same bytes: the SV-59 duplicate case
  await db.syncOutbox.bulkAdd([outbox("op-parent", "masterSystemInspection", oldUuid, parentOutboxStatus), outbox("op-a", "v7StagedEvidence", photoA, "Completed"), outbox("op-b", "v7StagedEvidence", photoB, "Failed")]);
}
const live = () => localDatabase.masterSystemInspections.get(oldUuid);

document.getElementById("run").addEventListener("click", async () => {
  try {
    await activateUserWorkspace(902);
    const db = localDatabase;
    await seed();
    const old = await live();
    const copy = await startCorrectedFireIntercomCopy(old);
    check("a new record identity replaces the rejected one", copy.clientUuid !== oldUuid && copy.syncStatus === "Draft" && copy.supersedes?.clientUuid === oldUuid, copy);
    check("old record is gone from the live table; only the copy exists for the job+system", !(await live()) && (await db.masterSystemInspections.where("jobSystemKey").equals(`${jobId}:fire_intercom`).count()) === 1);
    check("answers are carried over unchanged", JSON.stringify(copy.responses) === JSON.stringify(old.responses));
    check("no stale sync error on the copy", copy.lastSyncError === undefined && copy.lastSyncedAt === undefined);
    const photos = await db.inspectionAttachments.toArray();
    check("photos were re-keyed (new photoUuid, new parent), same bytes, Draft, server fields cleared", photos.length === 2 && photos.every((p) => p.inspectionClientUuid === copy.clientUuid && ![photoA, photoB].includes(p.photoUuid) && p.syncStatus === "Draft" && p.storedSha256 === undefined && p.serverAttachmentId === undefined && p.lastSyncedAt === undefined && p.blob.size === 500), photos.map((p) => [p.photoUuid, p.syncStatus]));
    const archive = await db.drafts.get(supersededArchiveKey(oldUuid));
    check("rejected record is archived with metadata only (no photo bytes)", archive?.entityType === "supersededInspection" && archive.payload.replacedBy === copy.clientUuid && archive.payload.record.clientUuid === oldUuid && archive.payload.photos.length === 2 && archive.payload.photos.every((p) => !("blob" in p)), archive);
    const open = await db.syncOutbox.where("status").notEqual("Completed").toArray();
    check("no open outbox item remains for the rejected record or its photos", open.length === 0, open);
    const closed = await db.syncOutbox.get("op-parent");
    check("the rejected record's parent item is closed as superseded", closed.status === "Completed" && closed.activeKey === undefined && /Superseded/.test(closed.lastError), closed);
    const unsynced = await countUnsyncedWork();
    check("header 'needs attention' source is cleared (no Pending/Syncing/Failed work)", unsynced.waiting === 0 && unsynced.failed === 0, unsynced);

    // The duplicate-bytes problem is now fixable: the new photo has never been staged, so replacing it is allowed.
    const target = photos.find((p) => p.fieldPath === pathB);
    await saveFireIntercomV7Photo({ record: copy, fieldPath: pathB, captureSource: "gallery", blob: bytes(2), mimeType: "image/jpeg", sizeBytes: 500, width: 8, height: 8, sha256: hash(2) });
    const replaced = await db.inspectionAttachments.get(target.photoUuid);
    check("replacing a photo on the copy works and keeps the copy's own photoUuid", replaced.sha256 === hash(2) && replaced.syncStatus === "Draft", replaced);

    // Same-UUID correction: a photo that already left Draft can no longer be replaced.
    await seed({ syncStatus: "Draft" });
    const replaceError = await attempt(async () => saveFireIntercomV7Photo({ record: await live(), fieldPath: pathA, captureSource: "gallery", blob: bytes(3), mimeType: "image/jpeg", sizeBytes: 500, width: 8, height: 8, sha256: hash(3) }));
    check("replacing a submitted photo in place is refused with a pointer to the corrected copy", /Start corrected copy/.test(replaceError), replaceError);
    check("the refused replace changed nothing", (await db.inspectionAttachments.get(photoA)).sha256 === hash(1));
    const draftCopy = await startCorrectedFireIntercomCopy(await live());
    check("a Draft with a submitted photo can start a corrected copy", draftCopy.syncStatus === "Draft" && draftCopy.clientUuid !== oldUuid);

    // Guards.
    for (const status of ["Pending", "Synced", "Syncing"]) {
      await seed({ syncStatus: status });
      const err = await attempt(async () => startCorrectedFireIntercomCopy(await live()));
      check(`refused for a ${status} record and nothing changed`, /rejected record/.test(err) && Boolean(await live()), err);
    }
    await seed({ syncStatus: "Draft" }); await db.inspectionAttachments.clear(); await db.inspectionAttachments.add(photo(photoA, pathA, 1, "Draft"));
    check("refused for a plain Draft with no submitted photo", /rejected record/.test(await attempt(async () => startCorrectedFireIntercomCopy(await live()))));
    await seed();
    const stale = await attempt(async () => startCorrectedFireIntercomCopy({ ...(await live()), localUpdatedAt: "2020-01-01T00:00:00.000Z" }));
    check("a stale caller is refused", /changed elsewhere/.test(stale) && Boolean(await live()), stale);
    await seed({}, "Syncing");
    const syncing = await attempt(async () => startCorrectedFireIntercomCopy(await live()));
    check("refused while the rejected record is mid-sync", /syncing right now/.test(syncing) && Boolean(await live()), syncing);

    // Atomicity: a failure at the last step leaves the rejected record fully intact.
    await seed();
    const realAdd = db.inspectionAttachments.add.bind(db.inspectionAttachments);
    let calls = 0; db.inspectionAttachments.add = (...args) => { calls += 1; if (calls === 2) throw new Error("injected failure"); return realAdd(...args); };
    const injected = await attempt(async () => startCorrectedFireIntercomCopy(await live()));
    db.inspectionAttachments.add = realAdd;
    check("a mid-transaction failure rolls everything back", /injected/.test(injected)
      && Boolean(await live()) && (await db.masterSystemInspections.count()) === 1
      && (await db.inspectionAttachments.count()) === 2 && (await db.inspectionAttachments.get(photoA)) !== undefined
      && !(await db.drafts.get(supersededArchiveKey(oldUuid))) && (await db.syncOutbox.where("status").notEqual("Completed").count()) === 2, { injected });
    document.getElementById("result").textContent = JSON.stringify({ status: checks.every((c) => c.passed) ? "PASS" : "FAIL", checks });
  } catch (error) {
    document.getElementById("result").textContent = JSON.stringify({ status: "FAIL", message: String(error?.stack ?? error), checks });
  }
});
</script></body></html>
