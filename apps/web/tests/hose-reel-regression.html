<!doctype html><html lang="en"><head><meta charset="UTF-8" /><title>Hose Reel regression harness</title></head><body><button id="run">Run Hose Reel checks</button><pre id="result">Ready</pre><script type="module">
import { localDatabase } from "/src/db/localDatabase.ts";
import { addHoseReelRow, editFailedHoseReel, getOrCreateHoseReelInspection, saveHoseReelDraft, submitLocalHoseReel } from "/src/hoseReel/hoseReelRepository.ts";
import { deriveMasterSystemProgress, deriveNoLocalSystemProgress } from "/src/jobs/jobProgress.ts";
const id=(n)=>`41000000-0000-4000-8000-${String(n).padStart(12,"0")}`, ids={job:id(1),customer:id(2),revision:id(3),template:id(4),system:id(5),zone:id(6),location:id(7)};
const check=(name,passed,detail="")=>outcomes.push({name,passed:Boolean(passed),detail}), rejected=async(fn)=>{try{await fn();return false}catch{return true}}; let outcomes=[];
const item=(key,sortOrder)=>({key,label:key,sortOrder,control:"good_poor",allowedValues:["good","poor"]}), definition={key:"hose_reel",sections:[{key:"water_tank",blocks:[{key:"water_tank_checks",items:[item("water_level",1)]}]},{key:"pump_house",blocks:[{key:"pump_house_checks",items:[item("pump_house_clean",1)]},{key:"pump_pressure_measurements",items:[{key:"jockey_pump_pressure",label:"Jockey",sortOrder:1,measurements:[{key:"cut_in",label:"In",unit:"PSI"},{key:"cut_out",label:"Out",unit:"PSI"}],result:{control:"good_poor",allowedValues:["good","poor"]}},{key:"standby_pump_cut_in",label:"Standby",sortOrder:2,measurements:[{key:"value",label:"Value",unit:"PSI"}],result:{control:"good_poor",allowedValues:["good","poor"]}}]}]},{key:"hose_reel_drum",blocks:[{key:"hose_reel_rows",columns:[{key:"drum",label:"Drum",sortOrder:1,control:"good_poor",allowedValues:["good","poor"]},{key:"hose",label:"Hose",sortOrder:2,control:"good_poor",allowedValues:["good","poor"]},{key:"nozzle",label:"Nozzle",sortOrder:3,control:"good_poor",allowedValues:["good","poor"]},{key:"valve",label:"Valve",sortOrder:4,control:"good_poor",allowedValues:["good","poor"]},{key:"nozzle_box",label:"Box",sortOrder:5,control:"good_poor",allowedValues:["good","poor"]}]},{key:"comments",field:{control:"remarks"}}]}]};
const system={enabledSystemId:ids.system,systemKey:"hose_reel",displayName:"Hose Reel",sortOrder:1,definitionStatus:"confirmed",zones:[{id:ids.zone,enabledSystemId:ids.system,key:"a",displayName:"Zone A",sortOrder:1}],locations:[{id:ids.location,enabledSystemId:ids.system,zoneId:ids.zone,key:"main",displayName:"Main Floor",presetRowCount:2,rowPreset:{},sortOrder:1}]};
const job={id:ids.job,reference:"HOSE-HARNESS",title:"Hose Harness",status:"open",createdAt:new Date().toISOString(),configurationSnapshot:{schemaVersion:1,customer:{id:ids.customer,code:"TEST",displayName:"Test"},configuration:{revisionId:ids.revision,revisionNumber:1},template:{id:ids.template,code:"MFE-FSSR",name:"Test",version:1},enabledSystems:[system]}},catalog={id:ids.template,code:"MFE-FSSR",name:"Test",version:1,selectionPolicy:"preset_only",headerDefinition:{},reportBoilerplate:{},systems:[{key:"hose_reel",displayName:"Hose Reel",sortOrder:1,definitionStatus:"confirmed",definition}]};
const complete=(record)=>{const r=structuredClone(record.responses);for(const v of Object.values(r.checklist))v.result="good";Object.assign(r.measurements.jockey_pump_pressure,{values:{cut_in:10,cut_out:11},result:"good"});Object.assign(r.measurements.standby_pump_cut_in,{values:{value:12},result:"good"});for(const row of r.rows)Object.assign(row,{drumResult:"good",hoseResult:"good",nozzleResult:"good",valveResult:"good",nozzleBoxResult:"good"});return r};
async function clear(){const records=await localDatabase.masterSystemInspections.where("jobSystemKey").equals(`${ids.job}:hose_reel`).toArray();await localDatabase.transaction("rw",localDatabase.masterSystemInspections,localDatabase.syncOutbox,async()=>{await localDatabase.masterSystemInspections.bulkDelete(records.map(r=>r.clientUuid));for(const r of records){const out=await localDatabase.syncOutbox.where("entityId").equals(r.clientUuid).toArray();await localDatabase.syncOutbox.bulkDelete(out.map(o=>o.operationId))}})}
document.querySelector("#run").onclick=async()=>{outcomes=[];const output=document.querySelector("#result");try{await localDatabase.open();await clear();const[a,b]=await Promise.all([getOrCreateHoseReelInspection(job,system,catalog),getOrCreateHoseReelInspection(job,system,catalog)]),savedRows=a.responses.rows.map(r=>r.rowUuid);const rows=await localDatabase.masterSystemInspections.where("jobSystemKey").equals(`${ids.job}:hose_reel`).toArray();check("concurrent first opening creates exactly one stable inspection",rows.length===1&&a.clientUuid===b.clientUuid,`${rows.length} records`);check("stable client UUID",a.clientUuid===rows[0].clientUuid);check("exact configured-row initialization",a.responses.rows.length===2);check("stable configured row UUIDs",savedRows.join(",")===rows[0].responses.rows.map(r=>r.rowUuid).join(","));check("configured location and ordinal identity remain authoritative",a.responses.rows.map(r=>`${r.configuredLocationId}:${r.sortOrder}`).join(",")===`${ids.location}:1,${ids.location}:2`);const full=complete(a),removed=structuredClone(full);removed.rows.shift();const restored=await saveHoseReelDraft(a,removed);check("configured rows cannot be removed",restored.responses.rows.length===2);const converted=structuredClone(full);Object.assign(converted.rows[0],{source:"technician",configuredLocationId:null,locationSnapshot:null,zoneSnapshot:null});const preserved=await saveHoseReelDraft(restored,converted);check("configured rows cannot be converted",preserved.responses.rows[0].source==="configured"&&preserved.responses.rows[0].configuredLocationId===ids.location);const tech=addHoseReelRow(preserved.responses),withoutTech={...tech,rows:tech.rows.slice(0,2)};check("technician rows can be added and removed while Draft",tech.rows.length===3&&withoutTech.rows.length===2);const firstDraft=await saveHoseReelDraft(preserved,full),live=await localDatabase.masterSystemInspections.get(a.clientUuid);check("partial Draft saves successfully",firstDraft.syncStatus==="Draft");check("Draft survives reload/reopen",live?.clientUuid===a.clientUuid);check("Save Draft reloads the live IndexedDB record",live?.responses.rows.length===2);const newer=await saveHoseReelDraft(firstDraft,{...full,comments:"newer"});check("stale caller cannot overwrite newer Draft",(await saveHoseReelDraft(newer,full)).responses.comments==="");await localDatabase.masterSystemInspections.update(a.clientUuid,{syncStatus:"Pending"});check("stale caller cannot downgrade Pending",await rejected(()=>saveHoseReelDraft(firstDraft,full)));await localDatabase.masterSystemInspections.update(a.clientUuid,{syncStatus:"Syncing"});check("stale caller cannot downgrade Syncing",await rejected(()=>saveHoseReelDraft(firstDraft,full)));await localDatabase.masterSystemInspections.update(a.clientUuid,{syncStatus:"Synced"});check("stale caller cannot downgrade Completed",await rejected(()=>saveHoseReelDraft(firstDraft,full)));await localDatabase.masterSystemInspections.update(a.clientUuid,{syncStatus:"Draft"});const pending=await submitLocalHoseReel(await localDatabase.masterSystemInspections.get(a.clientUuid),full),outbox=await localDatabase.syncOutbox.where("entityId").equals(a.clientUuid).toArray();check("one active parent outbox operation",pending.syncStatus==="Pending"&&outbox.length===1,`0 -> ${outbox.length}`);check("repeated submit does not create duplicate active outbox operations",await rejected(()=>submitLocalHoseReel(pending,full))&&(await localDatabase.syncOutbox.where("entityId").equals(a.clientUuid).count())===1);await localDatabase.masterSystemInspections.update(a.clientUuid,{syncStatus:"Conflict"});const corrected=await editFailedHoseReel({...pending,syncStatus:"Conflict"});check("correction after Failed/Conflict preserves inspection UUID",corrected.clientUuid===a.clientUuid&&corrected.syncStatus==="Draft");check("OFFLINE_UNVERIFIED can open existing local record",Boolean(await localDatabase.masterSystemInspections.get(a.clientUuid)));check("logout does not delete local inspection data",Boolean(await localDatabase.masterSystemInspections.get(a.clientUuid)));const progress={draft:deriveMasterSystemProgress({...a,syncStatus:"Draft"}),pending:deriveMasterSystemProgress({...a,syncStatus:"Pending"}),syncing:deriveMasterSystemProgress({...a,syncStatus:"Syncing"}),failed:deriveMasterSystemProgress({...a,syncStatus:"Failed"}),conflict:deriveMasterSystemProgress({...a,syncStatus:"Conflict"}),synced:deriveMasterSystemProgress({...a,syncStatus:"Synced"}),server:deriveNoLocalSystemProgress(true,"verified","loaded"),none:deriveNoLocalSystemProgress(false,"verified","loaded"),offline:deriveNoLocalSystemProgress(false,"offline-unverified","idle")};check("progress mappings remain correct",JSON.stringify(progress)===JSON.stringify({draft:"Draft",pending:"Pending Sync",syncing:"Syncing",failed:"Needs Attention",conflict:"Needs Attention",synced:"Completed",server:"Completed",none:"Not Started",offline:"Unknown / Not Cached"}));output.textContent=JSON.stringify({status:outcomes.every(x=>x.passed)?"PASS":"FAIL",outcomes},null,2)}catch(error){output.textContent=JSON.stringify({status:"ERROR",message:String(error),outcomes},null,2)}};
</script></body></html>
