<!doctype html><html><body><button id="run">Run completed Accepted App restoration checks</button><pre id="result">Ready</pre><div id="mount"></div><script type="module">

async function clear(){await localDatabase.open();await localDatabase.transaction("rw",localDatabase.masterSystemInspections,localDatabase.authState,localDatabase.referenceData,async()=>{await localDatabase.masterSystemInspections.clear();await localDatabase.authState.clear();await localDatabase.referenceData.clear();});}
async function runCase(kind, unavailable=false){await clear();const job=id(kind==="sprinkler"?1:2),client=id(kind==="sprinkler"?3:4),detail=kind==="sprinkler"?sprinklerDetail(client,job):riserDetail(client,job);await storeVerifiedIdentity(user);const closedJob={id:job,reference:detail.jobReference,title:detail.jobTitle,status:"closed",createdAt:"2026-08-13T00:00:00.000Z",configurationSnapshot:{schemaVersion:1,customer:{id:id(5),code:"T",displayName:"Test"},configuration:{revisionId:id(6),revisionNumber:1},template:{id:id(7),code:"MFE-FSSR",name:"Test",version:1},enabledSystems:[]}};await localDatabase.referenceData.put({key:`inspection-jobs:user:${user.id}`,payload:[closedJob],version:1,fetchedAt:new Date().toISOString(),expiresAt:new Date().toISOString()});await localDatabase.masterSystemInspections.put({clientUuid:client,jobId:job,systemKey:kind==="sprinkler"?"automatic_sprinkler":"dry_wet_riser",syncStatus:"Draft",localUpdatedAt:"2026-08-13T00:00:00.000Z"});let detailCalls=0;const calls=[];const original=globalThis.fetch;globalThis.fetch=async input=>{const url=String(input);calls.push(url);if(url==="/api/auth/me")return new Response(JSON.stringify({user}),{status:200,headers:{"Content-Type":"application/json"}});if(url==="/api/inspection-jobs")return new Response(JSON.stringify({jobs:[closedJob]}),{status:200,headers:{"Content-Type":"application/json"}});if(url.startsWith("/api/master-system-inspections?"))return new Response(JSON.stringify({inspections:[],hasMore:false,nextCursor:null}),{status:200,headers:{"Content-Type":"application/json"}});if(url===`/api/master-system-inspections/${client}`||url===`/api/dry-wet-riser-inspections/${client}`){detailCalls++;return unavailable?new Response("",{status:503}):new Response(JSON.stringify({inspection:detail}),{status:200,headers:{"Content-Type":"application/json"}});}if(url.startsWith("/api/inspection-attachments?"))return new Response(JSON.stringify({attachments:[]}),{status:200,headers:{"Content-Type":"application/json"}});return new Response("",{status:503});};window.location.hash=kind==="sprinkler"?`#/sprinkler-form/${client}`:`#/riser-form/${client}`;const mount=document.querySelector("#mount");mount.replaceChildren();let editable=false;const observer=new MutationObserver(()=>{editable ||= [...mount.querySelectorAll("button")].some(x=>x.textContent==="Save Draft"||x.textContent==="Submit Inspection");});observer.observe(mount,{subtree:true,childList:true});const root=ReactDom.createRoot(mount);root.render(React.createElement(App));try{const routeFailure=kind==="sprinkler"?"Automatic Sprinkler inspection unavailable":"Dry/Wet Riser inspection unavailable";await waitFor(()=>unavailable?detailCalls>0&&mount.textContent.includes(routeFailure)&&mount.textContent.includes("Server inspection detail failed: 503"):mount.textContent.includes(detail.jobTitle));const accepted=!unavailable&&mount.textContent.includes(kind==="sprinkler"?"SERVER SPRINKLER ACCEPTED":"SERVER RISER ACCEPTED");const failedClosed=unavailable&&mount.textContent.includes(routeFailure)&&mount.textContent.includes("Server inspection detail failed: 503")&&!mount.textContent.includes("SERVER ");return {kind:unavailable?`${kind} unavailable`:kind,pass:detailCalls>0&&!editable&&(unavailable?failedClosed:accepted),detailCalls,editable,calls};}catch(error){throw new Error(`${error.message}; ${JSON.stringify({calls,text:mount.textContent})}`)}finally{observer.disconnect();root.unmount();globalThis.fetch=original;}}
