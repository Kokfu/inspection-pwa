<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Fire Alarm V6 offline harness</title></head>
<body><button id="run">Run V6 offline checks</button><pre id="result">Ready</pre>
<script type="module">
import { localDatabase } from "/src/db/localDatabase.ts";
import { getPublishedFireAlarmDefinition } from "/src/fireAlarm/fireAlarmDefinition.ts";
import { getOrCreateFireAlarmInspection, submitFireAlarmLocal } from "/src/fireAlarm/fireAlarmRepository.ts";
import { saveFireAlarmV6Photo } from "/src/fireAlarm/fireAlarmV6Evidence.ts";
import { syncPendingRecords } from "/src/sync/syncEngine.ts";

const id = n => `76000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const output = document.querySelector("#result");
const checks = [];
const check = (name, passed) => checks.push({ name, passed: Boolean(passed) });
const canonical = value => Array.isArray(value) ? `[${value.map(canonical).join(",")}]` : value && typeof value === "object" ? `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}` : JSON.stringify(value);
const digest = async value => [...new Uint8Array(await crypto.subtle.digest("SHA-256", value instanceof Blob ? await value.arrayBuffer() : new TextEncoder().encode(value)))].map(byte => byte.toString(16).padStart(2, "0")).join("");
const outboxForSubmission = async clientUuid => {
  const photos = await localDatabase.inspectionAttachments.where("inspectionClientUuid").equals(clientUuid).toArray();
  const work = await localDatabase.syncOutbox.toArray();
  const form = work.find(item => item.entityType === "masterSystemInspection" && item.entityId === clientUuid);
  const evidence = work.filter(item => item.entityType === "v6StagedEvidence" && photos.some(photo => photo.photoUuid === item.entityId));
  return { photos, form, evidence };
};
const snapshot = async clientUuid => {
  const record = await localDatabase.masterSystemInspections.get(clientUuid);
  const formCount = record ? await localDatabase.masterSystemInspections.where("jobId").equals(record.jobId).count() : 0;
  const work = await outboxForSubmission(clientUuid);
  const formPayload = work.form?.payload;
  const manifest = Array.isArray(formPayload?.evidenceManifest) ? formPayload.evidenceManifest : [];
  const evidence = await Promise.all(work.photos.map(async photo => ({
    fieldPath: photo.fieldPath, photoUuid: photo.photoUuid, sourceSha256: photo.sha256,
    blobSha256: await digest(photo.blob), contractSha256: photo.contractSha256,
    storedSha256: photo.storedSha256 ?? null, syncStatus: photo.syncStatus
  })));
  evidence.sort((left, right) => left.fieldPath.localeCompare(right.fieldPath));
  const evidenceWork = work.evidence.map(item => ({ operationId: item.operationId, entityId: item.entityId, action: item.action, payload: canonical(item.payload), status: item.status, activeKey: item.activeKey ?? null })).sort((left, right) => left.entityId.localeCompare(right.entityId));
  const secondary = record?.systemKey === "fire_alarm_detector" ? record.responses.secondaryAlarmDeviceRows[0] : undefined;
  const poorRemarks = secondary ? {
    alarmBell: { result: secondary.alarmBell, remarks: secondary.fieldRemarks?.alarmBell ?? null, rowRemarks: secondary.remarks },
    manualCallPoint: { result: secondary.manualCallPoint, remarks: secondary.fieldRemarks?.manualCallPoint ?? null, rowRemarks: secondary.remarks }
  } : undefined;
  return {
    identity: {
      form: record && { clientUuid: record.clientUuid, jobId: record.jobId, systemKey: record.systemKey, masterTemplate: record.masterTemplate, configuration: record.configuration, frozenResponse: canonical(formPayload?.responses), frozenPayload: canonical(formPayload), formEntityId: work.form?.entityId, formOperationId: work.form?.operationId, formCount },
      evidence: evidence.map(({ storedSha256, syncStatus, ...identity }) => identity),
      manifest: canonical(manifest), manifestFingerprint: await digest(canonical(manifest)),
      evidenceOutbox: evidenceWork.map(({ status, activeKey, ...identity }) => identity)
    },
    state: { formStatus: record?.syncStatus, formOutboxStatus: work.form?.status, evidence: evidence.map(({ fieldPath, photoUuid, storedSha256, syncStatus }) => ({ fieldPath, photoUuid, storedSha256, syncStatus })), poorRemarks }
  };
};
const v6Definition = () => { const definition = getPublishedFireAlarmDefinition(); for (const section of definition.sections) for (const block of section.blocks) { for (const item of block.items ?? []) if (item.control === "good_poor") item.allowedValues = ["good", "poor", "not_relevant"]; for (const item of block.columns ?? []) if (item.control === "good_poor") item.allowedValues = ["good", "poor", "not_relevant"]; } return definition; };
const fixture = () => { const ids = { job: id(1), customer: id(2), revision: id(3), template: "00000000-0000-4000-8000-000000000806", system: id(5), primary: id(6), secondary: id(7) }; const system = { enabledSystemId: ids.system, systemKey: "fire_alarm_detector", displayName: "Fire Alarm / Detector System", sortOrder: 5, definitionStatus: "confirmed", zones: [], locations: [{ id: ids.primary, enabledSystemId: ids.system, zoneId: null, key: "primary", displayName: "Panel Room", presetRowCount: 1, rowPreset: { fireAlarmTable: "primary", assetReference: "P-1" }, sortOrder: 1 }, { id: ids.secondary, enabledSystemId: ids.system, zoneId: null, key: "secondary", displayName: "Lobby", presetRowCount: 1, rowPreset: { fireAlarmTable: "secondary", assetReference: "S-1" }, sortOrder: 2 }] }; const template = { id: ids.template, code: "MFE-FSSR", name: "MFE Fire System Service Report Template", version: 6, selectionPolicy: "preset_only", headerDefinition: {}, reportBoilerplate: {}, systems: [{ key: system.systemKey, displayName: system.displayName, sortOrder: 5, definitionStatus: "confirmed", definition: v6Definition() }] }; const job = { id: ids.job, reference: "V6-BROWSER", title: "V6 Browser Harness", status: "open", createdAt: new Date().toISOString(), configurationSnapshot: { schemaVersion: 1, customer: { id: ids.customer, code: "V6", displayName: "V6 Customer" }, configuration: { revisionId: ids.revision, revisionNumber: 1 }, template: { id: ids.template, code: "MFE-FSSR", name: template.name, version: 6 }, enabledSystems: [system] } }; return { ids, job, system, catalog: { template: { ...template, id: id(20), version: 1, systems: [] }, templates: [template] } }; };
const requiredResponses = record => { const responses = structuredClone(record.responses); responses.controlPanelLocation = "Panel Room"; for (const row of responses.primaryDeviceRows) Object.assign(row, { alarmZone: "Zone A", location: "Panel Room", manualCallPoint: "normal", flowSwitch: "normal", heatDetector: "normal", smokeDetector: "normal" }); for (const field of Object.values(responses.chargerAndBatteries)) Object.assign(field, { result: "good", remarks: "" }); for (const field of Object.values(responses.mainFunctionKeys)) Object.assign(field, { result: "good", remarks: "" }); Object.assign(responses.chargerAndBatteries.main_supply, { result: "poor", remarks: "Static main-supply own remark" }); Object.assign(responses.chargerAndBatteries.charger, { result: "not_relevant", remarks: "" }); for (const row of responses.secondaryAlarmDeviceRows) Object.assign(row, { alarmBell: "good", manualCallPoint: "good", remarks: "", fieldRemarks: {} }); const row = responses.secondaryAlarmDeviceRows[0]; Object.assign(row, { alarmBell: "poor", manualCallPoint: "poor", remarks: "Row-general remark must not replace either Poor-field remark", fieldRemarks: { alarmBell: "Poor alarm-bell own remark", manualCallPoint: "Poor manual-call-point own remark" } }); return responses; };
const stageRequest = async form => ({ photoUuid: form.get("photoUuid"), inspectionClientUuid: form.get("inspectionClientUuid"), fieldPath: form.get("fieldPath"), sourceSha256: form.get("sha256"), contractSha256: form.get("contractSha256"), blobSha256: await digest(form.get("file")), storedSha256Spoofed: form.get("storedSha256") !== null });
const successfulStage = request => new Response(JSON.stringify({ outcome: "staged", photoUuid: request.photoUuid, fieldPath: request.fieldPath, sourceSha256: request.sourceSha256, storedSha256: "c".repeat(64) }), { status: 201, headers: { "Content-Type": "application/json" } });

document.querySelector("#run").onclick = async () => { try {
  checks.length = 0; const f = fixture(); await localDatabase.open(); await localDatabase.masterSystemInspections.where("jobId").equals(f.ids.job).delete();
  const draft = await getOrCreateFireAlarmInspection(f.job, f.system, f.catalog, { id: 1, username: "browser-tech", role: "inspector" });
  let malformedSubmit = ""; try { await submitFireAlarmLocal(draft, draft.responses); } catch (error) { malformedSubmit = error instanceof Error ? error.message : String(error); }
  check("V6 submit refuses the server-required control-panel, primary-row, and result shape before freezing an outbox payload", malformedSubmit.includes("Primary row 1 requires Alarm Zone, Location and all four Normal/Test/Isolation results"));
  const rowUuid = draft.responses.secondaryAlarmDeviceRows[0].rowUuid;
  const staticField = "charger_batteries.charger_battery_checks.main_supply";
  const fieldA = `alarm_devices.alarm_device_rows.rows.${rowUuid}.alarm_bell`;
  const fieldB = `alarm_devices.alarm_device_rows.rows.${rowUuid}.manual_call_point`;
  await saveFireAlarmV6Photo({ record: draft, fieldPath: staticField, captureSource: "camera", blob: new Blob(["main-supply-image"], { type: "image/jpeg" }), mimeType: "image/jpeg", sizeBytes: 17, width: 1, height: 1, sha256: "c".repeat(64) });
  await saveFireAlarmV6Photo({ record: draft, fieldPath: fieldA, captureSource: "camera", blob: new Blob(["alarm-bell-image"], { type: "image/jpeg" }), mimeType: "image/jpeg", sizeBytes: 16, width: 1, height: 1, sha256: "a".repeat(64) });
  await saveFireAlarmV6Photo({ record: draft, fieldPath: fieldB, captureSource: "gallery", blob: new Blob(["manual-call-point-image"], { type: "image/jpeg" }), mimeType: "image/jpeg", sizeBytes: 23, width: 1, height: 1, sha256: "b".repeat(64) });
  const submitted = await submitFireAlarmLocal(draft, requiredResponses(draft)); const initial = await snapshot(submitted.clientUuid);
  check("V6 submission atomically creates frozen form and three evidence operations", submitted.syncStatus === "Pending" && initial.identity.evidence.length === 3 && initial.identity.evidenceOutbox.length === 3 && initial.identity.manifest !== "[]");
  const frozen = JSON.parse(initial.identity.form.frozenResponse);
  check("static Poor, Good, and Not Relevant values retain their exact V6 response shape", frozen.chargerAndBatteries.main_supply.result === "poor" && frozen.chargerAndBatteries.main_supply.remarks === "Static main-supply own remark" && frozen.chargerAndBatteries.battery.result === "good" && frozen.chargerAndBatteries.charger.result === "not_relevant");
  check("two distinct row Poor own remarks are frozen independently of the row-general remark", initial.state.poorRemarks?.alarmBell?.remarks === "Poor alarm-bell own remark" && initial.state.poorRemarks?.manualCallPoint?.remarks === "Poor manual-call-point own remark" && initial.state.poorRemarks.alarmBell.rowRemarks !== initial.state.poorRemarks.alarmBell.remarks && initial.state.poorRemarks.manualCallPoint.rowRemarks !== initial.state.poorRemarks.manualCallPoint.remarks);
  localStorage.setItem("v6-browser-client", submitted.clientUuid); output.textContent = JSON.stringify({ status: checks.every(item => item.passed) ? "READY_RELOAD" : "FAIL", snapshot: initial, checks });
} catch (error) { output.textContent = JSON.stringify({ status: "ERROR", message: error?.stack ?? String(error), checks }); } };

window.runAfterReload = async () => { try {
  checks.length = 0; const clientUuid = localStorage.getItem("v6-browser-client"); const beforeFailure = await snapshot(clientUuid); const original = globalThis.fetch; const network = { stages: [], acceptance: [], order: [] }; let stageCalls = 0;
  globalThis.fetch = async (input, init = {}) => { const url = input instanceof Request ? input.url : String(input); if (url.includes("/v6-evidence/stage")) { const request = await stageRequest(init.body); network.stages.push(request); network.order.push(`stage:${request.photoUuid}`); stageCalls += 1; if (stageCalls === 2) throw new TypeError("simulated interrupted upload"); return successfulStage(request); } const payload = JSON.parse(init.body); network.acceptance.push(payload); network.order.push("acceptance"); return new Response(JSON.stringify({ acceptedIds: [clientUuid], duplicateIds: [], failed: [] }), { status: 200, headers: { "Content-Type": "application/json" } }); };
  try { await syncPendingRecords(); } finally { globalThis.fetch = original; }
  const afterFailure = await snapshot(clientUuid); const failedPhoto = afterFailure.state.evidence.find(item => item.syncStatus === "Failed");
  check("real reload retains each own Poor remark and row-general remark stays distinct", beforeFailure.state.poorRemarks?.alarmBell?.result === "poor" && beforeFailure.state.poorRemarks?.alarmBell?.remarks === "Poor alarm-bell own remark" && beforeFailure.state.poorRemarks?.manualCallPoint?.result === "poor" && beforeFailure.state.poorRemarks?.manualCallPoint?.remarks === "Poor manual-call-point own remark" && beforeFailure.state.poorRemarks.alarmBell.remarks !== beforeFailure.state.poorRemarks.manualCallPoint.remarks && beforeFailure.state.poorRemarks.alarmBell.rowRemarks !== beforeFailure.state.poorRemarks.alarmBell.remarks);
  check("failed evidence is retryable and blocks acceptance", stageCalls === 3 && network.acceptance.length === 0 && afterFailure.state.formStatus === "Pending" && afterFailure.state.formOutboxStatus === "Pending" && afterFailure.state.evidence.filter(item => item.syncStatus === "Synced").length === 2 && afterFailure.state.evidence.filter(item => item.syncStatus === "Failed").length === 1 && Boolean(failedPhoto));
  check("staging requests use local source identity without spoofing server stored hash", network.stages.length === 3 && network.stages.every(request => !request.storedSha256Spoofed) && network.stages.every(request => beforeFailure.identity.evidence.some(photo => photo.photoUuid === request.photoUuid && photo.fieldPath === request.fieldPath && photo.sourceSha256 === request.sourceSha256 && photo.blobSha256 === request.blobSha256)));
  output.textContent = JSON.stringify({ status: checks.every(item => item.passed) ? "READY_RETRY_RELOAD" : "FAIL", snapshots: { beforeFailure, afterFailure }, network, checks });
} catch (error) { output.textContent = JSON.stringify({ status: "ERROR", message: error?.stack ?? String(error), checks }); } };

window.runAfterFailureReload = async () => { try {
  checks.length = 0; const clientUuid = localStorage.getItem("v6-browser-client"); const beforeRetry = await snapshot(clientUuid); const original = globalThis.fetch; const network = { stages: [], acceptance: [], order: [] };
  globalThis.fetch = async (input, init = {}) => { const url = input instanceof Request ? input.url : String(input); if (url.includes("/v6-evidence/stage")) { const request = await stageRequest(init.body); network.stages.push(request); network.order.push(`stage:${request.photoUuid}`); return successfulStage(request); } const payload = JSON.parse(init.body); network.acceptance.push(payload); network.order.push("acceptance"); return new Response(JSON.stringify({ acceptedIds: [clientUuid], duplicateIds: [], failed: [] }), { status: 200, headers: { "Content-Type": "application/json" } }); };
  try { await syncPendingRecords(); } finally { globalThis.fetch = original; }
  const afterRetry = await snapshot(clientUuid); const sentForm = network.acceptance[0]?.items?.find(item => item.entityType === "masterSystemInspection");
  check("retry stages the original failed evidence before one form acceptance", network.stages.length === 1 && network.acceptance.length === 1 && network.order.at(-1) === "acceptance" && afterRetry.state.evidence.every(item => item.syncStatus === "Synced") && afterRetry.state.formStatus === "Synced" && afterRetry.state.formOutboxStatus === "Completed" && afterRetry.identity.form.formCount === 1);
  check("retry acceptance sends the originally frozen payload", sentForm?.entityId === clientUuid && canonical(sentForm?.payload) === beforeRetry.identity.form.frozenPayload && canonical(sentForm?.payload?.evidenceManifest) === beforeRetry.identity.manifest);
  check("server-normalized stored hashes arrive only in stage responses", afterRetry.state.evidence.every(item => item.storedSha256 === "c".repeat(64)));
  output.textContent = JSON.stringify({ status: checks.every(item => item.passed) ? "PASS" : "FAIL", snapshots: { beforeRetry, afterRetry }, network, checks });
} catch (error) { output.textContent = JSON.stringify({ status: "ERROR", message: error?.stack ?? String(error), checks }); } };
</script></body></html>
