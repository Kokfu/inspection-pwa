<!doctype html><html><body>
<button id="run">Run manager customer configuration checks</button>
<pre id="result">Ready</pre>
<div id="view"></div>
<script type="module">
import * as React from "react";
import { createRoot } from "react-dom/client";
// The consolidation this harness checks is part markup, part stylesheet — pull
// in the real app CSS so a browser screenshot of this page is representative.
import "/src/styles/app.css";
import { ManagerCustomerConfigurationDetail } from "/src/manager/ManagerCustomerConfiguration.tsx";

/**
 * DoD (Phase 8H STEP 3.1 slice 3b): the four per-system editors render inside
 * ONE "Per-service settings" frame with a single configuration-version
 * indicator; the at-a-glance summary reports which of {label overrides, system
 * config, evidence policy, zones+locations} are set per enabled system, read
 * straight off `customer.configuration.enabledSystems` with no extra fetch; and
 * every per-system collapsible shares one affordance (an `Edit … — <system>`
 * toggle with `aria-expanded`, flipping to `Hide …` / `aria-expanded="true"` and
 * a unified "No unsaved changes." line on expand).
 */
const id = (n) => `00000000-0000-4000-8000-${String(n).padStart(12, "0")}`;
const customerId = id(800);
const policyId = id(810);

// A ManagerCustomer whose enabled systems deliberately span all four editors and
// a mix of set / not-set / not-applicable states:
//  - co2_fire_extinguisher  -> label overrides SET, zones+locations SET
//  - automatic_sprinkler    -> evidence policy SET, label overrides NOT set
//  - dry_wet_riser          -> system settings NOT set
//  - wet_chemical           -> ONE zone, ZERO locations (STEP 3.1 final-polish
//    lone-zone case: the server permits saving a zone with no locations, and the
//    summary chip + the untick-drops-config warning must now agree it is real,
//    droppable config).
const customer = {
  customer: { id: customerId, code: "C800", displayName: "Consolidated Customer" },
  sites: [{ id: id(801), code: "S", displayName: "Primary Site" }],
  configuration: {
    id: id(802), revision: 9,
    enabledSystems: [
      {
        key: "co2_fire_extinguisher", displayName: "CO2 Fire Extinguisher System", sortOrder: 1,
        labelOverrides: { "checklist.a.b": "Renamed Field" },
        zones: [{ id: id(821), key: "z1", displayName: "Zone 1" }],
        locations: [{ id: id(831), key: "l1", displayName: "Location 1", zoneId: id(821), presetRowCount: 1 }]
      },
      {
        key: "automatic_sprinkler", displayName: "Automatic Sprinkler System", sortOrder: 2,
        labelOverrides: {}, evidencePolicyId: policyId, zones: [], locations: []
      },
      {
        key: "dry_wet_riser", displayName: "Dry / Wet Riser System", sortOrder: 3,
        systemConfiguration: {}, zones: [], locations: []
      },
      {
        key: "wet_chemical", displayName: "Wet Chemical System", sortOrder: 4,
        zones: [{ id: id(841), key: "wz1", displayName: "Wet Zone 1" }],
        locations: []
      }
    ]
  },
  // co2 is intentionally NOT assignable (no valid zone/location authority yet) so
  // the STEP 3.1-final-polish checks can assert the actionable "Zones &
  // locations" pointer; it stays ticked because it is already in enabledSystems.
  supportedSystems: [
    { key: "co2_fire_extinguisher", displayName: "CO2 Fire Extinguisher System", sortOrder: 1, assignable: false, unavailableReason: "Location configuration required" },
    { key: "automatic_sprinkler", displayName: "Automatic Sprinkler System", sortOrder: 2, assignable: true },
    { key: "dry_wet_riser", displayName: "Dry / Wet Riser System", sortOrder: 3, assignable: true },
    // Assignable so the lone-zone untick assertion can re-tick to restore state,
    // and so it adds no second "editor below" pointer (that check stays scoped).
    { key: "wet_chemical", displayName: "Wet Chemical System", sortOrder: 4, assignable: true }
  ]
};

// The label-overrides GET the co2 sub-editor issues when it is expanded. A valid
// body (mirrors asLabelOverrides) so the collapsible renders its unified
// "No unsaved changes." line.
const json = (payload, status = 200) => new Response(JSON.stringify(payload), { status, headers: { "content-type": "application/json" } });
const realFetch = window.fetch;
window.fetch = async (input, init) => {
  const url = typeof input === "string" ? input : input.url;
  if (url.includes(`/systems/co2_fire_extinguisher/label-overrides`)) {
    await new Promise((r) => setTimeout(r, 15));
    return json({
      systemKey: "co2_fire_extinguisher", templateVersion: 7,
      labels: [{ path: "checklist.a.b", key: "b", definitionLabel: "Original Field", effectiveLabel: "Renamed Field", overridden: true }],
      overrides: { "checklist.a.b": "Renamed Field" }
    });
  }
  // STEP 3.2 slice C: ManagerCustomerConfigurationDetail now always renders a
  // service-history section that fetches on mount. This harness's checks are
  // about the per-service editors above it, so give that fetch a valid (empty)
  // shape rather than falling into the generic `{}` stub below, which is not a
  // valid ManagerServiceHistory response and would trip onAuthorityFailure.
  if (url.includes("/api/manager/service-visits")) return json({ serviceVisits: [], nextCursor: null, totalCount: 0 });
  if (url.includes("/api/manager/")) return json({});
  return realFetch(input, init);
};

const view = document.querySelector("#view");
const result = document.querySelector("#result");
const wait = async (predicate, label) => {
  for (let i = 0; i < 200; i += 1) { if (predicate()) return; await new Promise((r) => setTimeout(r, 15)); }
  throw new Error("timeout: " + label + " — view: " + view.textContent.slice(0, 400));
};
// 2026-09-19: the per-service editors moved behind one card per service in a
// "Services" area (ManagerCustomerServices); each card opens ManagerServiceEditor.
const servicesArea = () => view.querySelector(".manager-services");
const cardFor = (name) => [...view.querySelectorAll(".manager-service-card")].find((el) => el.textContent.includes(name));
const chipsFor = (name) => [...(cardFor(name)?.querySelectorAll(".manager-config-flag") ?? [])].map((el) => el.textContent.trim());
const requested = [];
const trackingFetch = window.fetch;
window.fetch = async (input, init) => { requested.push(typeof input === "string" ? input : input.url); return trackingFetch(input, init); };

document.querySelector("#run").onclick = async () => {
  const checks = [];
  const ok = (name, value) => checks.push({ name, value: !!value });
  let authorityFailures = 0;
  let savedCount = 0;
  try {
    const opened = [];
    createRoot(view).render(React.createElement(ManagerCustomerConfigurationDetail, {
      customer,
      onOpenService: (key) => opened.push(key),
      onBack: () => {},
      onSaved: () => { savedCount += 1; },
      onAuthorityFailure: () => { authorityFailures += 1; }
    }));
    await wait(() => servicesArea(), "Services area rendered");

    // 1. ONE Services area + ONE version indicator inside it; the old frame is gone.
    ok("exactly one Services area", view.querySelectorAll(".manager-services").length === 1);
    ok("Services area heading is Services", servicesArea().querySelector("h3")?.textContent === "Services");
    ok("configuration version indicator shown once in the Services area", (servicesArea().textContent.match(/Version 9(?!\d)/g) || []).length === 1);
    ok("Services area states the versioning semantics", servicesArea().textContent.includes("existing service visits keep the wording and settings they were created with, new visits use the new ones"));
    ok("old Per-service settings frame no longer rendered", !view.querySelector(".manager-per-service"));

    // 2. One card per service; chips read straight off enabledSystems (no extra fetch).
    ok("one card per enabled service", view.querySelectorAll(".manager-service-card").length === 4);
    ok("co2 card: 1 custom label + locations set", chipsFor("CO2 Fire Extinguisher System").join("|") === "1 custom label|1 location set");
    ok("sprinkler card: standard wording + evidence policy set", chipsFor("Automatic Sprinkler System").join("|") === "Standard wording|Evidence policy set");
    ok("riser card: wording not customisable + settings need attention", chipsFor("Dry / Wet Riser System").join("|") === "Wording not customisable|Settings need attention");
    ok("lone-zone wet_chemical zones & locations -> reported as saved config", chipsFor("Wet Chemical System").includes("1 zone, no locations"));
    ok("attention chips carry the attention tone class", view.querySelectorAll(".manager-service-card .manager-config-flag--attention").length === 2);
    ok("no per-service fetch on mount", !requested.some((url) => url.includes("/systems/")));

    // 3. A card opens that service's editor.
    cardFor("CO2 Fire Extinguisher System").click();
    ok("clicking a card opens that service", opened.join(",") === "co2_fire_extinguisher");
    ok("no crash text", !/TypeError|Cannot read/.test(view.textContent));

    // ---- STEP 3.1 final polish: the "Assigned Services" tick-list itself ----
    const picker = view.querySelector(".manager-service-picker");
    const optionFor = (name) => [...picker.querySelectorAll(".manager-service-option")].find((el) => el.textContent.includes(name));
    const co2Option = optionFor("CO2 Fire Extinguisher System");

    // 1a. A location-dependent system that is not yet assignable keeps the server
    // reason AND gains an actionable pointer to the "Zones & locations" editor.
    ok("unassignable co2 still shows the server reason", co2Option.textContent.includes("Location configuration required"));
    ok("unassignable co2 points the Manager at the Zones & locations editor below",
      co2Option.textContent.includes("Zones & locations") && co2Option.textContent.includes("below"));
    ok("the actionable pointer is scoped to location-dependent systems only",
      [...picker.querySelectorAll(".manager-service-option")].filter((el) => el.textContent.includes("editor below")).length === 1);

    // 1b. An already-enabled dry_wet_riser whose stored riserMode is unset
    // surfaces the inline Riser mode control (not only on a fresh tick).
    ok("already-enabled riser with unset riserMode surfaces the inline Riser mode control",
      !!view.querySelector(".manager-riser-mode select"));

    // 1c. Unticking a system that has saved per-service settings warns that the
    // config is dropped and not restored on re-add. Display-only. Uses the
    // assignable `automatic_sprinkler` (evidence policy SET) so it can be
    // re-ticked — an unassignable system disables its own checkbox once removed.
    const sprinklerCheckbox = optionFor("Automatic Sprinkler System").querySelector("input[type=checkbox]");
    ok("sprinkler checkbox starts ticked and interactive", sprinklerCheckbox.checked && !sprinklerCheckbox.disabled);
    sprinklerCheckbox.click();
    await wait(() => view.textContent.includes("previous settings are not restored"), "untick warning shown");
    const untickWarning = [...view.querySelectorAll("form.report-summary p")].find((p) => p.textContent.includes("previous settings are not restored"));
    ok("untick warning names the removed system", untickWarning.textContent.includes("Automatic Sprinkler System"));
    ok("untick warning enumerates the settings that are dropped",
      /zones and locations, field labels, system and evidence settings/i.test(untickWarning.textContent));
    ok("no untick warning while co2 (unchanged) is still ticked", !untickWarning.textContent.includes("CO2 Fire Extinguisher System"));
    sprinklerCheckbox.click(); // restore the original selection
    await wait(() => !view.textContent.includes("previous settings are not restored"), "untick warning clears on re-tick");
    ok("re-ticking clears the untick warning without an authority failure", authorityFailures === 0);

    // ---- STEP 3.1 final-polish P1: the summary chip and the untick-drops-config
    // warning must AGREE on a lone-zone location-dependent system (one zone, zero
    // locations — a state the server permits). Before the fix the chip read
    // "Zones & locations: not set" while unticking still fired the warning: two
    // contradictory signals on one screen. Now both say "has something".
    const wetOption = optionFor("Wet Chemical System");
    const wetCheckbox = wetOption.querySelector("input[type=checkbox]");
    const wetChipSet = () => chipsFor("Wet Chemical System").includes("1 zone, no locations");
    ok("lone-zone wet_chemical checkbox starts ticked and interactive", wetCheckbox.checked && !wetCheckbox.disabled);
    ok("lone-zone wet_chemical: service card chip reports the saved zone before any untick", wetChipSet());
    wetCheckbox.click();
    await wait(() => view.textContent.includes("previous settings are not restored"), "lone-zone untick warning shown");
    const wetWarning = [...view.querySelectorAll("form.report-summary p")].find((p) => p.textContent.includes("previous settings are not restored"));
    const wetWarningFires = !!wetWarning && wetWarning.textContent.includes("Wet Chemical System");
    ok("lone-zone wet_chemical: unticking fires the drop-config warning naming it", wetWarningFires);
    ok("lone-zone wet_chemical: service card chip and untick warning agree (both 'has something')",
      wetChipSet() && wetWarningFires);
    wetCheckbox.click(); // restore the original selection
    await wait(() => !view.textContent.includes("previous settings are not restored"), "lone-zone untick warning clears on re-tick");
    ok("lone-zone wet_chemical: re-ticking clears the warning without an authority failure", authorityFailures === 0);
  } catch (error) {
    checks.push({ name: "harness error: " + (error?.message ?? error), value: false });
  }
  result.textContent = JSON.stringify({ status: checks.every((c) => c.value) ? "PASS" : "FAIL", checks }, null, 2);
};
</script></body></html>
